name: NVP SCALE-03C FFMS2 Indexed Source Windows

concurrency:
  group: nvp-scale03c-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches:
      - nvp/scale03c-ffms2-indexed-seek-20261105
    paths:
      - "backend/nvp_ffms2_*.py"
      - "tools/nvp_ffms2_license_audit.py"
      - "tests/test_nvp_ffms2_cache_maintenance.py"
      - "tests/test_nvp_ffms2_license_audit.py"
      - "backend/nvp_source_window_native_host.py"
      - "backend/nvp_source_window_decode.py"
      - "tools/nvp_source_window_worker.py"
      - "tests/test_nvp_ffms2_indexed_native.py"
      - "tools/nvp_ffms2_license_audit.py"
      - "tests/test_nvp_ffms2_cache_maintenance.py"
      - "tests/test_nvp_ffms2_license_audit.py"
      - ".github/workflows/nvp-scale03c-ffms2.yml"
  pull_request:
    paths:
      - "backend/nvp_ffms2_*.py"
      - "backend/nvp_source_window_native_host.py"
      - "tools/nvp_source_window_worker.py"
      - "tests/test_nvp_ffms2_indexed_native.py"
      - ".github/workflows/nvp-scale03c-ffms2.yml"
  workflow_dispatch:

jobs:
  real-native-ffms2-indexed-decoder:
    name: FFMS2 native ${{ matrix.os }} Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025]
        python: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: Install FFmpeg, FFprobe and FFMS2 on Linux
        if: runner.os == 'Linux'
        shell: bash
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg libffms2-5 ffmsindex
          library="$(find /usr/lib -name 'libffms2.so.5' -print -quit)"
          test -n "$library"
          echo "NVP_FFMS2_LIBRARY=$library" >> "$GITHUB_ENV"

      - uses: msys2/setup-msys2@v2
        if: runner.os == 'Windows'
        with:
          msystem: MINGW64
          update: true
          install: mingw-w64-x86_64-ffms2

      - name: Install Windows FFmpeg and Job Object bindings
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          choco install ffmpeg -y --no-progress
          python -m pip install pywin32
          $library = 'C:\msys64\mingw64\bin\libffms2-5.dll'
          if (-not (Test-Path $library)) { throw "FFMS2 native DLL missing" }
          "NVP_FFMS2_LIBRARY=$library" >> $env:GITHUB_ENV

      - name: Verify actual native toolchain
        shell: bash
        run: |
          ffmpeg -version
          ffprobe -version
          python -c "import os; from backend.nvp_ffms2_native import FFMS2; lib=FFMS2(os.environ['NVP_FFMS2_LIBRARY']); print('NATIVE_FFMS2_VERSION',hex(lib.version),'NATIVE_SHA',lib.library_sha256)"

      - name: Development binary-license inventory (not release approval)
        shell: bash
        run: |
          if [[ "$RUNNER_OS" == "Windows" ]]; then
            FFMPEG_EXE="$(command -v ffmpeg)"
          else
            FFMPEG_EXE="$(command -v ffmpeg)"
          fi
          python tools/nvp_ffms2_license_audit.py --ffmpeg "$FFMPEG_EXE" --ffms2-library "$NVP_FFMS2_LIBRARY"
      - name: Python production module compilation
        shell: bash
        run: |
          python -m compileall -q backend/nvp_ffms2_native.py backend/nvp_ffms2_index_cache.py backend/nvp_ffms2_index_maintenance.py backend/nvp_ffms2_source_window.py backend/nvp_source_window_native_host.py backend/nvp_source_window_decode.py tools/nvp_source_window_worker.py tools/nvp_ffms2_license_audit.py tests/test_nvp_ffms2_indexed_native.py tests/test_nvp_ffms2_cache_maintenance.py tests/test_nvp_ffms2_license_audit.py

      - name: Verify upgrade notices and release license inventory policy
        shell: bash
        run: |
          python -m unittest discover -s tests -p "test_nvp_ffms2_cache_maintenance.py" -v
          python -m unittest discover -s tests -p "test_nvp_ffms2_license_audit.py" -v
      - name: Real indexed frame-seek and contained native review acceptance
        shell: bash
        run: python -m unittest discover -s tests -p "test_nvp_ffms2_indexed_native.py" -v
