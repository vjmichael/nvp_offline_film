name: NVP FILM03-08 ActorID Guide Voice Conversion Source (NO FFMPEG)

on:
  push:
    branches: [nvp/film03-08-guide-performance-voice-conversion-20261108]
  pull_request:
    branches: [nvp/film03-07-expressive-voice-audition-lab-20261108]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nvp-film03-08-${{ github.event_name }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  guide-actor-contract:
    name: NVP human/TTS guide conversion intent & source custody / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 70
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install original OpenUSD and actual source test dependencies
        run: |
          python -m pip install -r requirements-foundation.txt
          python -m pip install --only-binary=:all: "usd-core==26.11" numpy Pillow
          python -m pip install httpx2
      - name: Compile original source and permission-aware voice conversion modules
        run: |
          python -m compileall -q backend/nvp_film03_voice_conversion_intent.py backend/nvp_film03_voice_performance_lab.py backend/nvp_film03_expressive_voice_direction.py tests/test_nvp_film03_voice_conversion_intent.py
      - name: Actual native original PCM source readback and wrong VoiceID/direction refusal
        run: python -m unittest discover -s tests -p test_nvp_film03_voice_conversion_intent.py -v
      - name: Maintain earlier cinematic direction and actual PCM lab source evidence
        run: |
          python -m unittest discover -s tests -p test_nvp_film03_expressive_voice_direction.py -v
          python -m unittest discover -s tests -p test_nvp_film03_voice_performance_lab.py -v
