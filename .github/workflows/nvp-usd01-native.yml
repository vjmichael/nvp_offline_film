name: NVP USD-01 OpenUSD Composed Scenes and Frozen Timed Takes

on:
  push:
    branches:
      - nvp/usd01-compose-time-take-20261105
    paths:
      - "backend/nvp_openusd_*.py"
      - "tests/test_nvp_openusd_take_native.py"
      - "docs/NVP_USD01_OPENUSD_SCENE_TEMPORAL_TAKE.md"
      - ".github/workflows/nvp-usd01-native.yml"
  pull_request:
    paths:
      - "backend/nvp_openusd_*.py"
      - "tests/test_nvp_openusd_take_native.py"
      - "docs/NVP_USD01_OPENUSD_SCENE_TEMPORAL_TAKE.md"
      - ".github/workflows/nvp-usd01-native.yml"
  workflow_dispatch:

concurrency:
  group: nvp-usd01-${{ github.ref }}
  cancel-in-progress: true

jobs:
  native-openusd-integration:
    name: OpenUSD ${{ matrix.os }} Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025]
        python: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install actual OpenUSD core native libraries
        shell: bash
        run: |
          python -m pip install --upgrade pip
          python -m pip install --only-binary=:all: "usd-core==26.11"
      - name: Confirm actual native USD composition runtime
        shell: bash
        run: |
          python -c "from pxr import Usd,Sdf,UsdGeom,Gf; s=Usd.Stage.CreateInMemory(); p=UsdGeom.Xform.Define(s,'/World'); print('NATIVE_USD_READY',bool(p.GetPrim()),s.GetTimeCodesPerSecond())"
      - name: Compile production bridge and tests
        shell: bash
        run: |
          python -m compileall -q backend/nvp_openusd_scene.py backend/nvp_openusd_take.py backend/nvp_openusd_presentation.py tests/test_nvp_openusd_take_native.py
      - name: Native layered composition + exact-time transform + immutable Digital Take
        shell: bash
        run: python -m unittest discover -s tests -p "test_nvp_openusd_take_native.py" -v
      - name: Confirm existing temporal ledger behavior
        shell: bash
        run: python -m unittest discover -s tests -p "test_nvp_temporal_ledger.py" -v
