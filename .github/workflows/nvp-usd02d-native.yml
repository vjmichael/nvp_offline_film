name: NVP USD-02D Native Camera Light Skeleton

on:
  push:
    branches:
      - nvp/usd02d-native-schemas-20261105
    paths:
      - "backend/nvp_openusd_*.py"
      - "tests/test_nvp_openusd_native_schemas.py"
      - ".github/workflows/nvp-usd02d-native.yml"
      - "docs/NVP_USD02D_NATIVE_CAMERA_LIGHT_SKELETON.md"
  pull_request:
    paths:
      - "backend/nvp_openusd_*.py"
      - "tests/test_nvp_openusd_native_schemas.py"
      - ".github/workflows/nvp-usd02d-native.yml"
      - "docs/NVP_USD02D_NATIVE_CAMERA_LIGHT_SKELETON.md"
  workflow_dispatch:

concurrency:
  group: nvp-usd02d-${{ github.ref }}
  cancel-in-progress: true

jobs:
  usd-native-schemas:
    name: USD02D ${{ matrix.os }} Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025]
        python: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: Install real OpenUSD runtime
        shell: bash
        run: |
          python -m pip install --upgrade pip
          python -m pip install --only-binary=:all: "usd-core==26.11"

      - name: Confirm native Camera Light and Skel schemas
        shell: bash
        run: |
          python -c "from pxr import Usd,UsdGeom,UsdSkel,UsdLux; s=Usd.Stage.CreateInMemory(); c=UsdGeom.Camera.Define(s,'/World/Camera'); l=UsdLux.SphereLight.Define(s,'/World/Light'); r=UsdSkel.Root.Define(s,'/World/Rig'); print('NVP_NATIVE_USD_SCHEMAS',bool(c),bool(l),bool(r))"

      - name: Compile actual production bridge and tests
        shell: bash
        run: |
          python -m compileall -q backend/nvp_openusd_scene.py backend/nvp_openusd_native_schemas.py backend/nvp_openusd_skeleton.py backend/nvp_openusd_channels.py backend/nvp_openusd_time_state.py backend/nvp_openusd_take.py backend/nvp_openusd_presentation.py tests/test_nvp_openusd_native_schemas.py

      - name: Real camera light and skeletal time sampling
        shell: bash
        run: python -m unittest discover -s tests -p "test_nvp_openusd_native_schemas.py" -v

      - name: Legacy scene and frozen performance regressions
        shell: bash
        run: |
          python -m unittest discover -s tests -p "test_nvp_openusd_channels_native.py" -v
          python -m unittest discover -s tests -p "test_nvp_openusd_reusable_assets.py" -v
          python -m unittest discover -s tests -p "test_nvp_openusd_take_native.py" -v
