name: NVP SLATE-06 Exact Approval Identity Debug Native

on:
  push:
    branches: [nvp/p1de-p1f-p2-source-reconciliation-20261113]
    paths:
      - 'tests/test_nvp_slate06_approval_identity.py'
      - 'backend/nvp_slate_preview_host.py'
      - '.github/workflows/nvp-slate06-approval-identity.yml'
  pull_request:
    paths:
      - 'tests/test_nvp_slate06_approval_identity.py'
      - 'backend/nvp_slate_preview_host.py'
      - '.github/workflows/nvp-slate06-approval-identity.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: slate06-approval-identity-${{ github.ref }}
  cancel-in-progress: true

jobs:
  original-approval-identity:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Native OpenUSD and reviewed testing dependencies
        run: |
          python -m pip install --only-binary=:all: 'usd-core==26.11'
          python -m pip install -r requirements-foundation.txt
      - name: Exact original SLATE-06 approval identity proof
        run: python -m unittest discover -s tests -p 'test_nvp_slate06_approval_identity.py' -v
