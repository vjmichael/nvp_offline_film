name: NVP AUDIO-01I native mastering and delivery acceptance
on:
  push:
    branches:
      - nvp/stack02c3b14-picture-conform-20261104
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native-audio-master-delivery:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025]
        python-version: ['3.11', '3.13']
    runs-on: ${{ matrix.os }}
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Ensure real FFmpeg on Linux
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
      - name: Ensure real FFmpeg and Job Object bindings on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          python -m pip install "pywin32>=306"
          if (-not (Get-Command ffmpeg -ErrorAction SilentlyContinue)) {
            choco install ffmpeg -y --no-progress
          }
          "$env:ChocolateyInstall\bin" | Out-File -FilePath $env:GITHUB_PATH -Append
      - name: Prove real media prerequisites
        shell: bash
        run: |
          ffmpeg -version
          ffprobe -version
      - name: Native AUDIO-01I candidate and delivery acceptance
        shell: bash
        run: |
          set -euo pipefail
          python -m compileall -q backend/nvp_audio01i_mastering.py backend/nvp_audio01i_native_host.py tools/nvp_audio01i_native_worker.py tools/nvp_audio01i_inspect_worker.py backend/nvp_audio01i_fault_matrix.py tests/test_audio01i_native_master_delivery.py tests/test_audio01i_master_host_crash_matrix.py tests/test_audio01i_master_worker_crash_matrix.py tests/test_audio01i_delivery_crash_matrix.py tests/test_audio01i_fault_coverage.py
          python -m unittest discover -s tests -p test_audio01i_native_master_delivery.py -v
          python -m unittest discover -s tests -p test_audio01i_master_host_crash_matrix.py -v
          python -m unittest discover -s tests -p test_audio01i_master_worker_crash_matrix.py -v
          python -m unittest discover -s tests -p test_audio01i_delivery_crash_matrix.py -v
          python -m unittest discover -s tests -p test_audio01i_fault_coverage.py -v
