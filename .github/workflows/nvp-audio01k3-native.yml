name: NVP AUDIO-01K3 real SMPTE DCP-native acceptance
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  actual-cinema:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025]
        python-version: ['3.11', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install NVP foundation dependencies
        shell: bash
        run: python -m pip install -r requirements-foundation.txt
      - name: Require independently provisioned actual cinema binaries
        shell: bash
        run: |
          set -euo pipefail
          for bin in ffmpeg ffprobe dcpomatic2_create dcpomatic2_cli dcpdoctor xmllint; do
            command -v "$bin" || { echo "::error::Missing actual cinema binary $bin: install vetted cross-platform package"; exit 1; }
          done
          dcpomatic2_create --version
          dcpomatic2_cli --version
          dcpdoctor --version
      - name: Run actual SMPTE 2K picture/sound MXF, CPL PKL ASSETMAP and strict independent QC
        shell: bash
        run: |
          set -euo pipefail
          python -m unittest discover -s tests -p test_audio01k3_native_dcp.py -v
