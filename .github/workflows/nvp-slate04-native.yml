name: NVP SLATE-04 Immutable Data Thin Timeline and Lazy Preview

on:
  push:
    branches:
      - nvp/slate04-lazy-preview-source-custody-20261106
    paths:
      - "backend/nvp_slate_lazy_preview.py"
      - "backend/nvp_film_source_lifecycle.py"
      - "backend/nvp_slate_edit_assembly.py"
      - "backend/nvp_film_index.py"
      - "tests/test_nvp_digital_slate_branches_native.py"
      - "frontend/src/SlateBranchTimelinePane*"
      - "docs/NVP_SLATE04_REFERENCE_ONLY_EDITING_LAZY_PREVIEW.md"
      - ".github/workflows/nvp-slate04-native.yml"
  pull_request:
    paths:
      - "backend/nvp_slate_lazy_preview.py"
      - "backend/nvp_film_source_lifecycle.py"
      - "backend/nvp_slate_edit_assembly.py"
      - "backend/nvp_film_index.py"
      - "tests/test_nvp_digital_slate_branches_native.py"
      - "frontend/src/SlateBranchTimelinePane*"
      - "docs/NVP_SLATE04_REFERENCE_ONLY_EDITING_LAZY_PREVIEW.md"
      - ".github/workflows/nvp-slate04-native.yml"
  workflow_dispatch:

concurrency:
  group: nvp-slate04-${{ github.ref }}
  cancel-in-progress: true

jobs:
  source-truth-and-lazy-seek:
    name: SLATE-04 ${{ matrix.os }} Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025]
        python: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install real native OpenUSD for on-demand source-state tests
        shell: bash
        run: |
          python -m pip install --upgrade pip
          python -m pip install --only-binary=:all: "usd-core==26.11"
      - name: Compile reference-only cut, scene seek and source lifecycle
        shell: bash
        run: |
          python -m compileall -q backend/nvp_slate_lazy_preview.py backend/nvp_film_source_lifecycle.py backend/nvp_slate_edit_assembly.py backend/nvp_film_index.py tests/test_nvp_digital_slate_branches_native.py
          python -c "from pxr import Usd,UsdGeom; print('REAL_OPENUSD',Usd.GetVersion())"
      - name: Native thin Film Time assembly, lazy 3D preview and deletion guards
        shell: bash
        run: |
          python -m unittest discover -s tests -p "test_nvp_digital_slate_branches_native.py" -v
          python -m unittest discover -s tests -p "test_nvp_openusd_shot_overrides_native.py" -v
      - name: FilmIndex custody and original immutable revision regressions
        shell: bash
        run: |
          python -m unittest discover -s tests -p "test_film_index.py" -v

  editor-reference-clipboard:
    name: SLATE-04 React draft-only cut copy paste and lazy preview buttons
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install native NVP editor dependencies
        run: npm install --no-audit --no-fund
      - name: Build source-reference editor
        run: npm run build
      - name: Check committed cut stays green during draft cut/copy/paste
        run: npm run test:ui -- src/SlateBranchTimelinePane.test.jsx
