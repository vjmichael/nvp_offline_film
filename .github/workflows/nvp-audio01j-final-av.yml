name: NVP AUDIO-01J final audiovisual native export
on:
  push:
    branches:
      - nvp/stack02c3b14-picture-conform-20261104
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native-final-av:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025]
        python-version: ['3.11', '3.13']
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install NVP foundation Python requirements
        run: python -m pip install -r requirements-foundation.txt
      - name: Install native FFmpeg/FFprobe on Linux
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
      - name: Install native FFmpeg and Job Object bindings on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          python -m pip install "pywin32>=306"
          if (-not (Get-Command ffmpeg -ErrorAction SilentlyContinue)) {
            choco install ffmpeg -y --no-progress
          }
          "$env:ChocolateyInstall\bin" | Out-File -FilePath $env:GITHUB_PATH -Append
      - name: Real native tools mandatory
        shell: bash
        run: |
          ffmpeg -version
          ffprobe -version
      - name: Execute real approved picture plus final audio master MOV acceptance
        shell: bash
        run: |
          set -euo pipefail
          python -m compileall -q backend/nvp_audio01j_picture_lock.py backend/nvp_audio01j_final_av.py backend/nvp_audio01j_native_host.py tools/nvp_audio01j_native_worker.py tests/test_audio01j_native_final_av.py tests/test_audio01j_final_av_crash_matrix.py tests/test_audio01j_picture_lock_crash_matrix.py tests/test_audio01j_fault_coverage.py backend/nvp_audio01j_fault_matrix.py
          python -m unittest discover -s tests -p test_audio01j_native_final_av.py -v
          python -m unittest discover -s tests -p test_audio01j_final_av_crash_matrix.py -v
          python -m unittest discover -s tests -p test_audio01j_picture_lock_crash_matrix.py -v
          python -m unittest discover -s tests -p test_audio01j_fault_coverage.py -v
