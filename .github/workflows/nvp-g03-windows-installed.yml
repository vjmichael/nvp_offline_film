name: G03 Director Film Home Installed Windows NSIS Acceptance
# Isolated G03 acceptance workflow; does not modify canonical DATA-AV PR #74.
on:
  push:
    branches:
      - nvp/g03-film-home-project-access-20261110
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native-installer:
    runs-on: windows-2025
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify NVP packaging guard rejects fake Windows payloads
        shell: bash
        run: |
          set -euo pipefail
          python -m unittest discover -s tests -p test_nvp_e2e01e_package_guard.py -v
      - name: Build offline React application
        shell: pwsh
        run: |
          Push-Location frontend
          npm install --no-audit --no-fund
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm run build
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Pop-Location
          if (-not (Test-Path frontend/dist/index.html)) { throw 'No bundled UI' }
          if (-not (Test-Path frontend/dist/postproduction.html)) { throw 'Missing separate film editor' }
          if (-not (Test-Path frontend/dist/assets -PathType Container)) { throw 'Missing offline assets' }
      - name: Install native desktop and packaging dependencies
        shell: pwsh
        run: |
          python -m pip install -r requirements-foundation.txt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          # SLATE-08B's bundled native scene readers must have real OpenUSD.
          python -m pip install --only-binary=:all: 'usd-core==26.11'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m pip install 'pyinstaller>=6.10,<7' 'pywebview>=5.3,<7' 'pywin32>=306' 'opentimelineio>=0.18.1,<0.19'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          choco install nsis -y --no-progress
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Compile actual desktop entry and build one-directory native EXE
        shell: pwsh
        run: |
          python -m compileall -q tools/nvp_desktop_alpha.py
          python -m PyInstaller --noconfirm --clean --onedir --windowed --name NVP --paths . --add-data 'frontend/dist;frontend/dist' --collect-all webview --collect-all pxr --collect-submodules backend tools/nvp_desktop_alpha.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if (-not (Test-Path dist/NVP/NVP.exe)) { throw 'Missing NVP executable' }
          python tools/nvp_e2e01e_validate_installer_payload.py --bundle dist/NVP --report "$env:RUNNER_TEMP/nvp-alpha-bundle-audit.json"
          if ($LASTEXITCODE -ne 0) { throw 'NSIS payload failed architecture and bundled-UI audit' }
          & 'dist/NVP/NVP.exe' --smoke
          if ($LASTEXITCODE -ne 0) { throw 'Uninstalled native alpha smoke failed' }
      - name: Create NSIS single-click installer
        shell: pwsh
        run: |
          $candidates = @(
            (Join-Path ${env:ProgramFiles(x86)} 'NSIS/makensis.exe'),
            (Join-Path $env:ProgramFiles 'NSIS/makensis.exe'),
            (Join-Path $env:ChocolateyInstall 'bin/makensis.exe')
          )
          $nsis = $candidates | Where-Object { Test-Path $_ -PathType Leaf } | Select-Object -First 1
          if (-not $nsis) { throw 'Pinned installed NSIS makensis.exe not found' }
          & $nsis '/V3' 'packaging/nvp-alpha.nsi'
          if ($LASTEXITCODE -ne 0) { throw 'NSIS failed' }
          if (-not (Test-Path 'dist/NVP-Alpha-Setup.exe')) { throw 'Missing NSIS installer' }
      - name: Silent install and execute installed native alpha
        shell: pwsh
        run: |
          $env:NVP_SMOKE_DIAGNOSTIC_PATH=Join-Path $env:RUNNER_TEMP 'nvp-g03-installed-smoke-stages.txt'
          function Run-Checked([string]$exe,[string]$argument,[int]$seconds,[string]$label) {
            Add-Content -Path $env:NVP_SMOKE_DIAGNOSTIC_PATH -Value ("WIN_CI_BEGIN "+$label)
            $p=Start-Process -FilePath $exe -ArgumentList $argument -PassThru
            if (-not $p.WaitForExit($seconds*1000)) {
              & taskkill.exe /PID $p.Id /T /F 2>$null | Out-Null
              Get-Content -Path $env:NVP_SMOKE_DIAGNOSTIC_PATH
              throw "Installed native process timed out: $label ($seconds seconds)"
            }
            Add-Content -Path $env:NVP_SMOKE_DIAGNOSTIC_PATH -Value ("WIN_CI_EXIT "+$label+" "+$p.ExitCode)
            if ($p.ExitCode -ne 0) {
              Get-Content -Path $env:NVP_SMOKE_DIAGNOSTIC_PATH
              throw "Installed native process failed: $label with code $($p.ExitCode)"
            }
          }
          $setup=(Resolve-Path 'dist/NVP-Alpha-Setup.exe').Path
          Run-Checked $setup '/S' 180 'nsis_silent_install'
          $installed=Join-Path $env:LOCALAPPDATA 'Programs/NVP/NVP.exe'
          if (-not (Test-Path $installed)) { throw 'Installed NVP.exe missing' }
          $builtHash=(Get-FileHash 'dist/NVP/NVP.exe' -Algorithm SHA256).Hash
          $installedHash=(Get-FileHash -LiteralPath $installed -Algorithm SHA256).Hash
          if ($installedHash -ne $builtHash) { throw 'Installed NVP.exe does not match verified build payload' }
          $env:NVP_HOME=Join-Path $env:RUNNER_TEMP 'nvp-original-installed-projects'
          Run-Checked $installed '--smoke-create' 110 'installed_project_create'
          Run-Checked $installed '--smoke-reopen' 110 'installed_project_reopen'
          if (-not (Test-Path (Join-Path $env:NVP_HOME 'nvp_studio.sqlite3'))) {
            throw 'No persistent original film project database'
          }
          Get-Content -Path $env:NVP_SMOKE_DIAGNOSTIC_PATH
      - name: Require actual director home, Resume and separate editor in real WebView2
        shell: pwsh
        run: |
          $installed=Join-Path $env:LOCALAPPDATA 'Programs/NVP/NVP.exe'
          $p=Start-Process -FilePath $installed -ArgumentList '--smoke-g03-window' -PassThru
          if (-not $p.WaitForExit(110000)) {
            & taskkill.exe /PID $p.Id /T /F 2>$null | Out-Null
            throw 'Native G03 WebView2 acceptance timed out at 110 seconds'
          }
          if ($p.ExitCode -ne 0) {
            if (Test-Path $env:NVP_SMOKE_DIAGNOSTIC_PATH) {
              Get-Content $env:NVP_SMOKE_DIAGNOSTIC_PATH
            }
            throw 'Real G03 WebView2 filmmaker navigation did not pass'
          }
      - name: Uninstall without deleting creator project data
        shell: pwsh
        run: |
          $uninstaller=Join-Path $env:LOCALAPPDATA 'Programs/NVP/Uninstall NVP.exe'
          if (-not (Test-Path $uninstaller)) { throw 'Uninstaller missing' }
          $owned=$env:NVP_HOME
          if (-not (Test-Path (Join-Path $owned 'nvp_studio.sqlite3'))) {
            throw 'Missing creator SQLite film database before uninstall'
          }
          $result=Start-Process -FilePath $uninstaller -ArgumentList '/S' -PassThru
          if (-not $result.WaitForExit(120000)) {
            & taskkill.exe /PID $result.Id /T /F 2>$null | Out-Null
            throw 'Native NVP NSIS uninstall timed out'
          }
          if ($result.ExitCode -ne 0) { throw 'Uninstall failed' }
          Start-Sleep -Seconds 2
          if (-not (Test-Path (Join-Path $owned 'nvp_studio.sqlite3'))) { throw 'Uninstall deleted saved film' }
          if (Test-Path (Join-Path $env:LOCALAPPDATA 'Programs/NVP/NVP.exe')) { throw 'Uninstall left executable' }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nvp-g03-windows-installed-smoke-stage-logs
          path: ${{ runner.temp }}/nvp-g03-installed-smoke-stages.txt
          if-no-files-found: warn
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nvp-g03-windows-bundle-audit
          path: ${{ runner.temp }}/nvp-alpha-bundle-audit.json
          if-no-files-found: warn
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nvp-g03-windows-nsis-candidate
          path: dist/NVP-Alpha-Setup.exe
          if-no-files-found: warn
          retention-days: 7

