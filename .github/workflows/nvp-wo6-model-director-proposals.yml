name: NVP WO6-07A Source-Grounded Local Director Suggestions (NO FFMPEG)

on:
  push:
    branches: [nvp/wo6-director-model-proposal-20261107]
  pull_request:
    paths:
      - backend/nvp_wo6_director_model_proposal.py
      - backend/nvp_wo6_desktop_bridge.py
      - tests/test_nvp_wo6_director_model_proposal.py
      - frontend/src/WO6CreatorActionsPanel.jsx
      - frontend/src/WO6CreatorActionsPanel.test.jsx
      - .github/workflows/nvp-wo6-model-director-proposals.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nvp-wo6-07a-${{ github.event_name }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  source-bound-proposal:
    name: Real OpenUSD source / nonblocking untrusted model / ${{ matrix.os }} / Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025]
        python: ['3.11', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install real native OpenUSD for the source verification fixture
        run: 'python -m pip install --only-binary=:all: "usd-core==26.11"'
      - name: Compile the bounded read-only model adaptor and native director bridge
        run: python -m compileall -q backend/nvp_wo6_director_model_proposal.py backend/nvp_wo6_desktop_bridge.py tests/test_nvp_wo6_director_model_proposal.py
      - name: Verify actual source-reopened frozen OpenUSD and no AI-created authority
        run: python -m unittest discover -s tests -p test_nvp_wo6_director_model_proposal.py -v
      - name: Preserve original native creative and dispatch approval regressions
        run: python -m unittest discover -s tests -p test_nvp_wo6_desktop_bridge.py -v

  desktop-proposal-ui:
    name: React verified-Take local AI suggestion review cannot auto-execute
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install NVP UI dependencies without creating a repository lockfile
        working-directory: frontend
        run: npm install --no-audit --no-fund --package-lock=false
      - name: Build real NVP React director panel
        working-directory: frontend
        run: npm run build
      - name: Verify AI text never becomes an approval, HTML tool, or worker
        working-directory: frontend
        run: npx vitest run src/WO6CreatorActionsPanel.test.jsx
