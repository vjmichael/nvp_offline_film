name: NVP SLATE-02 Native Mixed-Take Cut and Branch Pane

on:
  push:
    branches:
      - nvp/slate02-assembly-preview-commit-20261106
    paths:
      - "backend/nvp_slate_edit_assembly.py"
      - "backend/nvp_digital_slate_branches.py"
      - "tests/test_nvp_digital_slate_branches_native.py"
      - "frontend/src/SlateBranchTimelinePane*"
      - "docs/NVP_SLATE02_ASSEMBLED_CUT_AND_DETACHABLE_BRANCH_VIEW.md"
      - ".github/workflows/nvp-slate02-native.yml"
  pull_request:
    paths:
      - "backend/nvp_slate_edit_assembly.py"
      - "backend/nvp_digital_slate_branches.py"
      - "tests/test_nvp_digital_slate_branches_native.py"
      - "frontend/src/SlateBranchTimelinePane*"
      - "docs/NVP_SLATE02_ASSEMBLED_CUT_AND_DETACHABLE_BRANCH_VIEW.md"
      - ".github/workflows/nvp-slate02-native.yml"
  workflow_dispatch:

concurrency:
  group: nvp-slate02-${{ github.ref }}
  cancel-in-progress: true

jobs:
  mixed-take-assembly:
    name: SLATE-02 backend ${{ matrix.os }} Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025]
        python: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install genuine OpenUSD source runtime
        shell: bash
        run: |
          python -m pip install --upgrade pip
          python -m pip install --only-binary=:all: "usd-core==26.11"
      - name: Compile new branch assembly implementation
        shell: bash
        run: |
          python -m compileall -q backend/nvp_slate_edit_assembly.py backend/nvp_digital_slate_branches.py tests/test_nvp_digital_slate_branches_native.py
          python -c "from pxr import Usd,UsdGeom; print('NATIVE_USD',Usd.GetVersion())"
      - name: Real source Take and 60-take mixed assembled cut acceptance
        shell: bash
        run: |
          python -m unittest discover -s tests -p "test_nvp_digital_slate_branches_native.py" -v
          python -m unittest discover -s tests -p "test_nvp_openusd_shot_overrides_native.py" -v

  detached-pane-ui:
    name: SLATE-02 React pane / inspection versus approval
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm install --no-audit --no-fund
      - run: npm run build
      - run: npm run test:ui -- src/SlateBranchTimelinePane.test.jsx
