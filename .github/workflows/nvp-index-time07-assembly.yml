name: NVP INDEX-TIME-07 Immutable Footage Assembly

on:
  push:
    branches:
      - nvp/index-time07-immutable-footage-assembly-20261106
  pull_request:
    paths:
      - 'backend/nvp_index_time07_assembly.py'
      - 'backend/nvp_index_time06_native_desktop.py'
      - 'backend/nvp_film_time_editorial.py'
      - 'frontend/src/FilmTimeAssemblyPanel.jsx'
      - 'frontend/src/FilmTimeIndexPanel.jsx'
      - 'frontend/src/filmTimeClock.js'
      - 'frontend/src/FilmTimeAssemblyPanel.test.jsx'
      - 'tests/test_nvp_index_time07_assembly.py'
      - 'tools/nvp_desktop_alpha.py'
      - '.github/workflows/nvp-index-time07-assembly.yml'
  workflow_dispatch:

permissions:
  contents: read
concurrency:
  group: nvp-index-time07-${{ github.ref }}
  cancel-in-progress: true

jobs:
  native-original-pts-editorial:
    name: INDEX-TIME-07 ${{ matrix.os }} Python ${{ matrix.python }} actual VFR
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025]
        python: ['3.11', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install NVP project foundation
        shell: bash
        run: python -m pip install -r requirements-foundation.txt
      - name: Require real Linux native FFmpeg and FFprobe
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y ffmpeg
      - name: Require Windows native FFmpeg and Job Object support
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          choco install ffmpeg -y --no-progress
          if ($LASTEXITCODE -ne 0) { throw 'Required native decoder installation failed' }
          Join-Path $env:ChocolateyInstall 'bin' | Out-File -FilePath $env:GITHUB_PATH -Append
          python -m pip install 'pywin32>=306'
          if ($LASTEXITCODE -ne 0) { throw 'Windows native worker containment unavailable' }
      - name: Compile immutable editorial controller and native host
        shell: bash
        run: |
          set -euo pipefail
          ffmpeg -hide_banner -version
          ffprobe -hide_banner -version
          python -m compileall -q backend/nvp_index_time07_assembly.py backend/nvp_index_time06_native_desktop.py backend/nvp_film_time_editorial.py tests/test_nvp_index_time07_assembly.py
      - name: Actual VFR source move/copy/trim/gaps/insert/restore/approval/CAS/tamper
        shell: bash
        run: |
          set -euo pipefail
          python -m unittest discover -s tests -p 'test_nvp_index_time07_assembly.py' -v
          python -m unittest discover -s tests -p 'test_nvp_film_time_editorial_native.py' -v

  real-react-editor:
    name: INDEX-TIME-07 React assembly preview and native consent UX
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - run: npm run build
      - run: npm run test:ui -- src/FilmTimeAssemblyPanel.test.jsx src/FilmTimeIndexPanel.test.jsx src/FilmTimeNativeBridge.test.jsx
