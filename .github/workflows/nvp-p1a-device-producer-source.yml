name: NVP P1-A device-producer source checks
on:
  push:
    branches:
      - nvp/p1a-device-producer-custody-20261112
  pull_request:
    paths:
      - backend/nvp_device_producer_custody.py
      - tools/nvp_p1b_physical_device_acceptance.py
      - tests/test_nvp_p1b_physical_contract.py
      - tools/nvp_desktop_alpha.py
      - backend/nvp_native_live_take.py
      - backend/nvp_native_independent_take.py
      - tools/nvp_native_device_producer_worker.py
      - tests/test_nvp_p1a_device_producer.py
      - .github/workflows/nvp-p1a-device-producer-source.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-unit:
    name: Source + mocked producer (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install pytest
      - name: Compile changed Python source
        run: python -m py_compile backend/nvp_device_producer_custody.py backend/nvp_native_live_take.py backend/nvp_native_independent_take.py tools/nvp_native_device_producer_worker.py tools/nvp_p1b_physical_device_acceptance.py tools/nvp_desktop_alpha.py tests/test_nvp_p1a_device_producer.py tests/test_nvp_p1b_physical_contract.py
      - name: Isolated no-hardware producer tests
        run: python -m pytest -q tests/test_nvp_p1a_device_producer.py tests/test_nvp_p1b_physical_contract.py
