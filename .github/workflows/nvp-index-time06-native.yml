name: NVP INDEX-TIME-06 Native Desktop Import and Approved Frame

on:
  push:
    branches:
      - nvp/index-time06-native-import-review-20261106
  pull_request:
    paths:
      - 'backend/nvp_index_time06_native_desktop.py'
      - 'backend/nvp_film_time_window_host.py'
      - 'tools/nvp_desktop_alpha.py'
      - 'frontend/src/FilmTimeIndexPanel.jsx'
      - 'frontend/src/FilmTimeNativeBridge.test.jsx'
      - 'tests/test_nvp_index_time06_native_desktop.py'
      - '.github/workflows/nvp-index-time06-native.yml'
  workflow_dispatch:

permissions:
  contents: read
concurrency:
  group: nvp-index-time06-${{ github.ref }}
  cancel-in-progress: true

jobs:
  real-native-import-and-review:
    name: INDEX-TIME-06 ${{ matrix.os }} Python ${{ matrix.python }} real source worker
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025]
        python: ['3.11','3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install NVP native project dependencies
        shell: bash
        run: python -m pip install -r requirements-foundation.txt
      - name: Require actual Linux FFmpeg/FFprobe
        if: runner.os == 'Linux'
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
      - name: Require native Windows FFmpeg and Job Object containment
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          choco install ffmpeg -y --no-progress
          if ($LASTEXITCODE -ne 0) { throw 'FFmpeg install failed' }
          Join-Path $env:ChocolateyInstall 'bin' | Out-File -FilePath $env:GITHUB_PATH -Append
          python -m pip install 'pywin32>=306'
          if ($LASTEXITCODE -ne 0) { throw 'Windows Job Object support failed' }
      - name: Compile exact native IPC, original index and OS-contained child
        shell: bash
        run: |
          set -euo pipefail
          ffmpeg -version
          ffprobe -version
          python -m compileall -q backend/nvp_index_time06_native_desktop.py backend/nvp_film_time_window_host.py backend/nvp_index_time05_desktop_read.py tools/nvp_source_window_worker.py tools/nvp_desktop_alpha.py tests/test_nvp_index_time06_native_desktop.py
      - name: Source picker/consent, real VFR original, actual contained PNG, source custody, cancellation, tamper
        shell: bash
        run: |
          set -euo pipefail
          python -m unittest discover -s tests -p 'test_nvp_index_time06_native_desktop.py' -v
          python -m unittest discover -s tests -p 'test_nvp_film_time_playback_native.py' -v

  react-desktop-source:
    name: INDEX-TIME-06 React native importer, real result contract and stale-source exclusion
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - run: npm run build
      - run: npm run test:ui -- src/FilmTimeIndexPanel.test.jsx src/FilmTimeNativeBridge.test.jsx
