name: NVP GRADE-UI-02B1 scene-linear tone curves and reference shot advice

on:
  push:
    branches:
      - nvp/grade-ui02b-curves-reference-lut-20261103
  pull_request:
    branches:
      - nvp/grade-ui02a-shot-wheels-scopes-20261103
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linux-shot-scopes:
    name: Linux HDR EV curves, reference advice and shot regression
    runs-on: ubuntu-24.04
    timeout-minutes: 16
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install pinned math and FilmIndex requirements
        run: |
          python -m pip install -r requirements-foundation.txt httpx trimesh
          python -m pip install 'opencolorio==2.5.2' 'numpy==2.3.4'
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg
      - name: Compile plus new and existing grading contracts
        run: |
          python -m compileall -q backend tools tests
          python -m unittest discover -s tests -p 'test_grade_curves.py' -v
          python -m unittest discover -s tests -p 'test_grade_advanced.py' -v
          python -m unittest discover -s tests -p 'test_grade_workspace.py' -v
          python -m unittest discover -s tests -p 'test_color_mastering.py' -v
          python -m unittest discover -s tests -p 'test_color_ocio.py' -v
      - name: Preserve exact source for independent replay
        if: always()
        run: |
          zip -qr nvp_grade_ui02b1_sources.zip backend tools tests requirements-foundation.txt
          sha256sum nvp_grade_ui02b1_sources.zip > nvp_grade_ui02b1_source.sha256
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nvp-grade-ui02b1-exact-source
          path: |
            nvp_grade_ui02b1_sources.zip
            nvp_grade_ui02b1_source.sha256
          retention-days: 7

  windows-shot-contract:
    name: Windows HDR tone-curve source-bound safety and older shot contracts
    runs-on: windows-2025
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install pinned OCIO and NVP test prerequisites
        shell: pwsh
        run: |
          python -m pip install -r requirements-foundation.txt httpx trimesh
          python -m pip install 'opencolorio==2.5.2' 'numpy==2.3.4'
      - name: Compile and run independent advanced/legacy contracts
        shell: pwsh
        run: |
          $env:PYTHONPATH='.'
          python -m compileall -q backend tools tests
          if ($LASTEXITCODE -ne 0) { throw 'Compilation failed' }
          python -m unittest discover -s tests -p 'test_grade_curves.py' -v
          if ($LASTEXITCODE -ne 0) { throw 'Tone curve contract tests failed' }
          python -m unittest discover -s tests -p 'test_grade_advanced.py' -v
          if ($LASTEXITCODE -ne 0) { throw 'Shot grading/scopes tests failed' }
          python -m unittest discover -s tests -p 'test_grade_workspace.py' -v
          if ($LASTEXITCODE -ne 0) { throw 'Legacy grading contracts failed' }

  browser-advanced-ui:
    name: React tone-curve/shot interaction and reference suggestion tests
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build NVP and test actual advanced grading interactions
        working-directory: frontend
        run: |
          npm install --no-audit --no-fund
          npm run build
          npm run test:ui

  native-two-shot-grading:
    name: Native Blender/Cycles two-shot tone-curve and source-reference audit
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      BLENDER_VERSION: '5.2.3'
      BLENDER_BASE: 'https://download.blender.org/release/Blender5.2'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Blender/EXR/OCIO runtime prerequisites
        run: |
          python -m pip install -r requirements-foundation.txt httpx trimesh
          python -m pip install 'opencolorio==2.5.2' 'numpy==2.3.4'
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends xvfb xauth libgl1 libegl1 libx11-6 libxi6 libxrender1 libxxf86vm1 libxkbcommon0 ffmpeg
      - name: Retrieve and SHA-check actual Blender binary
        shell: bash
        run: |
          set -euo pipefail
          archive="blender-$BLENDER_VERSION-linux-x64.tar.xz"
          curl --fail --location --retry 4 --retry-delay 5 "$BLENDER_BASE/$archive" -o "$archive"
          curl --fail --location --retry 4 --retry-delay 5 "$BLENDER_BASE/blender-$BLENDER_VERSION.sha256" -o blender.sha256
          grep "  $archive$" blender.sha256 | sha256sum --check --status
          mkdir -p /tmp/nvp-blender
          tar -xJf "$archive" -C /tmp/nvp-blender --strip-components=1
          echo "/tmp/nvp-blender" >> "$GITHUB_PATH"
      - name: Native HDR source curves, advisory shot match, lineage and corruption recovery
        shell: bash
        run: |
          set -euo pipefail
          xvfb-run -a python -m tools.nvp_grade_ui02b1_fixture --out acceptance_artifacts/grade_ui02b1
      - name: Preserve true neutral/graded shot images and FilmIndex scientific proof
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nvp-grade-ui02b1-native-two-shot-evidence
          path: acceptance_artifacts/grade_ui02b1/
          retention-days: 7
          if-no-files-found: warn
