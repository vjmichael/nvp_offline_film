name: NVP FILM03-09 Independent Face, Voice, Body Direction (NO FFMPEG)

on:
  push:
    branches: [nvp/film03-09-independent-facial-direction-20261108]
  pull_request:
    branches: [nvp/film03-08-guide-performance-voice-conversion-20261108]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nvp-film03-09-${{ github.event_name }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  source-acting:
    name: Original PCM actor voice and independent emotion / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 75
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install actual OpenUSD original source dependencies
        run: |
          python -m pip install -r requirements-foundation.txt
          python -m pip install --only-binary=:all: "usd-core==26.11" numpy Pillow
          python -m pip install httpx
      - name: Compile source and regression test modules
        run: |
          python -m compileall -q backend/nvp_film03_independent_facial_direction.py backend/nvp_film03_voice_conversion_intent.py backend/nvp_film03_voice_performance_lab.py tests/test_nvp_film03_independent_facial_direction.py
      - name: Original real PCM custody, intentional emotional contrast, no-mouth actors and creator permission
        run: python -m unittest discover -s tests -p test_nvp_film03_independent_facial_direction.py -v
      - name: Retain upstream voice-conversion and expressive direction identity regression
        run: |
          python -m unittest discover -s tests -p test_nvp_film03_voice_conversion_intent.py -v
          python -m unittest discover -s tests -p test_nvp_film03_expressive_voice_direction.py -v
