name: NVP WO6-07C Human-Reviewed AI to Genuine Native Shot (NO FFMPEG)

on:
  push:
    branches: [nvp/wo6-reviewed-ai-to-approved-shot-20261107]
  pull_request:
    paths:
      - backend/nvp_wo6_desktop_bridge.py
      - backend/nvp_wo6_native_shot_action.py
      - backend/nvp_wo6_recovery.py
      - tools/nvp_wo6_shot_worker.py
      - frontend/src/WO6CreatorActionsPanel.jsx
      - frontend/src/WO6CreatorActionsPanel.test.jsx
      - tests/test_nvp_wo6_reviewed_director_shot.py
      - tests/test_nvp_wo6_native_shot_action.py
      - .github/workflows/nvp-wo6-07c-human-reviewed-native-shot.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nvp-wo6-07c-${{ github.event_name }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  native-reviewed-shots:
    name: Native frozen Take -> explicit model review -> two OS consents -> shot / ${{ matrix.os }} / Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 50
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025]
        python: ['3.11', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install native OpenUSD 26.11 for real source-bound contained workers
        run: 'python -m pip install --only-binary=:all: "usd-core==26.11"'
      - name: Install Windows kernel process containment support
        if: runner.os == 'Windows'
        run: python -m pip install 'pywin32>=310'
      - name: Compile actual native host, worker, durable recovery and tests
        run: python -m compileall -q backend/nvp_wo6_desktop_bridge.py backend/nvp_wo6_native_shot_action.py backend/nvp_wo6_recovery.py tools/nvp_wo6_shot_worker.py tests/test_nvp_wo6_reviewed_director_shot.py tests/test_nvp_wo6_native_shot_action.py
      - name: Execute true frozen USD -> explicit reviewed proposal -> two native approvals -> native shot worker
        run: python -m unittest discover -s tests -p test_nvp_wo6_reviewed_director_shot.py -v
      - name: Verify original native shot authorization and forged AI consultation denial
        run: python -m unittest discover -s tests -p test_nvp_wo6_native_shot_action.py -v
      - name: Verify model text never becomes a native action and concurrent source edits fail closed
        run: python -m unittest discover -s tests -p test_nvp_wo6_director_model_proposal.py -v
      - name: Preserve exact-task dispatch, cancellation, durable restart regressions
        run: python -m unittest discover -s tests -p test_nvp_wo6_desktop_bridge.py -v
      - name: Preserve source receipt and crash recovery gates
        run: python -m unittest discover -s tests -p test_nvp_wo6_recovery.py -v

  react-director-selection:
    name: React director must manually select values, preview source, then request two OS approvals
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install UI dependencies without mutating repository lockfile
        working-directory: frontend
        run: npm install --no-audit --no-fund --package-lock=false
      - name: Compile real director panel into NVP React application
        working-directory: frontend
        run: npm run build
      - name: Execute strict model-advice and manually chosen shot React regressions
        working-directory: frontend
        run: npx vitest run src/WO6CreatorActionsPanel.test.jsx
