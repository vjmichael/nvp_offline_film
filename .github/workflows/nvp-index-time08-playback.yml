name: NVP INDEX-TIME-08 Native Original Assembly Playback

on:
  push:
    branches:
      - nvp/index-time08-safe-assembly-playback-20261106
  pull_request:
    paths:
      - 'backend/nvp_index_time08_playback.py'
      - 'backend/nvp_index_time06_native_desktop.py'
      - 'backend/nvp_film_time_window_host.py'
      - 'frontend/src/FilmTimePlaybackPanel.jsx'
      - 'frontend/src/FilmTimePlaybackPanel.test.jsx'
      - 'frontend/src/FilmTimeIndexPanel.jsx'
      - 'tests/test_nvp_index_time08_playback.py'
      - 'tools/nvp_desktop_alpha.py'
      - '.github/workflows/nvp-index-time08-playback.yml'
  workflow_dispatch:

permissions:
  contents: read
concurrency:
  group: nvp-index-time08-${{ github.ref }}
  cancel-in-progress: true

jobs:
  source-playback-native:
    name: INDEX-TIME-08 ${{ matrix.os }} Python ${{ matrix.python }} original PTS reviewed frames
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025]
        python: ['3.11','3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install foundation
        shell: bash
        run: python -m pip install -r requirements-foundation.txt
      - name: Linux actual FFmpeg/FFprobe
        if: runner.os == 'Linux'
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
      - name: Windows real FFmpeg/FFprobe + Job Objects
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          choco install ffmpeg -y --no-progress
          if ($LASTEXITCODE -ne 0) { throw 'Native FFmpeg/FFprobe are required' }
          Join-Path $env:ChocolateyInstall 'bin' | Out-File -FilePath $env:GITHUB_PATH -Append
          python -m pip install 'pywin32>=306'
          if ($LASTEXITCODE -ne 0) { throw 'Native Windows containment unavailable' }
      - name: Compile exact native playback and trusted desktop
        shell: bash
        run: |
          set -euo pipefail
          ffmpeg -version
          ffprobe -version
          python -m compileall -q backend/nvp_index_time08_playback.py backend/nvp_index_time06_native_desktop.py backend/nvp_film_time_window_host.py tests/test_nvp_index_time08_playback.py tools/nvp_desktop_alpha.py
      - name: Real VFR original media, multi-clip gaps, consent, cancellation, tamper, FilmIndex stale revision
        shell: bash
        run: |
          set -euo pipefail
          python -m unittest discover -s tests -p 'test_nvp_index_time08_playback.py' -v
          python -m unittest discover -s tests -p 'test_nvp_index_time07_assembly.py' -v

  source-playback-react:
    name: INDEX-TIME-08 source-protected review transport + legacy source editor
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - run: npm run build
      - run: npm run test:ui -- src/FilmTimePlaybackPanel.test.jsx src/FilmTimeAssemblyPanel.test.jsx src/FilmTimeIndexPanel.test.jsx src/FilmTimeNativeBridge.test.jsx
