name: NVP USD-02 Reusable Assets and Timed Scene State

on:
  push:
    branches:
      - nvp/usd02-reusable-assets-state-20261105
    paths:
      - "backend/nvp_openusd_*.py"
      - "tests/test_nvp_openusd_reusable_assets.py"
      - "docs/NVP_USD02_REUSABLE_ASSETS_AND_STATE.md"
      - ".github/workflows/nvp-usd02-native.yml"
  pull_request:
    paths:
      - "backend/nvp_openusd_*.py"
      - "tests/test_nvp_openusd_reusable_assets.py"
      - "docs/NVP_USD02_REUSABLE_ASSETS_AND_STATE.md"
      - ".github/workflows/nvp-usd02-native.yml"
  workflow_dispatch:

concurrency:
  group: nvp-usd02-${{ github.ref }}
  cancel-in-progress: true

jobs:
  real-openusd-native:
    name: USD2 native ${{ matrix.os }} Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025]
        python: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install pinned native OpenUSD
        shell: bash
        run: |
          python -m pip install --upgrade pip
          python -m pip install --only-binary=:all: "usd-core==26.11"
      - name: Verify true USD schema and native reference API
        shell: bash
        run: |
          python -c "from pxr import Sdf,Usd,UsdGeom; l=Sdf.Layer.CreateAnonymous('probe.usda'); s=Usd.Stage.Open(l); p=UsdGeom.Xform.Define(s,'/Asset'); print('NATIVE_OPENUSD', bool(p), s.GetTimeCodesPerSecond())"
      - name: Compile production modules and native tests
        shell: bash
        run: |
          python -m compileall -q backend/nvp_openusd_scene.py backend/nvp_openusd_assets.py backend/nvp_openusd_time_state.py backend/nvp_openusd_take.py backend/nvp_openusd_presentation.py tests/test_nvp_openusd_reusable_assets.py
      - name: Real reusable asset composition and event state
        shell: bash
        run: python -m unittest discover -s tests -p "test_nvp_openusd_reusable_assets.py" -v
      - name: USD-01 original frozen take regression
        shell: bash
        run: python -m unittest discover -s tests -p "test_nvp_openusd_take_native.py" -v
      - name: Temporal Ledger source regression
        shell: bash
        run: python -m unittest discover -s tests -p "test_nvp_temporal_ledger.py" -v
