name: NVP WO4 LF01 Independent Production Supervisor (NO FFMPEG)
on:
  push:
    branches: [nvp/wo4-cinema-mastering-20261107]
    paths:
      - backend/nvp_production_journal.py
      - backend/nvp_production_supervisor.py
      - backend/nvp_production_cinema.py
      - backend/nvp_wo4_delivery_journal.py
      - backend/nvp_wo4_file_dcp.py
      - backend/nvp_wo4_supervised_sound.py
      - tests/test_nvp_wo4_file_dcp.py
      - tests/test_nvp_production_delivery.py
      - backend/nvp_supervised_codec_process.py
      - backend/nvp_wo4_picture_spool.py
      - tests/test_nvp_supervised_codec_process.py
      - tests/test_nvp_production_cinema.py
      - backend/nvp_production_monitor.py
      - tests/test_nvp_production_monitor.py
      - tests/test_nvp_production_journal.py
      - tests/test_nvp_production_supervisor_process.py
      - .github/workflows/nvp-production-supervisor-native.yml
  pull_request:
    paths:
      - backend/nvp_production_journal.py
      - backend/nvp_production_supervisor.py
      - backend/nvp_production_cinema.py
      - backend/nvp_wo4_delivery_journal.py
      - backend/nvp_wo4_file_dcp.py
      - backend/nvp_wo4_supervised_sound.py
      - tests/test_nvp_wo4_file_dcp.py
      - tests/test_nvp_production_delivery.py
      - backend/nvp_supervised_codec_process.py
      - backend/nvp_wo4_picture_spool.py
      - tests/test_nvp_supervised_codec_process.py
      - tests/test_nvp_production_cinema.py
      - backend/nvp_production_monitor.py
      - tests/test_nvp_production_monitor.py
      - tests/test_nvp_production_journal.py
      - tests/test_nvp_production_supervisor_process.py
      - .github/workflows/nvp-production-supervisor-native.yml
permissions:
  contents: read
jobs:
  production-supervisor:
    name: Durable native NVP production supervisor / ${{ matrix.os }} / Python ${{ matrix.py }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025]
        py: ['3.11','3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.py }}
      - name: Install exact OpenUSD native runtime for frozen-Take picture-spool tests
        run: python -m pip install 'usd-core==26.11'
      - name: Compile durable journal, daemon and native process acceptance tests
        run: python -m compileall -q backend/nvp_production_journal.py backend/nvp_production_supervisor.py backend/nvp_production_monitor.py backend/nvp_production_cinema.py backend/nvp_wo4_delivery_journal.py backend/nvp_wo4_file_dcp.py backend/nvp_wo4_supervised_sound.py backend/nvp_wo4_picture_spool.py backend/nvp_supervised_codec_process.py tests/test_nvp_production_cinema.py tests/test_nvp_supervised_codec_process.py tests/test_nvp_production_monitor.py tests/test_nvp_production_journal.py tests/test_nvp_production_supervisor_process.py
      - name: Test genuine FilmIndex admission, SQLite leases, cancellation and revision custody
        run: python -m unittest discover -s tests -p test_nvp_production_journal.py -v
      - name: Prove standalone process survives GUI absence, singleton and forced crash restart
        run: python -m unittest discover -s tests -p test_nvp_production_supervisor_process.py -v
      - name: Verify native read-only project monitor, no cross-project leakage and reopen
        run: python -m unittest discover -s tests -p test_nvp_production_monitor.py -v
      - name: Prove native codec process tree cancellation and bounded timeout
        run: python -m unittest discover -s tests -p test_nvp_supervised_codec_process.py -v
      - name: Prove real frozen Take approval, per-frame SHA checkpoints and conservative crash recovery (codec boundaries mocked)
        run: python -m unittest discover -s tests -p test_nvp_production_cinema.py -v
      - name: Validate memory-bounded file-backed DCP structure, hashes and non-destructive stages
        run: python -m unittest discover -s tests -p test_nvp_wo4_file_dcp.py -v
      - name: Validate one-journal supervised sound/package/index and crash boundaries (codec outputs mocked)
        run: python -m unittest discover -s tests -p test_nvp_production_delivery.py -v
