name: NVP FILM03-09D Native USD Actor Mouth Rig and Independent Expression (NO FFMPEG)

on:
  push:
    branches: [nvp/film03-09d-usd-actor-mouth-rig-20261108]
  pull_request:
    branches: [nvp/film03-09c-phoneme-alignment-scope-cleanup-20261108]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nvp-film03-09d-${{ github.event_name }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  actual-usd-facial-rig:
    name: Actual original USD skinned actor and derived facial layer / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install actual OpenUSD source dependencies (not a mock USD rig)
        run: |
          python -m pip install -r requirements-foundation.txt
          python -m pip install --only-binary=:all: "usd-core==26.11" numpy Pillow
          python -m pip install httpx
      - name: Compile actual original actor facial source and regression modules
        run: |
          python -m compileall -q backend/nvp_film03_facial_rig_compositor.py backend/nvp_film03_phoneme_alignment.py tests/test_nvp_film03_facial_rig_compositor.py
      - name: Real USD skinned geometry/BlendShape and director expression isolation tests
        run: python -m unittest discover -s tests -p test_nvp_film03_facial_rig_compositor.py -v
      - name: Preserve original phoneme and source facial-direction contract tests
        run: |
          python -m unittest discover -s tests -p test_nvp_film03_phoneme_alignment.py -v
          python -m unittest discover -s tests -p test_nvp_film03_independent_facial_direction.py -v
