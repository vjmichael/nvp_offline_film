name: NVP AUDIO-01K3 DCP generator contract
on:
  push:
    branches:
      - nvp/stack02c3b14-picture-conform-20261104
  workflow_dispatch:
permissions:
  contents: read
jobs:
  dcp-contract:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025]
        python-version: ['3.11', '3.13']
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Compile exact DCP implementation
        shell: bash
        run: |
          python -m compileall -q backend/nvp_audio01k3_dcp.py backend/nvp_audio01k3_native_host.py tools/nvp_audio01k3_dcp_worker.py tests/test_audio01k3_dcp_contract.py tests/test_audio01k3_native_dcp.py
      - name: Run fail-closed DCP structure and CLI contracts
        shell: bash
        run: |
          python -m unittest discover -s tests -p test_audio01k3_dcp_contract.py -v
