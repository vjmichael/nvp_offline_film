name: NVP CAM-FX-03/04 Source Actor Framing, 3D Gizmos, Durable Camera Drafts and AI Group

# SIXTH exact-head native group: protect CAM-FX05 staged source USD
# against absent null original rail prim, as diagnosed on Windows/Linux.
# This is a complete grouped gate, not per-source CI fanout.
# FIFTH exact-head group: native OpenUSD null prim existence check before
# rail-rig namespace collision query; source ActorID and original PCM fixed.
# Previous Windows installed and full React tests already passed.
# FOURTH final-source gate: assert ORIGINAL scene Take hashes against
# ORIGINAL scene IDs (not distinct composed 01E world Take IDs).
# Full Windows/Linux/React/installed source acceptance; no per-file CI.
# THIRD intentional grouped gate: inline exact real ActorID grammar and
# match current fail-closed AI suggestion receipt wording in React tests.
# Earlier groups are complete, without stacking native jobs.
# SECOND intentional grouped gate: fix demonstrated native StoryBible ActorID,
# frozen original 01F fixture identity and async rail-preset React readiness.
# All Windows/Linux/installed evidence must pass at this exact head.
# ONE intentional exact-head group-end push trigger: the workflow file itself
# is changed only after CAM-FX-03/04 + 05A + repaired dependencies are ready.
# Unrelated source commits and all ordinary PR updates DO NOT trigger CI.
# CAM-FX-05 moving-Cycles pixels have a separate later acceptance.
on:
  push:
    branches: [nvp/area2-camfx01-04-native-acceptance-20261109]
    paths: [.github/workflows/nvp-camfx03-04-source-gizmos-recovery-native.yml]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native-actor-guidance:
    name: Real ActorID/district USD framing, native camera, SQLite recovery, local model contracts / ${{ matrix.os }} Py${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 115
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025]
        python: ['3.11','3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Native OpenUSD, original film source, SQLite and HTTP contract dependencies
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install -r requirements-foundation.txt
          python -m pip install --only-binary=:all: 'usd-core==26.11' Pillow numpy
          python -m pip install pytest httpx
      - name: Compile exact native camera source, installed host, model and durable journal
        shell: bash
        run: |
          set -euo pipefail
          python -m compileall -q             backend/nvp_cam_fx01_camera_rails.py             backend/nvp_cam_fx02_usd_camera_layer.py             backend/nvp_cam_fx03_source_guidance.py             backend/nvp_cam_fx03_durable_drafts.py             backend/nvp_cam_fx03_04_desktop_mixin.py             backend/nvp_cam_fx04_model_camera_candidate.py             backend/nvp_cam_fx05_verified_shot_source.py             backend/nvp_wo6_verified_local_model.py             backend/nvp_wo6_desktop_bridge.py             backend/nvp_usd_film02m_modular_buildings.py             backend/nvp_usd_film02m_f_desktop_mixin.py             tests/test_nvp_cam_fx03_04_native_director.py             tests/test_nvp_cam_fx05_staged_rail_source.py
      - name: Genuine native actor bounds, real approved building ray-triangle geometry and original immutable PCM
        shell: bash
        run: |
          set -euo pipefail
          python -m unittest discover -s tests -p test_nvp_cam_fx03_04_native_director.py -v
          python -m unittest discover -s tests -p test_nvp_cam_fx01_02_native_rails.py -v
          python -m unittest discover -s tests -p test_nvp_cam_fx05_staged_rail_source.py -v
          python -m unittest discover -s tests -p test_nvp_usd_film02m_modular_buildings.py -v
      - name: Loopback schema provider receipts are untrusted; no native approval
        shell: bash
        run: |
          set -euo pipefail
          python -m unittest discover -s tests -p test_nvp_wo6_verified_local_model.py -v

  original-director-react:
    name: Orbitable 3D original ActorID rail handles, exact-tick source guidance, SQLite autosave and cancellable AI proposals
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install existing NVP offline director React tests
        working-directory: frontend
        run: npm install --no-audit --no-fund
      - name: Prove 3D projected handles, native source bounded framing and durable AI source-revision UX contracts
        working-directory: frontend
        run: npm run test:ui -- src/CameraRailGizmo.test.jsx src/CameraRailsDirectorAdvanced.test.jsx src/CameraRailsDirector.test.jsx src/ModularWorldDirector.test.jsx src/DataFirstViewpointEditor.test.jsx
      - name: Build actual bundled offline WebView2 director and check source controls
        working-directory: frontend
        run: npm run build
      - name: Refuse shipment of UI without native 3D/durable source and OS grant boundaries
        shell: bash
        run: |
          set -euo pipefail
          grep -R -l '3D director rail editor' frontend/dist/assets/*.js >/dev/null
          grep -R -l 'Create source-bound durable camera-rail draft' frontend/dist/assets/*.js >/dev/null
          grep -R -l 'Read actual original USD ActorID framing' frontend/dist/assets/*.js >/dev/null
          grep -R -l 'Suggest and save unapproved source-grounded AI camera rail' frontend/dist/assets/*.js >/dev/null
          grep -R -l 'OS approve exact saved and source-verified camera rail draft' frontend/dist/assets/*.js >/dev/null

  installed-windows-director:
    name: Actual NSIS installed WebView2 3D rail/draft/AI source IPC with preserved filmmaker data
    runs-on: windows-2025
    timeout-minutes: 135
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install real USD, NSIS and protected desktop runtime
        shell: pwsh
        run: |
          python -m pip install -r requirements-foundation.txt
          if ($LASTEXITCODE -ne 0) { throw 'NVP native foundation unavailable' }
          python -m pip install --only-binary=:all: 'usd-core==26.11' Pillow numpy
          if ($LASTEXITCODE -ne 0) { throw 'Real Windows USD unavailable' }
          python -m pip install 'pyinstaller>=6.10,<7' 'pywebview>=5.3,<7' 'pywin32>=306' 'opentimelineio>=0.18.1,<0.19' pytest httpx
          if ($LASTEXITCODE -ne 0) { throw 'Real Windows WebView2 test dependencies unavailable' }
          python -m unittest discover -s tests -p test_nvp_p0f01_webview_api_facade.py -v
          if ($LASTEXITCODE -ne 0) { throw 'Safe native WebView2 method facade regressed' }
          python -m unittest discover -s tests -p test_nvp_p0f01_windows_process_gate.py -v
          if ($LASTEXITCODE -ne 0) { throw 'Bounded Windows process receipt gate regressed' }
          choco install nsis -y --no-progress
          if ($LASTEXITCODE -ne 0) { throw 'Real NSIS unavailable' }
      - name: Build and test native original director with 3D camera rails
        shell: pwsh
        run: |
          Push-Location frontend
          npm install --no-audit --no-fund
          if ($LASTEXITCODE -ne 0) { throw 'Native installed React dependencies failed' }
          npm run test:ui -- src/CameraRailGizmo.test.jsx src/CameraRailsDirector.test.jsx src/CameraRailsDirectorAdvanced.test.jsx src/ModularWorldDirector.test.jsx src/DataFirstViewpointEditor.test.jsx
          if ($LASTEXITCODE -ne 0) { throw 'Real installed director source editor DOM gate failed' }
          npm run build
          if ($LASTEXITCODE -ne 0) { throw 'Native installed NVP bundle failed' }
          Pop-Location
      - name: Freeze verified first-party NVP.exe with actual WebView2 and source render workers
        shell: pwsh
        run: |
          python -m PyInstaller --noconfirm --clean --onedir --windowed --name NVP --paths . --add-data 'frontend/dist;frontend/dist' --add-data 'tools/nvp_usd_film01f_blender_worker.py;tools' --add-data 'tools/nvp_usd_film02mh_blender_reopen.py;tools' --collect-all webview --collect-all pxr --collect-submodules backend tools/nvp_desktop_alpha.py
          if ($LASTEXITCODE -ne 0) { throw 'Native NVP.exe PyInstaller build failed' }
          python tools/nvp_e2e01e_validate_installer_payload.py --bundle dist/NVP --require-original-cycles-02mh --report "$env:RUNNER_TEMP/camfx034-native-bundle.json"
          if ($LASTEXITCODE -ne 0) { throw 'Native movie source or protected Cycles script is not packaged' }
      - name: Install and exercise actual WebView2 native IPC, 3D gizmo and SQLite/model draft controls
        shell: pwsh
        run: |
          # Windows 2025 Chocolatey installs NSIS to Program Files (x86).
          $locations=@("${env:ProgramFiles(x86)}\NSIS\makensis.exe","$env:ProgramFiles\NSIS\makensis.exe")
          $nsis=$locations | Where-Object { Test-Path -LiteralPath $_ -PathType Leaf } | Select-Object -First 1
          if (-not $nsis) { throw 'Real installed NSIS compiler missing' }
          & $nsis '/V3' 'packaging/nvp-alpha.nsi'
          if ($LASTEXITCODE -ne 0) { throw 'Actual NSIS camera installer failed' }
          $setup=(Resolve-Path 'dist/NVP-Alpha-Setup.exe').Path
          $stages=Join-Path $env:RUNNER_TEMP 'camfx034-process-stages.jsonl'
          python tools/nvp_p0f01_windows_process_gate.py --stage camfx-nsis-install --timeout-seconds 300 --stage-log $stages -- $setup /S
          if ($LASTEXITCODE -ne 0) { throw 'Real bounded NSIS install failed' }
          $installed=Join-Path $env:LOCALAPPDATA 'Programs/NVP/NVP.exe'
          if (-not (Test-Path -LiteralPath $installed -PathType Leaf)) { throw 'Native NVP.exe not installed' }
          if ((Get-FileHash $installed -Algorithm SHA256).Hash -ne (Get-FileHash 'dist/NVP/NVP.exe' -Algorithm SHA256).Hash) { throw 'Installed EXE SHA differs from compiled verified bundle' }
          # Two fresh process launches create and reopen the same user-owned
          # project. The visible WebView2 acceptance uses its own disposable
          # source-home and NEVER serves as evidence for this persistent DB.
          $env:NVP_HOME=Join-Path $env:RUNNER_TEMP 'camfx034-original-film-data'
          $env:NVP_FILM02M_GROUP_ACCEPTANCE='1'
          $env:NVP_NATIVE_SMOKE_DIAGNOSTICS=Join-Path $env:RUNNER_TEMP 'camfx034-installed-create.log'
          python tools/nvp_p0f01_windows_process_gate.py --stage camfx-installed-create --timeout-seconds 240 --stage-log $stages --diagnostics "$env:NVP_NATIVE_SMOKE_DIAGNOSTICS" -- $installed --smoke-create
          if ($LASTEXITCODE -ne 0) { throw 'Installed original camera project/draft failed to create' }
          $env:NVP_NATIVE_SMOKE_DIAGNOSTICS=Join-Path $env:RUNNER_TEMP 'camfx034-installed-reopen.log'
          python tools/nvp_p0f01_windows_process_gate.py --stage camfx-installed-reopen --timeout-seconds 240 --stage-log $stages --diagnostics "$env:NVP_NATIVE_SMOKE_DIAGNOSTICS" -- $installed --smoke-reopen
          if ($LASTEXITCODE -ne 0) { throw 'Fresh installed app lost original SQLite camera/film source' }
          $sourceDb=Join-Path $env:NVP_HOME 'nvp_studio.sqlite3'
          if (-not (Test-Path -LiteralPath $sourceDb -PathType Leaf)) { throw 'Persistent first-party original SQLite film source missing' }
          $originalSha=(Get-FileHash -LiteralPath $sourceDb -Algorithm SHA256).Hash
          $env:NVP_NATIVE_SMOKE_DIAGNOSTICS=Join-Path $env:RUNNER_TEMP 'camfx034-installed-webview2.log'
          $env:NVP_CAMFX034_GROUP_ACCEPTANCE='1'
          python tools/nvp_p0f01_windows_process_gate.py --stage camfx-installed-webview2 --timeout-seconds 300 --stage-log $stages --diagnostics "$env:NVP_NATIVE_SMOKE_DIAGNOSTICS" -- $installed --smoke-window
          if ($LASTEXITCODE -ne 0) { throw 'Real installed native source 3D editor/AI bridge failed' }
          $log=Get-Content "$env:RUNNER_TEMP/camfx034-installed-webview2.log" -Raw
          if (-not $log.Contains('camfx034_installed_gizmo_durable_ai_controls_verified_no_worker_started')) { throw 'Original 3D gizmo / durable model / OS approval native controls absent' }
          $uninstaller=Join-Path $env:LOCALAPPDATA 'Programs/NVP/Uninstall NVP.exe'
          python tools/nvp_p0f01_windows_process_gate.py --stage camfx-nsis-uninstall --timeout-seconds 240 --stage-log $stages -- $uninstaller /S
          if ($LASTEXITCODE -ne 0) { throw 'Real NSIS uninstall failed' }
          Start-Sleep -Seconds 2
          if (Test-Path $installed) { throw 'Uninstall retained installed NVP.exe' }
          if (-not (Test-Path -LiteralPath $sourceDb -PathType Leaf)) { throw 'Uninstall removed filmmaker SQLite project' }
          if ((Get-FileHash -LiteralPath $sourceDb -Algorithm SHA256).Hash -ne $originalSha) { throw 'Uninstall mutated original filmmaker SQLite bytes' }
          Write-Output 'CAMFX034_NATIVE_REAL_INSTALL_WEBVIEW2_RESTART_UNINSTALL_SQLITE_SHA_PASSED'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: camfx034-windows-installed-source-editor-and-3d-camera-rail-smoke
          path: |
            ${{ runner.temp }}/camfx034-process-stages.jsonl
            ${{ runner.temp }}/camfx034-installed-create.log
            ${{ runner.temp }}/camfx034-installed-reopen.log
            ${{ runner.temp }}/camfx034-native-bundle.json
            ${{ runner.temp }}/camfx034-installed-webview2.log
          if-no-files-found: warn
          retention-days: 14

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: camfx034-nsis-technical-candidate-not-human-approved
          path: dist/NVP-Alpha-Setup.exe
          if-no-files-found: warn
          retention-days: 7
