name: NVP COLOR-01B2 real color-managed ProRes and DNxHR

on:
  push:
    branches:
      - nvp/color01b2-prores-dnxhr-graded-master-20261103
  pull_request:
    branches:
      - nvp/color01b-ocio-aces2-mastering-20261103
  workflow_dispatch:

permissions:
  contents: read

jobs:

  ocio-wheel-diagnostic:
    name: Preserve pinned OCIO Linux Python 3.13 binary for independent numeric diagnosis
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Download exact binary wheel for local independent EXR processing
        run: |
          mkdir -p ocio_runtime
          python -m pip download --no-deps --only-binary=:all: --dest ocio_runtime 'opencolorio==2.5.2'
          sha256sum ocio_runtime/*.whl | tee ocio_runtime/SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: nvp-color01b2-ocio-py313-linux-runtime
          path: ocio_runtime/
          retention-days: 7

  ubuntu-color-codecs:
    name: Linux grade recipes + real codec/legal-range/reference tests
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install pinned dependencies and codecs
        run: |
          python -m pip install -r requirements-foundation.txt httpx trimesh
          python -m pip install 'opencolorio==2.5.2' 'numpy==2.3.4'
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg
          ffmpeg -hide_banner -encoders | grep -E 'prores_ks|dnxhd'
      - name: Compile and run regression suite
        run: |
          python -m compileall -q backend tests tools
          python -m unittest discover -s tests -p 'test_color_mastering.py' -v
          python -m unittest discover -s tests -p 'test_color_ocio.py' -v
          python -m unittest discover -s tests -p 'test_color_exr.py' -v
          python -m unittest discover -s tests -p 'test_full_motion.py' -v

  windows-grading-contract:
    name: Windows grade and OCIO contracts
    runs-on: windows-2025
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install pinned runtime and project dependencies
        shell: pwsh
        run: |
          python -m pip install -r requirements-foundation.txt httpx trimesh
          python -m pip install 'opencolorio==2.5.2' 'numpy==2.3.4'
      - name: Compile and run Windows grading contracts
        shell: pwsh
        run: |
          $env:PYTHONPATH='.'
          python -m compileall -q backend tests tools
          if ($LASTEXITCODE -ne 0) { throw 'Compilation failed' }
          python -m unittest discover -s tests -p 'test_color_mastering.py' -v
          if ($LASTEXITCODE -ne 0) { throw 'Grading contract tests failed' }
          python -m unittest discover -s tests -p 'test_color_ocio.py' -v
          if ($LASTEXITCODE -ne 0) { throw 'OCIO tests failed' }

  frontend-guide:
    name: Offline color grading guide React production build
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Compile NVP frontend with offline color grading help
        working-directory: frontend
        run: |
          npm install --no-audit --no-fund
          npm run build

  native-two-codec-exr:
    name: Native frozen Digital Take to real 16-frame graded ProRes and DNxHR
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      BLENDER_VERSION: '5.2.3'
      BLENDER_BASE: 'https://download.blender.org/release/Blender5.2'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install pinned OCIO and native render/codec support
        run: |
          python -m pip install -r requirements-foundation.txt httpx trimesh
          python -m pip install 'opencolorio==2.5.2' 'numpy==2.3.4'
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends xvfb xauth libgl1 libegl1 libx11-6 libxi6 libxrender1 libxxf86vm1 libxkbcommon0 ffmpeg
      - name: Fetch and verify official Blender
        shell: bash
        run: |
          set -euo pipefail
          archive="blender-$BLENDER_VERSION-linux-x64.tar.xz"
          curl -fL --retry 4 --retry-delay 5 "$BLENDER_BASE/$archive" -o "$archive"
          curl -fL --retry 4 --retry-delay 5 "$BLENDER_BASE/blender-$BLENDER_VERSION.sha256" -o blender.sha256
          grep "  $archive$" blender.sha256 | sha256sum --check --status
          mkdir -p /tmp/nvp-blender
          tar -xJf "$archive" -C /tmp/nvp-blender --strip-components=1
          echo "/tmp/nvp-blender" >> "$GITHUB_PATH"
      - name: Render all frozen Cycles EXR frames, grade, encode and independently validate two MOVs
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p acceptance_artifacts/color01b2
          xvfb-run -a python -m tools.nvp_color01b2_fixture --out acceptance_artifacts/color01b2
      - name: Preserve real master candidates and source-index proof
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nvp-color01b2-real-prores-dnxhr-evidence
          path: acceptance_artifacts/color01b2/
          retention-days: 7
          if-no-files-found: warn
