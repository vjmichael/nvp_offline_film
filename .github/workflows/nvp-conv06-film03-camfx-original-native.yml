name: CONV-06 original Film03 and CAM-FX native source matrix
# Manual GROUP acceptance on the sole mainline candidate.
# This is NOT physical Blender/SCM/Windows WFP, root-owned Linux or licensed
# character/actor confirmation. A skipped real-Cycles test is not acceptance.
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: nvp-conv06-source-${{ github.ref }}
  cancel-in-progress: false
jobs:
  native-original-source:
    name: Original Film03/CAM-FX source / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Genuine foundation and pinned native USD wheel
        shell: bash
        run: |
          python -m pip install -r requirements-foundation.txt httpx pytest
          python -m pip install --only-binary=:all: 'usd-core==26.11'
      - name: Source syntax, native imports, original behavior and no-legacy admission
        shell: bash
        run: |
          python -m compileall -q backend tools
          for f in
            test_nvp_film03_actor_identity_core.py \
            test_nvp_film03_expressive_voice_direction.py \
            test_nvp_film03_voice_performance_lab.py \
            test_nvp_film03_voice_conversion_intent.py \
            test_nvp_film03_independent_facial_direction.py \
            test_nvp_film03_phoneme_alignment.py \
            test_nvp_film03_facial_rig_compositor.py \
            test_nvp_usd_film01_world.py \
            test_nvp_usd_film01d_shot_working_set.py \
            test_nvp_usd_film01e_world_take.py \
            test_nvp_cam_fx01_02_native_rails.py \
            test_nvp_cam_fx03_04_native_director.py \
            test_nvp_cam_fx05_staged_rail_source.py \
            test_nvp_conv06_private_cycles_source_contract.py \
            test_nvp_conv06_no_legacy_blender_fallback.py
          ; do
            python -m unittest discover -s tests -p "$f" -v
          done
      - name: Preserve source head identity for later Windows/Linux reconciliation
        shell: bash
        run: |
          echo "CONV06_ACCEPTANCE_HEAD=${GITHUB_SHA}"
          echo "Native OS/real Blender/installed picture-and-sound gates remain separate."
