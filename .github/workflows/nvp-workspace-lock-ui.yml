name: NVP Manual Workspace Lock UI (NO FFMPEG)
on:
  push:
    branches: [nvp/wo4-cinema-mastering-20261107]
    paths:
      - frontend/src/App.jsx
      - frontend/src/WorkspaceLock.jsx
      - frontend/src/WorkspaceLock.css
      - frontend/src/WorkspaceLock.test.jsx
      - .github/workflows/nvp-workspace-lock-ui.yml
  pull_request:
    paths:
      - frontend/src/App.jsx
      - frontend/src/WorkspaceLock.jsx
      - frontend/src/WorkspaceLock.css
      - frontend/src/WorkspaceLock.test.jsx
      - .github/workflows/nvp-workspace-lock-ui.yml
permissions:
  contents: read
jobs:
  manual-workspace-lock:
    name: Manual NVP workspace lock / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025]
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install frontend test and build dependencies
        run: npm install --no-audit --no-fund
      - name: Verify manual lock/home/slide interactions
        run: npm run test:ui -- WorkspaceLock.test.jsx
      - name: Build NVP desktop webview frontend
        run: npm run build
