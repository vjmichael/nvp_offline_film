name: NVP WO4 Real Native Master to DCP (NO FFMPEG)
on:
  push:
    branches: [nvp/wo4-cinema-mastering-20261107]
    paths:
      - backend/nvp_wo4_xyz12_master.py
      - backend/nvp_wo4_pcm_master.py
      - backend/nvp_wo4_master_qc.py
      - backend/nvp_wo4_mastering_decision.py
      - backend/nvp_wo4_master_delivery.py
      - tests/test_nvp_wo4_real_delivery.py
      - .github/workflows/nvp-wo4-real-cinema.yml
  pull_request:
    paths:
      - backend/nvp_wo4_xyz12_master.py
      - backend/nvp_wo4_pcm_master.py
      - backend/nvp_wo4_master_qc.py
      - backend/nvp_wo4_mastering_decision.py
      - backend/nvp_wo4_master_delivery.py
      - tests/test_nvp_wo4_real_delivery.py
      - .github/workflows/nvp-wo4-real-cinema.yml
permissions:
  contents: read
jobs:
  wo4-real-source-to-cinema:
    name: WO4 real native graded distinct RGB→XYZ12 / PCM24 / J2K / MXF / full decode
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: cinecert/asdcplib
          ref: 905d6047f67c8211c2d22f29fb0e2e44c142b59b
          path: deps/asdcplib
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install exact source OpenUSD + distro OpenJPEG and native compiler
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y libopenjp2-tools build-essential cmake
          python -m pip install 'usd-core==26.11'
          test -f deps/asdcplib/COPYING
      - name: Build SHA-reviewed CineCert MXF wrapper and readers
        run: |
          test "$(git -C deps/asdcplib rev-parse HEAD)" = 905d6047f67c8211c2d22f29fb0e2e44c142b59b
          cmake -S deps/asdcplib -B deps/asdcplib/build -DCMAKE_BUILD_TYPE=Release -DWITHOUT_SSL=ON -DWITHOUT_XML=ON
          cmake --build deps/asdcplib/build --config Release --parallel 2 --target asdcp-wrap asdcp-info asdcp-unwrap
      - name: Real approved WO4 mastering through native SMPTE DCP and full decoded roundtrip
        env:
          NVP_NATIVE_OPENJPEG: /usr/bin/opj_compress
          NVP_NATIVE_OPENJPEG_DECODE: /usr/bin/opj_decompress
          NVP_NATIVE_ASDCP_WRAP: ${{ github.workspace }}/deps/asdcplib/build/src/asdcp-wrap
          NVP_NATIVE_ASDCP_INFO: ${{ github.workspace }}/deps/asdcplib/build/src/asdcp-info
          NVP_NATIVE_ASDCP_UNWRAP: ${{ github.workspace }}/deps/asdcplib/build/src/asdcp-unwrap
        run: python -m unittest discover -s tests -p test_nvp_wo4_real_delivery.py -v
