name: NVP DATA-AV-01 Frozen Scene and Native Spatial Sound (NO FFMPEG)

on:
  push:
    branches:
      - nvp/data-av01-native-scene-playback-20261106
  pull_request:
    paths:
      - 'backend/nvp_data_av_*.py'
      - 'backend/nvp_g04_preproduction.py'
      - 'backend/nvp_api.py'
      - 'frontend/src/DirectorSceneLibrary.jsx'
      - 'frontend/src/DirectorSceneLibrary.movie.test.jsx'
      - 'tests/test_nvp_g04_movie_breakdown.py'
      - 'tests/test_nvp_stab01b_five_phase.py'
      - 'backend/nvp_exact_time_shots.py'
      - 'frontend/src/ExactFilmTimeShotPanel.jsx'
      - 'tests/test_nvp_exact_time_shots.py'
      - 'backend/nvp_data_first_filming.py'
      - 'backend/nvp_filming_linux_session.py'
      - 'backend/nvp_filming_cgroup_*.py'
      - 'tests/test_nvp_filming_*.py'
      - 'backend/nvp_imported_audio.py'
      - 'tests/test_nvp_imported_audio.py'
      - 'backend/nvp_final_2d_native.py'
      - 'backend/nvp_native_cpu_raster.py'
      - 'tests/test_nvp_final_2d_native.py'
      - 'backend/nvp_native_color_decisions.py'
      - 'tests/test_nvp_native_color_decisions.py'
      - 'frontend/src/NativeColorGradePanel.jsx'
      - 'tests/test_nvp_data_first_filming.py'
      - 'tools/nvp_no_ffmpeg_contract.py'
      - 'tests/test_nvp_no_ffmpeg_contract.py'
      - 'backend/nvp_temporal_ledger.py'
      - 'backend/nvp_slate08b_native_camera_ipc.py'
      - 'frontend/src/DataFirstAVPanel*'
      - 'frontend/src/nativeAuditionSelection.js'
      - 'tools/test_nvp_native_audition_selection.mjs'
      - 'tools/nvp_ci_nsis.ps1'
      - 'tools/test_nvp_ci_nsis.ps1'
      - 'frontend/src/App.jsx'
      - 'frontend/src/FilmmakerHome.test.jsx'
      - 'frontend/src/DirectorSceneLibrary.movie.test.jsx'
      - 'tools/nvp_data_av_installed_acceptance.py'
      - 'tools/nvp_desktop_alpha.py'
      - 'tools/nvp_perf03g_gui_smoke.py'
      - 'tools/nvp_perf03g_worker_smoke.py'
      - 'tools/nvp_perf03g_production_gui_smoke.py'
      - 'tests/test_nvp_perf03g_r10_r3_gui_contract.py'
      - 'frontend/src/DirectorWorkingMovie*'
      - 'frontend/src/DirectorReelPlayback.jsx'
      - 'frontend/src/DirectorReelPlayback.test.jsx'
      - 'frontend/src/directorPlaybackBuffer.js'
      - 'frontend/src/directorPlaybackBuffer.test.js'
      - 'backend/nvp_g07_feature_playback.py'
      - 'tests/test_nvp_perf03g_r9_playback.py'
      - 'frontend/src/DirectorFinishingRoom.jsx'
      - 'tools/nvp_g07_feature_reel_worker.py'
      - 'frontend/src/DirectorPagedTimeline*'
      - 'frontend/src/DirectorEditorialSections*'
      - 'frontend/src/DirectorFilmEditor.jsx'
      - 'backend/nvp_g07_*.py'
      - 'tests/test_nvp_data_av_native.py'
      - 'tests/test_nvp_webview_ipc_surface.py'
      - '.github/workflows/nvp-data-av01-native.yml'
      - 'docs/NVP_DATA_AV01_NATIVE_MIGRATION.md'
  workflow_dispatch:

permissions:
  contents: read
concurrency:
  group: nvp-native-data-av01-${{ github.ref }}
  cancel-in-progress: true

jobs:
  zero-ffmpeg-policy:
    name: DA-00 zero-FFmpeg native dependency audit
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Verify exact source head (never synthetic PR merge)
        shell: bash
        run: |
          set -euo pipefail
          expected="${{ github.event.pull_request.head.sha || github.sha }}"
          actual="$(git rev-parse HEAD)"
          echo "NVP_DATA_AV_ACCEPTANCE_HEAD=$actual"
          echo "NVP_DATA_AV_SOURCE_TREE=$(git rev-parse HEAD^{tree})"
          test "$actual" = "$expected"
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Refuse executable FFmpeg/ffprobe in active import graph or installer
        run: |
          python tools/nvp_no_ffmpeg_contract.py
          test -f tests/test_nvp_no_ffmpeg_contract.py
          python -c "import unittest,sys; n=unittest.TestLoader().discover('tests',pattern='test_nvp_no_ffmpeg_contract.py').countTestCases(); print('Original zero-FFmpeg negative cases:',n); sys.exit(0 if n else 2)"
          python -m unittest discover -s tests -p 'test_nvp_no_ffmpeg_contract.py' -v
          python -c "import unittest,sys; s=unittest.TestLoader().discover('tests',pattern='test_nvp_perf03g_r10_r3_gui_contract.py'); r=unittest.TextTestRunner(verbosity=2).run(s); sys.exit(0 if r.wasSuccessful() and r.testsRun==2 and not r.skipped else 1)"

  native-frozen-source:
    needs: [zero-ffmpeg-policy]
    name: Native scene + PCM / ${{ matrix.os }} / Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025]
        python: ['3.11','3.13']
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Verify exact source head (never synthetic PR merge)
        shell: bash
        run: |
          set -euo pipefail
          expected="${{ github.event.pull_request.head.sha || github.sha }}"
          actual="$(git rev-parse HEAD)"
          echo "NVP_DATA_AV_ACCEPTANCE_HEAD=$actual"
          echo "NVP_DATA_AV_SOURCE_TREE=$(git rev-parse HEAD^{tree})"
          test "$actual" = "$expected"
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install real native OpenUSD only (no FFmpeg)
        shell: bash
        run: |
          python -m pip install --only-binary=:all: 'usd-core==26.11'
          python -m pip install -r requirements-foundation.txt
      - name: No external video decoder or derived movie dependency
        shell: bash
        run: |
          set -euo pipefail
          python -m compileall -q backend/nvp_data_av_source.py backend/nvp_data_av_scene.py backend/nvp_data_av_usd.py backend/nvp_data_av_desktop.py backend/nvp_slate08b_native_camera_ipc.py tools/nvp_desktop_alpha.py tools/nvp_data_av_installed_acceptance.py tests/test_nvp_data_av_native.py
          python -m unittest discover -s tests -p 'test_nvp_data_av_native.py' -v
          test -f tests/test_nvp_webview_ipc_surface.py
          python -c "import unittest,sys; n=unittest.TestLoader().discover('tests',pattern='test_nvp_webview_ipc_surface.py').countTestCases(); print('Native installed-boundary source regressions:',n); sys.exit(0 if n else 2)"
          python -m unittest discover -s tests -p 'test_nvp_webview_ipc_surface.py' -v
          python -m unittest discover -s tests -p 'test_nvp_exact_time_shots.py' -v
          python -m unittest discover -s tests -p 'test_nvp_data_first_filming.py' -v
          python -m unittest discover -s tests -p 'test_nvp_imported_audio.py' -v
          python -m unittest discover -s tests -p 'test_nvp_final_2d_native.py' -v
          python -m unittest discover -s tests -p 'test_nvp_native_color_decisions.py' -v
      - name: Install real G03 Windows protected-film test dependencies
        if: runner.os == 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          # Match original G03 native/installed acceptance. Do not substitute
          # fake DPAPI, a mock cryptography provider, or a source-test skip.
          python -m pip install --only-binary=:all: 'pywin32>=306' 'cryptography>=43,<49'
          python -c "import win32crypt; from cryptography.hazmat.primitives.ciphers import Cipher; print('Real Windows DPAPI and AES-GCM bindings present')"
      - name: PLAN-03/04 original whole-movie source, stale-reply and no-partial-publication
        shell: bash
        run: |
          set -euo pipefail
          python -m compileall -q backend/nvp_g04_preproduction.py backend/nvp_api.py tests/test_nvp_g04_movie_breakdown.py
          test -f tests/test_nvp_g04_movie_breakdown.py
          python -c "import unittest,sys; n=unittest.TestLoader().discover('tests',pattern='test_nvp_g04_movie_breakdown.py').countTestCases(); print('PLAN-03/04 source-bound negative cases:',n); sys.exit(0 if n>=14 else 2)"
          python -m unittest discover -s tests -p 'test_nvp_g04_movie_breakdown.py' -v
      - name: STAB-01B single persisted five-phase native movie, denial, cancel, recovery
        if: matrix.os == 'windows-2025' && matrix.python == '3.11'
        shell: bash
        run: |
          python -m compileall -q tests/test_nvp_stab01b_five_phase.py
          python -c "import unittest,sys; s=unittest.TestLoader().discover('tests',pattern='test_nvp_stab01b_five_phase.py'); n=s.countTestCases(); print('Five-phase native test count:',n); sys.exit(0 if n==1 else 2)"
          python -m unittest discover -s tests -p 'test_nvp_stab01b_five_phase.py' -v
      - name: PLAN-02-B original microphone, durable recovery and independent native ADC clock
        shell: bash
        run: |
          set -euo pipefail
          python -m compileall -q backend/nvp_capture_recovery.py backend/nvp_native_live_take.py backend/nvp_independent_device_sync.py backend/nvp_native_independent_take.py backend/nvp_native_capture_desktop.py backend/nvp_original_clock_binding.py backend/nvp_data_first_filming.py backend/nvp_data_av_scene.py
          python -m unittest discover -s tests -p 'test_nvp_native_live_take.py' -v
          python -m unittest discover -s tests -p 'test_nvp_native_independent_sync.py' -v
          python -m unittest discover -s tests -p 'test_nvp_plan02b_native_capture.py' -v
          python -m unittest discover -s tests -p 'test_nvp_plan02b_original_clock_binding.py' -v
          python -m unittest discover -s tests -p 'test_nvp_plan02c_native_camera_ai.py' -v
      - name: DA-03 recording host custody and original PCM publication contracts (not device acceptance)
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install 'pytest>=8,<10'
          python -m compileall -q backend/nvp_filming_host_bridge.py tests/test_nvp_filming_host_bridge.py
          python -m pytest -q tests/test_nvp_filming_host_bridge.py
      - name: DA-03 Linux filming session and cgroup custody contracts (not kernel acceptance)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install 'pytest>=8,<10'
          python -m compileall -q backend/nvp_filming_linux_session.py backend/nvp_filming_cgroup_custody.py backend/nvp_filming_cgroup_launch.py
          python -m pytest -q tests/test_nvp_filming_linux_session.py
      - name: Existing frozen source/camera/provenance regressions
        shell: bash
        run: |
          python -m unittest discover -s tests -p 'test_nvp_performance_probe.py' -v
          python -m unittest discover -s tests -p 'test_nvp_gpu_observation.py' -v
          python -m unittest discover -s tests -p 'test_nvp_longfilm_schedule.py' -v
          python -m tools.nvp_perf_benchmark
          python -m tools.nvp_perf_acceptance usd
          python -m unittest discover -s tests -p 'test_nvp_openusd_reusable_assets.py' -v
          python -m unittest discover -s tests -p 'test_nvp_slate08b_native_camera_ipc.py' -v
          python -m unittest discover -s tests -p 'test_data_time_projection.py' -v

  native-react:
    needs: [zero-ffmpeg-policy]
    name: React source audition and no automatic conventional movie proxy
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Verify exact source head (never synthetic PR merge)
        shell: bash
        run: |
          set -euo pipefail
          expected="${{ github.event.pull_request.head.sha || github.sha }}"
          actual="$(git rev-parse HEAD)"
          echo "NVP_DATA_AV_ACCEPTANCE_HEAD=$actual"
          echo "NVP_DATA_AV_SOURCE_TREE=$(git rev-parse HEAD^{tree})"
          test "$actual" = "$expected"
      - uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'
      - run: npm ci --no-audit --no-fund
      - run: npm run build
      - run: npm run test:ui -- src/DataFirstAVPanel.test.jsx src/NativeCameraRailPanel.test.jsx src/NativeOriginalCapturePanel.test.jsx src/FilmCameraSourcePanel.test.jsx src/CameraLensWorkbench.test.jsx src/FilmCameraNativeBridge.test.jsx src/FilmmakerHome.test.jsx src/DirectorWorkingMovie.test.jsx src/DirectorPagedMedia.test.jsx

  installed-windows-native:
    name: Real packaged / installed Windows NVP.exe with OpenUSD and PCM (no FFmpeg)
    runs-on: windows-2025
    timeout-minutes: 80
    needs: [zero-ffmpeg-policy, native-react]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Verify exact source head (never synthetic PR merge)
        shell: bash
        run: |
          set -euo pipefail
          expected="${{ github.event.pull_request.head.sha || github.sha }}"
          actual="$(git rev-parse HEAD)"
          echo "NVP_DATA_AV_ACCEPTANCE_HEAD=$actual"
          echo "NVP_DATA_AV_SOURCE_TREE=$(git rev-parse HEAD^{tree})"
          test "$actual" = "$expected"
      - uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Build real offline React frontend
        shell: pwsh
        run: |
          Push-Location frontend
          npm ci --no-audit --no-fund
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm run build
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Pop-Location
      - name: Validate source selection and NSIS provisioning contracts
        shell: pwsh
        run: |
          node --test tools/test_nvp_native_audition_selection.mjs
          if ($LASTEXITCODE -ne 0) { throw 'Audition selection contract failed' }
          & ./tools/test_nvp_ci_nsis.ps1
      - name: Native USD + GUI/installer packager, no FFmpeg installed by workflow
        shell: pwsh
        run: |
          python -m pip install --only-binary=:all: 'usd-core==26.11'
          if ($LASTEXITCODE -ne 0) { throw 'Native OpenUSD unavailable' }
          python -m pip install -r requirements-foundation.txt 'pyinstaller>=6.10,<7' 'pywebview>=5.3,<7' 'pywin32>=306' 'cryptography>=43,<49'
          if ($LASTEXITCODE -ne 0) { throw 'Native desktop packager unavailable' }
          python -c "import win32crypt; from cryptography.hazmat.primitives.ciphers import Cipher, algorithms, modes; from cryptography.exceptions import InvalidTag; print('Native DPAPI and AES-GCM packager dependencies present')"
          if ($LASTEXITCODE -ne 0) { throw 'Protected movie cryptography packager unavailable' }
          . ./tools/nvp_ci_nsis.ps1
          $null = Install-NvpCiNsis
      - name: Bundle actual native NVP.exe + real USD and offline editor
        shell: pwsh
        run: |
          python -m PyInstaller --noconfirm --clean --onedir --windowed --name NVP --paths . --add-data 'frontend/dist;frontend/dist' --collect-all webview --collect-all miniaudio --collect-all PIL --collect-all pxr --collect-all cryptography --hidden-import backend.nvp_native_cpu_raster --hidden-import backend.nvp_final_2d_native --hidden-import backend.nvp_data_av_source --hidden-import backend.nvp_data_av_scene --hidden-import backend.nvp_data_av_usd --hidden-import backend.nvp_data_av_desktop --hidden-import backend.nvp_slate08b_native_camera_ipc --hidden-import backend.nvp_plan02c_desktop --hidden-import backend.nvp_plan02c_rails --hidden-import backend.nvp_plan02c_usd_rail --hidden-import backend.nvp_plan02c_model_advice --hidden-import backend.nvp_wo6_verified_local_model --hidden-import backend.nvp_native_capture_desktop --hidden-import backend.nvp_native_live_take --hidden-import backend.nvp_native_independent_take --hidden-import backend.nvp_independent_device_sync --hidden-import backend.nvp_capture_recovery --collect-all sounddevice --collect-all _sounddevice_data --hidden-import tools.nvp_native_device_producer_worker --hidden-import tools.nvp_p1b_physical_device_acceptance --hidden-import tools.nvp_data_av_installed_acceptance --hidden-import tools.nvp_perf03g_gui_smoke tools/nvp_desktop_alpha.py
          if ($LASTEXITCODE -ne 0) { throw 'Installed NVP executable could not be produced' }
          if (-not (Test-Path dist/NVP/NVP.exe)) { throw 'NVP.exe missing' }
          $bundled=@(Get-ChildItem dist/NVP -Recurse -File | Where-Object { $_.Name -in @('ffmpeg.exe','ffprobe.exe') })
          if ($bundled.Count -ne 0) { throw 'Legacy FFmpeg was accidentally bundled into native data AV' }
          $env:NVP_SMOKE_DIAGNOSTIC_PATH=Join-Path $env:RUNNER_TEMP 'nvp-packaged-data-av-failure.txt'
          Remove-Item -LiteralPath $env:NVP_SMOKE_DIAGNOSTIC_PATH -ErrorAction SilentlyContinue
          $packaged=Start-Process -FilePath (Resolve-Path 'dist/NVP/NVP.exe').Path -ArgumentList '--smoke-data-av' -Wait -PassThru
          if (Test-Path -LiteralPath $env:NVP_SMOKE_DIAGNOSTIC_PATH) { Get-Content -LiteralPath $env:NVP_SMOKE_DIAGNOSTIC_PATH | Write-Output }
          if ($packaged.ExitCode -ne 0) { throw "Packaged native USD+PCM source acceptance failed (exit $($packaged.ExitCode))" }
          # Prove the actual frozen bundle can create/authenticate/reopen an
          # encrypted archive before packaging. The installed chapter gate
          # still runs unchanged and is the independent live-store/UI test.
          $env:NVP_SMOKE_DIAGNOSTIC_PATH=Join-Path $env:RUNNER_TEMP 'nvp-packaged-vault-failure.txt'
          Remove-Item -LiteralPath $env:NVP_SMOKE_DIAGNOSTIC_PATH -ErrorAction SilentlyContinue
          $vault=Start-Process -FilePath (Resolve-Path 'dist/NVP/NVP.exe').Path -ArgumentList '--smoke-vault' -PassThru
          if (-not $vault.WaitForExit(110000)) {
            & taskkill.exe /PID $vault.Id /T /F 2>$null | Out-Null
            throw 'Packaged native DPAPI/AES-GCM archive smoke timed out'
          }
          if (Test-Path -LiteralPath $env:NVP_SMOKE_DIAGNOSTIC_PATH) { Get-Content -LiteralPath $env:NVP_SMOKE_DIAGNOSTIC_PATH | Write-Output }
          if ($vault.ExitCode -ne 0) { throw "Packaged native DPAPI/AES-GCM archive smoke failed (exit $($vault.ExitCode))" }
          if (-not (Test-Path -LiteralPath $env:NVP_SMOKE_DIAGNOSTIC_PATH) -or
              -not (Select-String -LiteralPath $env:NVP_SMOKE_DIAGNOSTIC_PATH -SimpleMatch 'windows_key_custody_reopened_verified' -Quiet)) {
            throw 'Packaged native encrypted archive reopen receipt missing'
          }
      - name: Build dedicated single-click NSIS installed candidate
        shell: pwsh
        run: |
          . ./tools/nvp_ci_nsis.ps1
          $nsis = Get-NvpNsisCompiler
          if (-not $nsis) { throw 'No qualified installed NSIS compiler' }
          & $nsis '/V3' 'packaging/nvp-alpha.nsi'
          if ($LASTEXITCODE -ne 0 -or -not (Test-Path 'dist/NVP-Alpha-Setup.exe')) {
            throw 'Native NSIS packaging failed'
          }
      - name: Actual installation, frozen source sound, real WebView2 and safe uninstall
        shell: pwsh
        run: |
          $installer=(Resolve-Path 'dist/NVP-Alpha-Setup.exe').Path
          $installed=Join-Path $env:LOCALAPPDATA 'Programs/NVP/NVP.exe'
          $setup=Start-Process -FilePath $installer -ArgumentList '/S' -Wait -PassThru
          if ($setup.ExitCode -ne 0 -or -not (Test-Path $installed)) { throw 'NVP install failed' }
          if ((Get-FileHash dist/NVP/NVP.exe -Algorithm SHA256).Hash -ne
              (Get-FileHash -LiteralPath $installed -Algorithm SHA256).Hash) {
            throw 'Installed NVP executable differs from built native source'
          }
          $env:NVP_SMOKE_DIAGNOSTIC_PATH=Join-Path $env:RUNNER_TEMP 'nvp-installed-data-av-failure.txt'
          Remove-Item -LiteralPath $env:NVP_SMOKE_DIAGNOSTIC_PATH -ErrorAction SilentlyContinue
          # A successful native USD/PCM stage receipt is not a process-exit
          # receipt. Bound the actual installed binary's exit, preserve its
          # diagnostics, and fail closed if it remains alive after acceptance.
          $smoke=Start-Process -FilePath $installed -ArgumentList '--smoke-data-av' -PassThru
          if (-not $smoke.WaitForExit(120000)) {
            Write-Output "NVP_INSTALLED_SOURCE_EXIT_TIMEOUT pid=$($smoke.Id)"
            if (Test-Path -LiteralPath $env:NVP_SMOKE_DIAGNOSTIC_PATH) {
              Get-Content -LiteralPath $env:NVP_SMOKE_DIAGNOSTIC_PATH | Write-Output
            }
            $smoke.Refresh()
            if (-not $smoke.HasExited) {
              $smoke.Kill($true)
              if (-not $smoke.WaitForExit(10000)) { throw 'Timed-out NVP.exe could not be stopped' }
            }
            throw 'Installed NVP.exe did not exit within 120 seconds; native smoke is NOT accepted'
          }
          $smokeExit=$smoke.ExitCode
          if (Test-Path -LiteralPath $env:NVP_SMOKE_DIAGNOSTIC_PATH) {
            Get-Content -LiteralPath $env:NVP_SMOKE_DIAGNOSTIC_PATH | Write-Output
          }
          if ($smokeExit -ne 0) { throw "Installed native Digital Take and sound playback failed (exit $smokeExit)" }
          if (-not (Test-Path -LiteralPath $env:NVP_SMOKE_DIAGNOSTIC_PATH)) {
            throw 'Installed native USD/PCM original smoke receipt missing'
          }
          $smokeReport=Get-Content -LiteralPath $env:NVP_SMOKE_DIAGNOSTIC_PATH -Raw
          if (-not $smokeReport.Contains('NVP_SMOKE_STAGE after_native_acceptance_run')) {
            throw 'Installed native USD/PCM original smoke never completed'
          }
          # Check OS process state independently of the positive receipt.
          $leftovers=@(Get-CimInstance Win32_Process -Filter "Name = 'NVP.exe'" |
            Where-Object { $_.ExecutablePath -eq $installed })
          if ($leftovers.Count -ne 0) { throw 'Installed native source smoke left NVP.exe running' }
          # P1-A installed native worker dependency/receipt check is a
          # separate real NVP.exe process, not a claim of physical ADC capture.
          $env:NVP_SMOKE_DIAGNOSTIC_PATH=Join-Path $env:RUNNER_TEMP 'nvp-installed-p1a-producer-bundle.txt'
          Remove-Item -LiteralPath $env:NVP_SMOKE_DIAGNOSTIC_PATH -ErrorAction SilentlyContinue
          $producer=Start-Process -FilePath $installed -ArgumentList '--smoke-producer-bundle' -PassThru
          if (-not $producer.WaitForExit(120000)) {
            $producer.Refresh()
            if (-not $producer.HasExited) {
              $producer.Kill($true)
              if (-not $producer.WaitForExit(10000)) { throw 'Timed-out installed P1-A producer could not be stopped' }
            }
            throw 'Installed protected producer import smoke timed out; no acceptance'
          }
          if ($producer.ExitCode -ne 0) { throw "Installed P1-A producer bundle failed (exit $($producer.ExitCode))" }
          if (-not (Test-Path -LiteralPath $env:NVP_SMOKE_DIAGNOSTIC_PATH)) {
            throw 'Installed P1-A producer original receipt missing'
          }
          $producerReport=Get-Content -LiteralPath $env:NVP_SMOKE_DIAGNOSTIC_PATH -Raw
          if (-not $producerReport.Contains('NVP_SMOKE_STAGE producer_bundle_verified_no_device_opened')) {
            throw 'Installed P1-A dependency verification never completed'
          }
          $producerLeftovers=@(Get-CimInstance Win32_Process -Filter "Name = 'NVP.exe'" |
            Where-Object { $_.ExecutablePath -eq $installed })
          if ($producerLeftovers.Count -ne 0) { throw 'Installed P1-A probe left a native process running' }
          # Independently observe the ACTUAL installed WebView2/React/IPC
          # failure; the previous receipt proved native USD/PCM but not UI.
          # Use a separate throwaway CI diagnostic so a prior smoke cannot
          # be mistaken for WebView2 success or hide its original traceback.
          $env:NVP_SMOKE_DIAGNOSTIC_PATH=Join-Path $env:RUNNER_TEMP 'nvp-installed-webview2-failure.txt'
          Remove-Item -LiteralPath $env:NVP_SMOKE_DIAGNOSTIC_PATH -ErrorAction SilentlyContinue
          $window=Start-Process -FilePath $installed -ArgumentList '--smoke-window' -PassThru
          if (-not $window.WaitForExit(120000)) {
            Write-Output "NVP_INSTALLED_WEBVIEW_EXIT_TIMEOUT pid=$($window.Id)"
            if (Test-Path -LiteralPath $env:NVP_SMOKE_DIAGNOSTIC_PATH) {
              Get-Content -LiteralPath $env:NVP_SMOKE_DIAGNOSTIC_PATH | Write-Output
            }
            $window.Refresh()
            if (-not $window.HasExited) {
              $window.Kill($true)
              if (-not $window.WaitForExit(10000)) { throw 'Timed-out installed WebView2 could not be stopped' }
            }
            throw 'Installed WebView2 did not exit within 120 seconds; native UI is NOT accepted'
          }
          if (Test-Path -LiteralPath $env:NVP_SMOKE_DIAGNOSTIC_PATH) {
            Get-Content -LiteralPath $env:NVP_SMOKE_DIAGNOSTIC_PATH | Write-Output
          }
          if ($window.ExitCode -ne 0) { throw "Installed WebView2 data-first sound UI failed (exit $($window.ExitCode))" }
          if (-not (Test-Path -LiteralPath $env:NVP_SMOKE_DIAGNOSTIC_PATH)) {
            throw 'Installed WebView2 original smoke receipt missing'
          }
          $windowReport=Get-Content -LiteralPath $env:NVP_SMOKE_DIAGNOSTIC_PATH -Raw
          if (-not $windowReport.Contains('NVP_SMOKE_STAGE window_webview2_loop_exited')) {
            throw 'Installed native WebView2 original smoke did not finish'
          }
          $uiLeftovers=@(Get-CimInstance Win32_Process -Filter "Name = 'NVP.exe'" |
            Where-Object { $_.ExecutablePath -eq $installed })
          if ($uiLeftovers.Count -ne 0) { throw 'Installed WebView2 left NVP.exe running' }
          $env:NVP_SMOKE_DIAGNOSTIC_PATH=Join-Path $env:RUNNER_TEMP 'nvp-installed-chapter-editor.txt'
          Remove-Item -LiteralPath $env:NVP_SMOKE_DIAGNOSTIC_PATH -ErrorAction SilentlyContinue
          $chapter=Start-Process -FilePath $installed -ArgumentList '--smoke-perf03g-window' -PassThru
          if (-not $chapter.WaitForExit(240000)) {
            $chapter.Refresh()
            if (-not $chapter.HasExited) { $chapter.Kill($true); if (-not $chapter.WaitForExit(10000)) { throw 'Timed-out chapter editor could not be stopped' } }
            throw 'Installed protected chapter editor timed out; native acceptance failed'
          }
          if (Test-Path -LiteralPath $env:NVP_SMOKE_DIAGNOSTIC_PATH) { Get-Content -LiteralPath $env:NVP_SMOKE_DIAGNOSTIC_PATH | Write-Output }
          if ($chapter.ExitCode -ne 0) { throw "Installed protected chapter editor failed (exit $($chapter.ExitCode))" }
          if (-not (Test-Path -LiteralPath $env:NVP_SMOKE_DIAGNOSTIC_PATH)) { throw 'Installed chapter editor receipt missing' }
          $chapterReport=Get-Content -LiteralPath $env:NVP_SMOKE_DIAGNOSTIC_PATH -Raw
          if (-not ($chapterReport.Contains('NVP_SMOKE_STAGE perf03g_real_webview2_protected_paged_editor_verified') -and $chapterReport.Contains('NVP_SMOKE_STAGE perf03g_real_webview2_loop_exited') -and $chapterReport.Contains('NVP_SMOKE_STAGE perf03g_real_webview2_sampled_media_recovery_review_verified') -and $chapterReport.Contains('NVP_SMOKE_STAGE perf03g_real_webview2_review_clip_and_backup_controls_verified'))) { throw 'Real protected chapter editor DOM and clean exit were not verified' }
          $chapterLeftovers=@(Get-CimInstance Win32_Process -Filter "Name = 'NVP.exe'" | Where-Object { $_.ExecutablePath -eq $installed })
          if ($chapterLeftovers.Count -ne 0) { throw 'Installed chapter editor left NVP.exe running' }
          if ((git rev-parse HEAD).Trim() -ne '${{ github.event.pull_request.head.sha || github.sha }}') { throw 'Source drift after installed chapter editor' }
          # Separate generated-only installed native feature worker gate. Neither
          # portable pipe execution nor a working-frame fixture is creator consent.
          $env:NVP_SMOKE_DIAGNOSTIC_PATH=Join-Path $env:RUNNER_TEMP 'nvp-installed-feature-worker.txt'
          Remove-Item -LiteralPath $env:NVP_SMOKE_DIAGNOSTIC_PATH -ErrorAction SilentlyContinue
          $denied=Start-Process -FilePath $installed -ArgumentList '--g07-protected-reel-worker' -PassThru
          if (-not $denied.WaitForExit(15000)) { $denied.Kill($true); throw 'Uncontained worker direct invocation did not fail closed' }
          if ($denied.ExitCode -ne 3) { throw 'Uncontained worker direct invocation was not refused' }
          $feature=Start-Process -FilePath $installed -ArgumentList '--smoke-perf03g-worker' -PassThru
          if (-not $feature.WaitForExit(540000)) { $feature.Refresh(); if (-not $feature.HasExited) { $feature.Kill($true) }; throw 'Installed feature worker qualification timed out' }
          if (Test-Path -LiteralPath $env:NVP_SMOKE_DIAGNOSTIC_PATH) { Get-Content -LiteralPath $env:NVP_SMOKE_DIAGNOSTIC_PATH | Write-Output }
          if ($feature.ExitCode -ne 0 -or -not (Test-Path -LiteralPath $env:NVP_SMOKE_DIAGNOSTIC_PATH)) { throw 'Installed private feature worker failed' }
          $featureReport=Get-Content -LiteralPath $env:NVP_SMOKE_DIAGNOSTIC_PATH -Raw
          foreach ($marker in @('perf03g_native_active_worker_cancelled','perf03g_native_reels_and_pcm_verified','perf03g_native_worker_clean_exit')) {
            if (-not $featureReport.Contains('NVP_SMOKE_STAGE '+$marker)) { throw 'Missing installed native feature worker receipt' }
          }
          # Genuine installed WebView2 native creator controls and stop.
          # Isolated public fixture, no actual owner approval implied.
          $env:NVP_SMOKE_DIAGNOSTIC_PATH=Join-Path $env:RUNNER_TEMP 'nvp-installed-working-movie.txt'
          Remove-Item -LiteralPath $env:NVP_SMOKE_DIAGNOSTIC_PATH -ErrorAction SilentlyContinue
          $working=Start-Process -FilePath $installed -ArgumentList '--smoke-perf03g-production-window' -PassThru
          if (-not $working.WaitForExit(900000)) { $working.Refresh(); if (-not $working.HasExited) { $working.Kill($true) }; throw 'Installed graphical production qualification timed out' }
          if (Test-Path -LiteralPath $env:NVP_SMOKE_DIAGNOSTIC_PATH) { Get-Content -LiteralPath $env:NVP_SMOKE_DIAGNOSTIC_PATH | Write-Output }
          if ($working.ExitCode -ne 0 -or -not (Test-Path -LiteralPath $env:NVP_SMOKE_DIAGNOSTIC_PATH)) { throw 'Installed graphical production qualification failed' }
          $workingReport=Get-Content -LiteralPath $env:NVP_SMOKE_DIAGNOSTIC_PATH -Raw
          foreach ($marker in @('perf03g_r8_actual_graphical_worker_stop_verified','perf03g_r8_actual_graphical_resume_and_native_reels_verified','perf03g_r10_actual_graphical_playback_complete','perf03g_r8_actual_graphical_clean_exit')) {
            if (-not $workingReport.Contains('NVP_SMOKE_STAGE '+$marker)) { throw 'Missing installed graphical production receipt' }
          }
          $featureLeftovers=@(Get-CimInstance Win32_Process -Filter "Name = 'NVP.exe'" | Where-Object { $_.ExecutablePath -eq $installed })
          if ($featureLeftovers.Count -ne 0) { throw 'Installed feature worker left NVP.exe running' }
          if ((git rev-parse HEAD).Trim() -ne '${{ github.event.pull_request.head.sha || github.sha }}') { throw 'Source drift after native feature worker' }
          $uninstall=Join-Path $env:LOCALAPPDATA 'Programs/NVP/Uninstall NVP.exe'
          if (-not (Test-Path $uninstall)) { throw 'NVP uninstaller unavailable' }
          $result=Start-Process -FilePath $uninstall -ArgumentList '/S' -Wait -PassThru
          if ($result.ExitCode -ne 0) { throw 'Uninstall failed' }
          if (Test-Path $installed) { throw 'Native desktop remains after uninstall' }
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: nvp-data-av01-native-windows-installer
          path: dist/NVP-Alpha-Setup.exe
          retention-days: 7


  actual-plan02c-gguf:
    # One real Qwen/llama.cpp acceptance within the group, not one CI job
    # per small edit. Run only on the deliberately marked group-end push.
    if: ${{ github.event_name == 'push' && contains(github.event.head_commit.message, '[PLAN-02-C gate]') }}
    needs: [zero-ffmpeg-policy]
    runs-on: ubuntu-24.04
    timeout-minutes: 100
    name: Genuine hashed Qwen GGUF -> unapproved canonical USD camera advice
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Verify exact source head (never synthetic PR merge)
        shell: bash
        run: |
          set -euo pipefail
          expected="${{ github.event.pull_request.head.sha || github.sha }}"
          actual="$(git rev-parse HEAD)"
          echo "NVP_DATA_AV_ACCEPTANCE_HEAD=$actual"
          echo "NVP_DATA_AV_SOURCE_TREE=$(git rev-parse HEAD^{tree})"
          test "$actual" = "$expected"
      - uses: actions/checkout@v4
        with:
          repository: ggml-org/llama.cpp
          ref: master
          path: deps/llama.cpp
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Real native USD and first-party optional model dependencies
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --only-binary=:all: 'usd-core==26.11'
          python -m pip install -r requirements-foundation.txt
      - name: Build real CPU-only llama.cpp server and record actual source HEAD
        shell: bash
        run: |
          set -euo pipefail
          git -C deps/llama.cpp rev-parse HEAD | tee "$RUNNER_TEMP/plan02c-llama-source-head.txt"
          cmake -S deps/llama.cpp -B deps/llama.cpp/build -DCMAKE_BUILD_TYPE=Release -DGGML_NATIVE=OFF -DLLAMA_BUILD_SERVER=ON -DLLAMA_CURL=OFF
          cmake --build deps/llama.cpp/build --config Release --target llama-server --parallel 2
          server="$(find deps/llama.cpp/build -type f -name llama-server -perm -111 | head -n 1)"
          test -n "$server" && test -x "$server"
          echo "NVP_REAL_LLAMA_SERVER=$(realpath "$server")" >> "$GITHUB_ENV"
      - name: Fetch exact licensed official Qwen2.5-0.5B-Instruct Q4_K_M GGUF
        shell: bash
        run: |
          set -euo pipefail
          file="$RUNNER_TEMP/qwen2.5-0.5b-instruct-q4_k_m.gguf"
          curl --fail --location --retry 3 --retry-delay 5 'https://huggingface.co/Qwen/Qwen2.5-0.5B-Instruct-GGUF/resolve/main/qwen2.5-0.5b-instruct-q4_k_m.gguf' -o "$file"
          echo "74a4da8c9fdbcd15bd1f6d01d621410d31c6fc00986f5eb687824e7b93d7a9db  $file" | sha256sum --check --status
          test "$(head -c 4 "$file")" = GGUF
          echo "NVP_REAL_QWEN_GGUF=$file" >> "$GITHUB_ENV"
      - name: Actual original frozen Take to real unapproved GGUF camera proposal
        shell: bash
        run: |
          set -euo pipefail
          python -m tools.nvp_plan02c_real_gguf \
            --model "$NVP_REAL_QWEN_GGUF" \
            --llama-server "$NVP_REAL_LLAMA_SERVER" \
            --report "$RUNNER_TEMP/plan02c-real-gguf.json" \
            --consent I_APPROVE_DISPOSABLE_LOCAL_GGUF_TEST
          python - <<'PY'
          import json,os,pathlib
          report=json.loads((pathlib.Path(os.environ['RUNNER_TEMP'])/'plan02c-real-gguf.json').read_text())
          assert report['status']=='REAL_HASHED_GGUF_GENERATED_UNAPPROVED_SOURCE_CAMERA_ADVICE'
          assert report['provider_reported_completion_tokens']>0
          assert report['source_original_pcm_unchanged'] is True
          assert report['human_publication_approval'] is False
          assert report['native_renderer_worker_authorized'] is False
          print('PLAN02C_REAL_GGUF_SOURCE_CAMERA_ADVICE_VERIFIED_NO_APPROVAL')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: plan02c-genuine-hashed-gguf-source-camera-unapproved
          path: |
            ${{ runner.temp }}/plan02c-llama-source-head.txt
            ${{ runner.temp }}/plan02c-real-gguf.json
          if-no-files-found: warn
          retention-days: 14
