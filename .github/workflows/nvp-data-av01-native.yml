name: NVP DATA-AV-01 Frozen Scene and Native Spatial Sound (NO FFMPEG)

on:
  push:
    branches:
      - nvp/data-av01-native-scene-playback-20261106
  pull_request:
    paths:
      - 'backend/nvp_data_av_*.py'
      - 'backend/nvp_exact_time_shots.py'
      - 'frontend/src/ExactFilmTimeShotPanel.jsx'
      - 'tests/test_nvp_exact_time_shots.py'
      - 'backend/nvp_data_first_filming.py'
      - 'backend/nvp_imported_audio.py'
      - 'tests/test_nvp_imported_audio.py'
      - 'backend/nvp_final_2d_native.py'
      - 'backend/nvp_native_avi_delivery.py'
      - 'backend/nvp_native_live_take.py'
      - 'backend/nvp_native_stereo_take.py'
      - 'backend/nvp_capture_recovery.py'
      - 'backend/nvp_native_hrir.py'
      - 'backend/nvp_openusd_skinning.py'
      - 'backend/nvp_openusd_skeleton.py'
      - 'tests/test_nvp_native_stereo_recovery.py'
      - 'tests/test_nvp_native_measured_binaural.py'
      - 'tests/test_nvp_native_usd_facial_material.py'
      - 'backend/nvp_native_spatial_acoustics.py'
      - 'backend/nvp_openusd_skeleton.py'
      - 'backend/nvp_data_av_skinning.py'
      - 'tests/test_nvp_data_av_skinned_world.py'
      - 'tests/test_nvp_real_usd_acoustic_occlusion.py'
      - 'frontend/src/DataFirstWorldViewport.test.jsx'
      - 'backend/nvp_openusd_assets.py'
      - 'tests/test_nvp_original_mesh_presentation.py'
      - 'tests/test_nvp_native_spatial_acoustics.py'
      - 'backend/nvp_native_color_eval.py'
      - 'backend/nvp_native_aces_color.py'
      - 'tests/test_nvp_native_aces_color.py'
      - 'requirements-foundation.txt'
      - 'tests/test_nvp_native_color_eval.py'
      - 'frontend/src/DataFirstWorldViewport.jsx'
      - 'tests/test_nvp_native_live_take.py'
      - 'backend/nvp_legacy_quarantine.py'
      - 'backend/nvp_slate_edit_assembly.py'
      - 'tests/test_nvp_digital_slate_branches_native.py'
      - 'tests/test_nvp_legacy_camera_retirement.py'
      - 'backend/nvp_api.py'
      - 'tests/test_nvp_native_avi_delivery.py'
      - 'tests/test_nvp_legacy_quarantine.py'
      - 'frontend/src/DataFirstAVPanel.jsx'
      - 'backend/nvp_native_cpu_raster.py'
      - 'tests/test_nvp_final_2d_native.py'
      - 'backend/nvp_native_color_decisions.py'
      - 'tests/test_nvp_native_color_decisions.py'
      - 'frontend/src/NativeColorGradePanel.jsx'
      - 'tests/test_nvp_data_first_filming.py'
      - 'tools/nvp_no_ffmpeg_contract.py'
      - 'backend/nvp_slate08b_native_camera_ipc.py'
      - 'frontend/src/DataFirstAVPanel*'
      - 'frontend/src/App.jsx'
      - 'tools/nvp_data_av_installed_acceptance.py'
      - 'tools/nvp_desktop_alpha.py'
      - 'tests/test_nvp_data_av_native.py'
      - '.github/workflows/nvp-data-av01-native.yml'
      - 'docs/NVP_DATA_AV01_NATIVE_MIGRATION.md'
  workflow_dispatch:

permissions:
  contents: read
concurrency:
  group: nvp-native-data-av01-${{ github.ref }}
  cancel-in-progress: true

jobs:
  zero-ffmpeg-policy:
    name: DA-00 zero-FFmpeg native dependency audit
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Refuse executable FFmpeg/ffprobe in active import graph or installer
        run: python tools/nvp_no_ffmpeg_contract.py

  native-frozen-source:
    needs: [zero-ffmpeg-policy]
    name: Native scene + PCM / ${{ matrix.os }} / Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025]
        python: ['3.11','3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install real native OpenUSD only (no FFmpeg)
        shell: bash
        run: |
          python -m pip install --only-binary=:all: 'usd-core==26.11'
          python -m pip install -r requirements-foundation.txt
      - name: No external video decoder or derived movie dependency
        shell: bash
        run: |
          set -euo pipefail
          python -m compileall -q backend/nvp_data_av_skinning.py backend/nvp_native_spatial_acoustics.py backend/nvp_openusd_skeleton.py backend/nvp_openusd_skinning.py backend/nvp_native_stereo_take.py backend/nvp_capture_recovery.py backend/nvp_native_hrir.py
          python -m compileall -q backend/nvp_data_av_source.py backend/nvp_data_av_scene.py backend/nvp_data_av_usd.py backend/nvp_data_av_desktop.py backend/nvp_slate08b_native_camera_ipc.py tools/nvp_desktop_alpha.py tools/nvp_data_av_installed_acceptance.py tests/test_nvp_data_av_native.py
          python -m unittest discover -s tests -p 'test_nvp_data_av_native.py' -v
          python -m unittest discover -s tests -p 'test_nvp_exact_time_shots.py' -v
          python -m unittest discover -s tests -p 'test_nvp_digital_slate_branches_native.py' -v
          python -m unittest discover -s tests -p 'test_nvp_data_first_filming.py' -v
          python -m unittest discover -s tests -p 'test_nvp_imported_audio.py' -v
          python -m unittest discover -s tests -p 'test_nvp_final_2d_native.py' -v
          python -m unittest discover -s tests -p 'test_nvp_native_avi_delivery.py' -v
          python -m unittest discover -s tests -p 'test_nvp_native_live_take.py' -v
          python -m unittest discover -s tests -p 'test_nvp_native_stereo_recovery.py' -v
          python -m unittest discover -s tests -p 'test_nvp_native_measured_binaural.py' -v
          python -m unittest discover -s tests -p 'test_nvp_native_usd_facial_material.py' -v
          python -m unittest discover -s tests -p 'test_nvp_native_spatial_acoustics.py' -v
          python -m unittest discover -s tests -p 'test_nvp_real_usd_acoustic_occlusion.py' -v
          python -m unittest discover -s tests -p 'test_nvp_data_av_skinned_world.py' -v
          python -m unittest discover -s tests -p 'test_nvp_openusd_native_schemas.py' -v
          python -m unittest discover -s tests -p 'test_nvp_original_mesh_presentation.py' -v
          python -m unittest discover -s tests -p 'test_nvp_native_color_eval.py' -v
          python -m unittest discover -s tests -p 'test_nvp_native_aces_color.py' -v
          python -m unittest discover -s tests -p 'test_nvp_legacy_quarantine.py' -v
          python -m unittest discover -s tests -p 'test_nvp_native_color_decisions.py' -v
      - name: Existing frozen source/camera/provenance regressions
        shell: bash
        run: |
          python -m unittest discover -s tests -p 'test_nvp_openusd_take_native.py' -v
          python -m unittest discover -s tests -p 'test_nvp_openusd_reusable_assets.py' -v
          # Retired SLATE-08B still IPC tests assert an intentionally removed
          # executable feature. Check the retirement instead of resurrecting it.
          python -m unittest discover -s tests -p 'test_nvp_legacy_camera_retirement.py' -v
          python -m unittest discover -s tests -p 'test_data_time_projection.py' -v

  native-react:
    needs: [zero-ffmpeg-policy]
    name: React source audition and no automatic conventional movie proxy
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - run: npm run build
      - run: npm run test:ui -- src/DataFirstAVPanel.test.jsx src/DataFirstWorldViewport.test.jsx src/FilmCameraSourcePanel.test.jsx src/CameraLensWorkbench.test.jsx

  installed-windows-native:
    name: Real packaged / installed Windows NVP.exe with OpenUSD and PCM (no FFmpeg)
    runs-on: windows-2025
    timeout-minutes: 80
    needs: [zero-ffmpeg-policy, native-react]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Build real offline React frontend
        shell: pwsh
        run: |
          Push-Location frontend
          npm install --no-audit --no-fund
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm run build
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Pop-Location
      - name: Native USD + GUI/installer packager, no FFmpeg installed by workflow
        shell: pwsh
        run: |
          python -m pip install --only-binary=:all: 'usd-core==26.11'
          if ($LASTEXITCODE -ne 0) { throw 'Native OpenUSD unavailable' }
          python -m pip install -r requirements-foundation.txt 'pyinstaller>=6.10,<7' 'pywebview>=5.3,<7' 'pywin32>=306'
          if ($LASTEXITCODE -ne 0) { throw 'Native desktop packager unavailable' }
          choco install nsis -y --no-progress
          if ($LASTEXITCODE -ne 0) { throw 'NSIS unavailable' }
      - name: Bundle actual native NVP.exe + real USD and offline editor
        shell: pwsh
        run: |
          python -m PyInstaller --noconfirm --clean --onedir --windowed --name NVP --paths . --add-data 'frontend/dist;frontend/dist' --collect-all webview --collect-all miniaudio --collect-all PIL --collect-all PyOpenColorIO --collect-all numpy --collect-submodules pxr --hidden-import backend.nvp_native_cpu_raster --hidden-import backend.nvp_final_2d_native --hidden-import backend.nvp_native_avi_delivery --hidden-import backend.nvp_native_live_take --hidden-import backend.nvp_native_spatial_acoustics --hidden-import backend.nvp_native_color_eval --hidden-import backend.nvp_native_aces_color --hidden-import backend.nvp_legacy_quarantine --hidden-import backend.nvp_data_av_source --hidden-import backend.nvp_data_av_scene --hidden-import backend.nvp_data_av_usd --hidden-import backend.nvp_data_av_desktop --hidden-import backend.nvp_slate08b_native_camera_ipc --hidden-import tools.nvp_data_av_installed_acceptance tools/nvp_desktop_alpha.py
          if ($LASTEXITCODE -ne 0) { throw 'Installed NVP executable could not be produced' }
          if (-not (Test-Path dist/NVP/NVP.exe)) { throw 'NVP.exe missing' }
          $bundled=@(Get-ChildItem dist/NVP -Recurse -File | Where-Object { $_.Name -in @('ffmpeg.exe','ffprobe.exe') })
          if ($bundled.Count -ne 0) { throw 'Legacy FFmpeg was accidentally bundled into native data AV' }
          & 'dist/NVP/NVP.exe' '--smoke-data-av'
          if ($LASTEXITCODE -ne 0) { throw 'Packaged native USD+PCM source acceptance failed' }
      - name: Build dedicated single-click NSIS installed candidate
        shell: pwsh
        run: |
          $possible=@(
            (Join-Path ([Environment]::GetFolderPath('ProgramFilesX86')) 'NSIS/makensis.exe'),
            (Join-Path $env:ProgramFiles 'NSIS/makensis.exe'),
            (Join-Path $env:ChocolateyInstall 'bin/makensis.exe')
          )
          $nsis=$possible | Where-Object { Test-Path -LiteralPath $_ -PathType Leaf } | Select-Object -First 1
          if (-not $nsis) { throw 'No trusted installed NSIS compiler' }
          & $nsis '/V3' 'packaging/nvp-alpha.nsi'
          if ($LASTEXITCODE -ne 0 -or -not (Test-Path 'dist/NVP-Alpha-Setup.exe')) {
            throw 'Native NSIS packaging failed'
          }
      - name: Actual installation, frozen source sound, real WebView2 and safe uninstall
        shell: pwsh
        run: |
          $installer=(Resolve-Path 'dist/NVP-Alpha-Setup.exe').Path
          $installed=Join-Path $env:LOCALAPPDATA 'Programs/NVP/NVP.exe'
          $setup=Start-Process -FilePath $installer -ArgumentList '/S' -Wait -PassThru
          if ($setup.ExitCode -ne 0 -or -not (Test-Path $installed)) { throw 'NVP install failed' }
          if ((Get-FileHash dist/NVP/NVP.exe -Algorithm SHA256).Hash -ne
              (Get-FileHash -LiteralPath $installed -Algorithm SHA256).Hash) {
            throw 'Installed NVP executable differs from built native source'
          }
          $env:NVP_NATIVE_SMOKE_DIAGNOSTICS=Join-Path $env:RUNNER_TEMP 'nvp-installed-av-traceback.txt'
          & $installed '--smoke-data-av'
          if ($LASTEXITCODE -ne 0) {
            if (Test-Path $env:NVP_NATIVE_SMOKE_DIAGNOSTICS) {
              Get-Content $env:NVP_NATIVE_SMOKE_DIAGNOSTICS
            }
            throw 'Installed native Digital Take and sound playback failed'
          }
          $env:NVP_NATIVE_SMOKE_DIAGNOSTICS=Join-Path $env:RUNNER_TEMP 'nvp-installed-webview-traceback.txt'
          & $installed '--smoke-window'
          if ($LASTEXITCODE -ne 0) {
            if (Test-Path $env:NVP_NATIVE_SMOKE_DIAGNOSTICS) {
              Get-Content $env:NVP_NATIVE_SMOKE_DIAGNOSTICS
            }
            throw 'Installed WebView2 data-first sound UI failed'
          }
          $uninstall=Join-Path $env:LOCALAPPDATA 'Programs/NVP/Uninstall NVP.exe'
          if (-not (Test-Path $uninstall)) { throw 'NVP uninstaller unavailable' }
          $result=Start-Process -FilePath $uninstall -ArgumentList '/S' -Wait -PassThru
          if ($result.ExitCode -ne 0) { throw 'Uninstall failed' }
          if (Test-Path $installed) { throw 'Native desktop remains after uninstall' }
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: nvp-data-av01-native-windows-installer
          path: dist/NVP-Alpha-Setup.exe
          retention-days: 7
