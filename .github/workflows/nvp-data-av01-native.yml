name: NVP DATA-AV-01 Frozen Scene and Native Spatial Sound (NO FFMPEG)

on:
  push:
    branches:
      - nvp/data-av01-native-scene-playback-20261106
  pull_request:
    paths:
      - 'backend/nvp_data_av_*.py'
      - 'backend/nvp_exact_time_shots.py'
      - 'frontend/src/ExactFilmTimeShotPanel.jsx'
      - 'tests/test_nvp_exact_time_shots.py'
      - 'backend/nvp_data_first_filming.py'
      - 'backend/nvp_filming_linux_session.py'
      - 'backend/nvp_filming_cgroup_*.py'
      - 'tests/test_nvp_filming_*.py'
      - 'backend/nvp_imported_audio.py'
      - 'tests/test_nvp_imported_audio.py'
      - 'backend/nvp_final_2d_native.py'
      - 'backend/nvp_native_cpu_raster.py'
      - 'tests/test_nvp_final_2d_native.py'
      - 'backend/nvp_native_color_decisions.py'
      - 'tests/test_nvp_native_color_decisions.py'
      - 'frontend/src/NativeColorGradePanel.jsx'
      - 'tests/test_nvp_data_first_filming.py'
      - 'tools/nvp_no_ffmpeg_contract.py'
      - 'backend/nvp_slate08b_native_camera_ipc.py'
      - 'frontend/src/DataFirstAVPanel*'
      - 'frontend/src/App.jsx'
      - 'tools/nvp_data_av_installed_acceptance.py'
      - 'tools/nvp_desktop_alpha.py'
      - 'tests/test_nvp_data_av_native.py'
      - '.github/workflows/nvp-data-av01-native.yml'
      - 'docs/NVP_DATA_AV01_NATIVE_MIGRATION.md'
  workflow_dispatch:

permissions:
  contents: read
concurrency:
  group: nvp-native-data-av01-${{ github.ref }}
  cancel-in-progress: true

jobs:
  zero-ffmpeg-policy:
    name: DA-00 zero-FFmpeg native dependency audit
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Refuse executable FFmpeg/ffprobe in active import graph or installer
        run: python tools/nvp_no_ffmpeg_contract.py

  native-frozen-source:
    needs: [zero-ffmpeg-policy]
    name: Native scene + PCM / ${{ matrix.os }} / Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025]
        python: ['3.11','3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install real native OpenUSD only (no FFmpeg)
        shell: bash
        run: |
          python -m pip install --only-binary=:all: 'usd-core==26.11'
          python -m pip install -r requirements-foundation.txt
      - name: No external video decoder or derived movie dependency
        shell: bash
        run: |
          set -euo pipefail
          python -m compileall -q backend/nvp_data_av_source.py backend/nvp_data_av_scene.py backend/nvp_data_av_usd.py backend/nvp_data_av_desktop.py backend/nvp_slate08b_native_camera_ipc.py tools/nvp_desktop_alpha.py tools/nvp_data_av_installed_acceptance.py tests/test_nvp_data_av_native.py
          python -m unittest discover -s tests -p 'test_nvp_data_av_native.py' -v
          python -m unittest discover -s tests -p 'test_nvp_exact_time_shots.py' -v
          python -m unittest discover -s tests -p 'test_nvp_data_first_filming.py' -v
          python -m unittest discover -s tests -p 'test_nvp_imported_audio.py' -v
          python -m unittest discover -s tests -p 'test_nvp_final_2d_native.py' -v
          python -m unittest discover -s tests -p 'test_nvp_native_color_decisions.py' -v
      - name: PLAN-02-B original microphone, durable recovery and independent native ADC clock
        shell: bash
        run: |
          set -euo pipefail
          python -m compileall -q backend/nvp_capture_recovery.py backend/nvp_native_live_take.py backend/nvp_independent_device_sync.py backend/nvp_native_independent_take.py backend/nvp_native_capture_desktop.py backend/nvp_original_clock_binding.py backend/nvp_data_first_filming.py backend/nvp_data_av_scene.py
          python -m unittest discover -s tests -p 'test_nvp_native_live_take.py' -v
          python -m unittest discover -s tests -p 'test_nvp_native_independent_sync.py' -v
          python -m unittest discover -s tests -p 'test_nvp_plan02b_native_capture.py' -v
          python -m unittest discover -s tests -p 'test_nvp_plan02b_original_clock_binding.py' -v
          python -m unittest discover -s tests -p 'test_nvp_plan02c_native_camera_ai.py' -v
      - name: DA-03 recording host custody and original PCM publication contracts (not device acceptance)
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install 'pytest>=8,<10'
          python -m compileall -q backend/nvp_filming_host_bridge.py tests/test_nvp_filming_host_bridge.py
          python -m pytest -q tests/test_nvp_filming_host_bridge.py
      - name: DA-03 Linux filming session and cgroup custody contracts (not kernel acceptance)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install 'pytest>=8,<10'
          python -m compileall -q backend/nvp_filming_linux_session.py backend/nvp_filming_cgroup_custody.py backend/nvp_filming_cgroup_launch.py
          python -m pytest -q tests/test_nvp_filming_linux_session.py
      - name: Existing frozen source/camera/provenance regressions
        shell: bash
        run: |
          python -m unittest discover -s tests -p 'test_nvp_openusd_take_native.py' -v
          python -m unittest discover -s tests -p 'test_nvp_openusd_reusable_assets.py' -v
          python -m unittest discover -s tests -p 'test_nvp_slate08b_native_camera_ipc.py' -v
          python -m unittest discover -s tests -p 'test_data_time_projection.py' -v

  native-react:
    needs: [zero-ffmpeg-policy]
    name: React source audition and no automatic conventional movie proxy
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - run: npm run build
      - run: npm run test:ui -- src/DataFirstAVPanel.test.jsx src/NativeCameraRailPanel.test.jsx src/NativeOriginalCapturePanel.test.jsx src/FilmCameraSourcePanel.test.jsx src/CameraLensWorkbench.test.jsx src/FilmCameraNativeBridge.test.jsx

  installed-windows-native:
    name: Real packaged / installed Windows NVP.exe with OpenUSD and PCM (no FFmpeg)
    runs-on: windows-2025
    timeout-minutes: 80
    needs: [zero-ffmpeg-policy, native-react]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Build real offline React frontend
        shell: pwsh
        run: |
          Push-Location frontend
          npm install --no-audit --no-fund
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm run build
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Pop-Location
      - name: Native USD + GUI/installer packager, no FFmpeg installed by workflow
        shell: pwsh
        run: |
          python -m pip install --only-binary=:all: 'usd-core==26.11'
          if ($LASTEXITCODE -ne 0) { throw 'Native OpenUSD unavailable' }
          python -m pip install -r requirements-foundation.txt 'pyinstaller>=6.10,<7' 'pywebview>=5.3,<7' 'pywin32>=306'
          if ($LASTEXITCODE -ne 0) { throw 'Native desktop packager unavailable' }
          choco install nsis -y --no-progress
          if ($LASTEXITCODE -ne 0) { throw 'NSIS unavailable' }
      - name: Bundle actual native NVP.exe + real USD and offline editor
        shell: pwsh
        run: |
          python -m PyInstaller --noconfirm --clean --onedir --windowed --name NVP --paths . --add-data 'frontend/dist;frontend/dist' --collect-all webview --collect-all miniaudio --collect-all PIL --collect-all pxr --hidden-import backend.nvp_native_cpu_raster --hidden-import backend.nvp_final_2d_native --hidden-import backend.nvp_data_av_source --hidden-import backend.nvp_data_av_scene --hidden-import backend.nvp_data_av_usd --hidden-import backend.nvp_data_av_desktop --hidden-import backend.nvp_slate08b_native_camera_ipc --hidden-import backend.nvp_plan02c_desktop --hidden-import backend.nvp_plan02c_rails --hidden-import backend.nvp_plan02c_usd_rail --hidden-import backend.nvp_plan02c_model_advice --hidden-import backend.nvp_wo6_verified_local_model --hidden-import backend.nvp_native_capture_desktop --hidden-import backend.nvp_native_live_take --hidden-import backend.nvp_native_independent_take --hidden-import backend.nvp_independent_device_sync --hidden-import backend.nvp_capture_recovery --collect-all sounddevice --hidden-import tools.nvp_data_av_installed_acceptance tools/nvp_desktop_alpha.py
          if ($LASTEXITCODE -ne 0) { throw 'Installed NVP executable could not be produced' }
          if (-not (Test-Path dist/NVP/NVP.exe)) { throw 'NVP.exe missing' }
          $bundled=@(Get-ChildItem dist/NVP -Recurse -File | Where-Object { $_.Name -in @('ffmpeg.exe','ffprobe.exe') })
          if ($bundled.Count -ne 0) { throw 'Legacy FFmpeg was accidentally bundled into native data AV' }
          $env:NVP_SMOKE_DIAGNOSTIC_PATH=Join-Path $env:RUNNER_TEMP 'nvp-packaged-data-av-failure.txt'
          Remove-Item -LiteralPath $env:NVP_SMOKE_DIAGNOSTIC_PATH -ErrorAction SilentlyContinue
          $packaged=Start-Process -FilePath (Resolve-Path 'dist/NVP/NVP.exe').Path -ArgumentList '--smoke-data-av' -Wait -PassThru
          if (Test-Path -LiteralPath $env:NVP_SMOKE_DIAGNOSTIC_PATH) { Get-Content -LiteralPath $env:NVP_SMOKE_DIAGNOSTIC_PATH | Write-Output }
          if ($packaged.ExitCode -ne 0) { throw "Packaged native USD+PCM source acceptance failed (exit $($packaged.ExitCode))" }
      - name: Build dedicated single-click NSIS installed candidate
        shell: pwsh
        run: |
          $possible=@(
            (Join-Path ([Environment]::GetFolderPath('ProgramFilesX86')) 'NSIS/makensis.exe'),
            (Join-Path $env:ProgramFiles 'NSIS/makensis.exe'),
            (Join-Path $env:ChocolateyInstall 'bin/makensis.exe')
          )
          $nsis=$possible | Where-Object { Test-Path -LiteralPath $_ -PathType Leaf } | Select-Object -First 1
          if (-not $nsis) { throw 'No trusted installed NSIS compiler' }
          & $nsis '/V3' 'packaging/nvp-alpha.nsi'
          if ($LASTEXITCODE -ne 0 -or -not (Test-Path 'dist/NVP-Alpha-Setup.exe')) {
            throw 'Native NSIS packaging failed'
          }
      - name: Actual installation, frozen source sound, real WebView2 and safe uninstall
        shell: pwsh
        run: |
          $installer=(Resolve-Path 'dist/NVP-Alpha-Setup.exe').Path
          $installed=Join-Path $env:LOCALAPPDATA 'Programs/NVP/NVP.exe'
          $setup=Start-Process -FilePath $installer -ArgumentList '/S' -Wait -PassThru
          if ($setup.ExitCode -ne 0 -or -not (Test-Path $installed)) { throw 'NVP install failed' }
          if ((Get-FileHash dist/NVP/NVP.exe -Algorithm SHA256).Hash -ne
              (Get-FileHash -LiteralPath $installed -Algorithm SHA256).Hash) {
            throw 'Installed NVP executable differs from built native source'
          }
          $env:NVP_SMOKE_DIAGNOSTIC_PATH=Join-Path $env:RUNNER_TEMP 'nvp-installed-data-av-failure.txt'
          Remove-Item -LiteralPath $env:NVP_SMOKE_DIAGNOSTIC_PATH -ErrorAction SilentlyContinue
          $smoke=Start-Process -FilePath $installed -ArgumentList '--smoke-data-av' -Wait -PassThru
          $smokeExit=$smoke.ExitCode
          if (Test-Path -LiteralPath $env:NVP_SMOKE_DIAGNOSTIC_PATH) {
            Get-Content -LiteralPath $env:NVP_SMOKE_DIAGNOSTIC_PATH | Write-Output
          }
          if ($smokeExit -ne 0) { throw "Installed native Digital Take and sound playback failed (exit $smokeExit)" }
          $window=Start-Process -FilePath $installed -ArgumentList '--smoke-window' -Wait -PassThru
          if ($window.ExitCode -ne 0) { throw "Installed WebView2 data-first sound UI failed (exit $($window.ExitCode))" }
          $uninstall=Join-Path $env:LOCALAPPDATA 'Programs/NVP/Uninstall NVP.exe'
          if (-not (Test-Path $uninstall)) { throw 'NVP uninstaller unavailable' }
          $result=Start-Process -FilePath $uninstall -ArgumentList '/S' -Wait -PassThru
          if ($result.ExitCode -ne 0) { throw 'Uninstall failed' }
          if (Test-Path $installed) { throw 'Native desktop remains after uninstall' }
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: nvp-data-av01-native-windows-installer
          path: dist/NVP-Alpha-Setup.exe
          retention-days: 7


  actual-plan02c-gguf:
    # One real Qwen/llama.cpp acceptance within the group, not one CI job
    # per small edit. Run only on the deliberately marked group-end push.
    if: ${{ github.event_name == 'push' && contains(github.event.head_commit.message, '[PLAN-02-C gate]') }}
    needs: [zero-ffmpeg-policy]
    runs-on: ubuntu-24.04
    timeout-minutes: 100
    name: Genuine hashed Qwen GGUF -> unapproved canonical USD camera advice
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: ggml-org/llama.cpp
          ref: master
          path: deps/llama.cpp
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Real native USD and first-party optional model dependencies
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --only-binary=:all: 'usd-core==26.11'
          python -m pip install -r requirements-foundation.txt
      - name: Build real CPU-only llama.cpp server and record actual source HEAD
        shell: bash
        run: |
          set -euo pipefail
          git -C deps/llama.cpp rev-parse HEAD | tee "$RUNNER_TEMP/plan02c-llama-source-head.txt"
          cmake -S deps/llama.cpp -B deps/llama.cpp/build -DCMAKE_BUILD_TYPE=Release -DGGML_NATIVE=OFF -DLLAMA_BUILD_SERVER=ON -DLLAMA_CURL=OFF
          cmake --build deps/llama.cpp/build --config Release --target llama-server --parallel 2
          server="$(find deps/llama.cpp/build -type f -name llama-server -perm -111 | head -n 1)"
          test -n "$server" && test -x "$server"
          echo "NVP_REAL_LLAMA_SERVER=$(realpath "$server")" >> "$GITHUB_ENV"
      - name: Fetch exact licensed official Qwen2.5-0.5B-Instruct Q4_K_M GGUF
        shell: bash
        run: |
          set -euo pipefail
          file="$RUNNER_TEMP/qwen2.5-0.5b-instruct-q4_k_m.gguf"
          curl --fail --location --retry 3 --retry-delay 5 'https://huggingface.co/Qwen/Qwen2.5-0.5B-Instruct-GGUF/resolve/main/qwen2.5-0.5b-instruct-q4_k_m.gguf' -o "$file"
          echo "74a4da8c9fdbcd15bd1f6d01d621410d31c6fc00986f5eb687824e7b93d7a9db  $file" | sha256sum --check --status
          test "$(head -c 4 "$file")" = GGUF
          echo "NVP_REAL_QWEN_GGUF=$file" >> "$GITHUB_ENV"
      - name: Actual original frozen Take to real unapproved GGUF camera proposal
        shell: bash
        run: |
          set -euo pipefail
          python -m tools.nvp_plan02c_real_gguf \
            --model "$NVP_REAL_QWEN_GGUF" \
            --llama-server "$NVP_REAL_LLAMA_SERVER" \
            --report "$RUNNER_TEMP/plan02c-real-gguf.json" \
            --consent I_APPROVE_DISPOSABLE_LOCAL_GGUF_TEST
          python - <<'PY'
          import json,os,pathlib
          report=json.loads((pathlib.Path(os.environ['RUNNER_TEMP'])/'plan02c-real-gguf.json').read_text())
          assert report['status']=='REAL_HASHED_GGUF_GENERATED_UNAPPROVED_SOURCE_CAMERA_ADVICE'
          assert report['provider_reported_completion_tokens']>0
          assert report['source_original_pcm_unchanged'] is True
          assert report['human_publication_approval'] is False
          assert report['native_renderer_worker_authorized'] is False
          print('PLAN02C_REAL_GGUF_SOURCE_CAMERA_ADVICE_VERIFIED_NO_APPROVAL')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: plan02c-genuine-hashed-gguf-source-camera-unapproved
          path: |
            ${{ runner.temp }}/plan02c-llama-source-head.txt
            ${{ runner.temp }}/plan02c-real-gguf.json
          if-no-files-found: warn
          retention-days: 14
