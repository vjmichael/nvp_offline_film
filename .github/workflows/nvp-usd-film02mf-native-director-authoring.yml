name: NVP USD-FILM-02M-F/G/H Grouped Native Director, Model and Original Shot Acceptance

# Run ONCE per completed 02M-F/G/H task group, never on small pushes.
on:
  # One consolidated F/G/H acceptance batch after the completed task group.
  # Restore manual-only after evaluating this one exact-head batch; do not
  # create continuous per-edit CI runs.
  push:
    branches: [nvp/usd-film02mf-grouped-model-world-staging-20261109]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nvp-film02m-fgh-grouped-${{ github.run_id }}
  cancel-in-progress: false

jobs:
  native-durable-original-film-source:
    name: Genuine FilmIndex/OpenUSD SQLite draft+undo+recovery + native OS-gated origin / ${{ matrix.os }} Py${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 105
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04,windows-2025]
        python: ["3.11","3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install real original OpenUSD and first-party runtime dependencies
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install -r requirements-foundation.txt
          python -m pip install --only-binary=:all: "usd-core==26.11" Pillow numpy
          python -m pip install httpx pytest
      - name: Compile actual installed NVP source proposal bridge and authenticated durable source
        shell: bash
        run: |
          set -euo pipefail
          python -m compileall -q backend/nvp_usd_film02m_f_authoring.py backend/nvp_usd_film02m_f_desktop_mixin.py backend/nvp_usd_film02m_g_model_world_candidate.py backend/nvp_usd_film02m_h_actor_camera_binding.py backend/nvp_wo5_desktop_bridge.py backend/nvp_wo6_desktop_bridge.py backend/nvp_usd_film01d_shot_working_set.py backend/nvp_usd_film01e_world_take.py backend/nvp_usd_film02m_e_district.py backend/nvp_usd_film02m_modular_buildings.py tests/test_nvp_usd_film02m_modular_buildings.py tests/test_nvp_usd_film01e_world_take.py
      - name: Real native OpenUSD original source proposal, independently reopened draft, undo/discard, OS-denied and approved publisher, crash proof and strict installed origin
        shell: bash
        run: |
          set -euo pipefail
          python -m pytest -q -s tests/test_nvp_usd_film02m_modular_buildings.py -k "test_02m_f or test_02m_g"
          python -m pytest -q -s tests/test_nvp_usd_film01e_world_take.py -k "test_02m_h"
          python -m pytest -q -s tests/test_nvp_usd_film02mg_model_world_candidate.py
      - name: Prevent accidentally publishing 02M source from HTTP or browser
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from backend.nvp_usd_film02m_f_authoring import FORMAT,PREVIEW_FORMAT
          from backend.nvp_wo5_desktop_bridge import TrustedDesktopWO5Bridge
          names=["film02mf_propose","film02mf_preview","film02mf_edit",
                 "film02mf_undo","film02mf_discard","film02mf_commit",
                 "film02mh_preview_shot","film02mh_commit_shot_binding",
                 "film02mh_reopen_shot_binding"]
          assert all(hasattr(TrustedDesktopWO5Bridge,x) for x in names)
          assert FORMAT.endswith("durable_director_proposal.v1")
          assert PREVIEW_FORMAT.endswith("original_source_lowfi_preview.v1")
          print("Original world + actor/camera native bridge methods exist; actual installed .exe and loaded GGUF still require separate acceptance.")
          PY

  native-ui-editor:
    name: Real installed-director React proposal preview/diff, undo/discard, explicit native approval; Vite production package
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install pinned project Vite/React/Three test dependencies
        working-directory: frontend
        run: npm install --no-audit --no-fund
      - name: Genuine DOM NVP trusted native source UI paths and denial
        working-directory: frontend
        run: npm run test:ui -- src/ModularWorldDirector.test.jsx src/DataFirstViewpointEditor.test.jsx
      - name: Production-compile installed director interface including native reusable world
        working-directory: frontend
        run: npm run build
      - name: Confirm 02M-F source controls in real production JS bundle
        shell: bash
        run: |
          set -euo pipefail
          grep -R -l "Build the world from data" frontend/dist/assets/*.js >/dev/null
          grep -R -l "OS director approval" frontend/dist/assets/*.js >/dev/null
          grep -R -l "Discard unapproved draft" frontend/dist/assets/*.js >/dev/null
          grep -R -l "original actor-and-camera shot" frontend/dist/assets/*.js >/dev/null

  real-Windows-desktop-bridge-surface:
    name: Real Windows Py3.11 exact-origin, original source grant and native authoring bridge with project-local persistence
    runs-on: windows-2025
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install original native Windows OpenUSD + Python frontend bridge tests
        shell: pwsh
        run: |
          python -m pip install -r requirements-foundation.txt
          python -m pip install --only-binary=:all: "usd-core==26.11" Pillow numpy
          python -m pip install httpx pytest
      - name: Actual Windows native origin-and-approval service on project test database
        shell: pwsh
        run: |
          python -m pytest -q -s tests/test_nvp_usd_film02m_modular_buildings.py -k "test_02m_f_installed_original_webview_no_http_os_denial_and_origin or test_02m_g"
          python -m pytest -q -s tests/test_nvp_usd_film01e_world_take.py -k "test_02m_h"
      - name: Disclose physical Windows installed-app acceptance gap
        shell: pwsh
        run: |
          Write-Output "Model/provider fixture, real USD scene, Windows native bridge contract: no real 7B+ GGUF or actual installed human WebView click is attested by this job. Run the separate manual NSIS installed-app acceptance."
