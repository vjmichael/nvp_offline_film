name: NVP WO6 Creator-AI Source and Retake Planner (NO FFMPEG)
on:
  push:
    branches: [nvp/wo6-ai-creator-guidance-20261107]
    paths:
      - backend/nvp_wo6_creator_plan.py
      - backend/nvp_wo6_feature_origins.py
      - backend/nvp_ai_read_host.py
      - tests/test_nvp_wo6_creator_plan.py
      - tests/test_nvp_wo6_feature_origins.py
      - .github/workflows/nvp-wo6-creator-ai.yml
  pull_request:
    paths:
      - backend/nvp_wo6_creator_plan.py
      - backend/nvp_wo6_feature_origins.py
      - backend/nvp_ai_read_host.py
      - tests/test_nvp_wo6_creator_plan.py
      - tests/test_nvp_wo6_feature_origins.py
      - .github/workflows/nvp-wo6-creator-ai.yml
  workflow_dispatch:
concurrency:
  group: nvp-wo6-creator-${{ github.event_name }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  native-source-retake-planner:
    name: Trusted host SHA-bound FilmIndex planner / ${{ matrix.os }} / Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025]
        python: ['3.11', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install existing test framework only
        run: python -m pip install "pytest>=8,<10"
      - name: Compile new and existing trusted read-only host
        run: python -m compileall -q backend/nvp_wo6_creator_plan.py backend/nvp_wo6_feature_origins.py backend/nvp_ai_read_host.py tests/test_nvp_wo6_creator_plan.py tests/test_nvp_wo6_feature_origins.py
      - name: Run WO6 original FilmIndex source-to-Take planning, negative and trusted-host tests
        run: python -m unittest discover -s tests -p test_nvp_wo6_creator_plan.py -v
      - name: Verify native source-DCP-to-Take resolver and per-turn FeatureJournal grant
        run: python -m unittest discover -s tests -p test_nvp_wo6_feature_origins.py -v
      - name: Preserve existing AI-01/02/03 read-only reference contracts
        run: python -m pytest -q tests/test_nvp_ai_read_host.py tests/test_nvp_ai_context.py tests/test_nvp_ai_refs.py
