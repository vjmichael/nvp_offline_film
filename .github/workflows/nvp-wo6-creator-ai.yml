      - tests/test_nvp_wo6_native_take_action.py
      - tests/test_nvp_wo6_native_shot_action.py
      - tests/test_nvp_wo6_recovery.py
      - tests/test_nvp_wo6_native_data_action.py
      - tests/test_nvp_wo6_kernel_attestation.py
      - tests/test_nvp_wo6_frozen_worker_dispatch.py
      - tests/test_nvp_wo6_installed_smoke.py
      - tests/test_nvp_wo6_desktop_bridge.py
      - docs/NVP_WO6_AI_FIRST_FILM_ASSISTANT.md
      - docs/NVP_DATA_ALL_TASK_LEDGER.md
      - .github/workflows/nvp-wo6-creator-ai.yml
  workflow_dispatch:
concurrency:
  group: nvp-wo6-creator-${{ github.event_name }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  native-source-retake-planner:
    name: Trusted host SHA-bound FilmIndex planner / ${{ matrix.os }} / Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025]
        python: ['3.11', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install actual native OpenUSD and existing test framework
        run: 'python -m pip install --only-binary=:all: "usd-core==26.11" "pytest>=8,<10"'
      - name: Install protected Windows native worker dependency
        if: runner.os == 'Windows'
        run: 'python -m pip install "pywin32>=310"'
      - name: Compile WO6-05/06 actions, contained workers, durable recovery and tests
        run: python -m compileall -q backend/nvp_wo6_native_take_action.py backend/nvp_wo6_native_shot_action.py backend/nvp_wo6_recovery.py tools/nvp_wo6_take_worker.py tools/nvp_wo6_shot_worker.py backend/nvp_wo6_native_data_action.py backend/nvp_wo6_worker_admission.py backend/nvp_wo6_kernel_attestation.py backend/nvp_worker_containment.py tools/nvp_desktop_alpha.py tools/nvp_wo6_installed_action_smoke.py tests/test_nvp_wo6_installed_smoke.py backend/nvp_wo6_desktop_bridge.py tests/test_nvp_wo6_desktop_bridge.py tools/nvp_wo6_data_worker.py tests/test_nvp_wo6_kernel_attestation.py tests/test_nvp_wo6_frozen_worker_dispatch.py tests/test_nvp_wo6_native_data_action.py tests/test_nvp_wo6_native_take_action.py tests/test_nvp_wo6_native_shot_action.py tests/test_nvp_wo6_recovery.py
      - name: Compile new and existing trusted read-only host
        run: python -m compileall -q backend/nvp_wo6_creator_plan.py backend/nvp_wo6_feature_origins.py backend/nvp_wo6_scene_context.py backend/nvp_wo6_impact_preview.py backend/nvp_wo6_tool_readiness.py backend/nvp_ai_read_host.py tests/test_nvp_wo6_creator_plan.py tests/test_nvp_wo6_feature_origins.py tests/test_nvp_wo6_scene_tool_context.py tests/test_nvp_wo6_impact_preview.py
      - name: Run WO6 original FilmIndex source-to-Take planning, negative and trusted-host tests
        run: python -m unittest discover -s tests -p test_nvp_wo6_creator_plan.py -v
      - name: Verify native source-DCP-to-Take resolver and per-turn FeatureJournal grant
        run: python -m unittest discover -s tests -p test_nvp_wo6_feature_origins.py -v
      - name: Verify real source-reopened OpenUSD actor/camera/light, original PCM and host native tool/license readiness
        run: python -m unittest discover -s tests -p test_nvp_wo6_scene_tool_context.py -v
      - name: Verify source and approved Production Bible impacts, director approval gates and resource estimates
        run: python -m unittest discover -s tests -p test_nvp_wo6_impact_preview.py -v
      - name: Verify actual creator-approved and OS-contained immutable OpenUSD Take worker
        run: python -m unittest discover -s tests -p test_nvp_wo6_native_take_action.py -v
      - name: Verify director-approved camera, blocking, and lighting OS-contained native OpenUSD operations
        run: python -m unittest discover -s tests -p test_nvp_wo6_native_shot_action.py -v
      - name: Verify durable cancellation, crash-after-commit, and independent native recovery receipts
        run: python -m unittest discover -s tests -p test_nvp_wo6_recovery.py -v
      - name: Verify contained creator/host-approved native color and exact Film Time shot sequence
        run: python -m unittest discover -s tests -p test_nvp_wo6_native_data_action.py -v
      - name: Verify actual Windows kernel Job Object lifecycle and hard-host-exit stopped attestation
        run: python -m unittest discover -s tests -p test_nvp_wo6_kernel_attestation.py -v
      - name: Verify private packaged worker dispatcher and immutable installed executable selection
        run: python -m unittest discover -s tests -p test_nvp_wo6_frozen_worker_dispatch.py -v
      - name: Run six actual OS-contained source-native writes, task status and immutable original-film proof
        run: python -m unittest discover -s tests -p test_nvp_wo6_installed_smoke.py -v
      - name: Verify actual director-native WebView2 bridge enforces separate OS creative and worker permissions
        run: python -m unittest discover -s tests -p test_nvp_wo6_desktop_bridge.py -v
      - name: Preserve existing AI-01/02/03 read-only reference contracts
        run: python -m pytest -q tests/test_nvp_ai_read_host.py tests/test_nvp_ai_context.py tests/test_nvp_ai_refs.py

  native-creator-desktop-react:
    name: Built native creator desktop UI and browser vs OS grant gates
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install exact NVP React test toolchain
        working-directory: frontend
        run: npm ci
      - name: Compile actual installed creator desktop React bundle
        working-directory: frontend
        run: npm run build
      - name: Verify director source-impact, two native OS approvals and task status UI
        working-directory: frontend
        run: npx vitest run src/WO6CreatorActionsPanel.test.jsx
