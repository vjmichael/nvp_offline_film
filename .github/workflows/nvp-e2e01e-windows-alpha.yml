name: NVP E2E-01E Installed Windows Desktop Alpha
# DATA-AV-01 stays independent. One verified P0-F-01 grouped Windows
# installed acceptance at b9738692 passed all scoped native, NSIS, WebView2,
# SQLite restart, and uninstall data-preservation gates.
# Manual only: never restore per-commit CI fanout.
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native-installer:
    runs-on: windows-2025
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify NVP packaging guard rejects fake Windows payloads
        shell: bash
        run: |
          set -euo pipefail
          python -m unittest discover -s tests -p test_nvp_e2e01e_package_guard.py -v
          python -m unittest discover -s tests -p test_nvp_p0f01_windows_process_gate.py -v
      - name: Build offline React application
        shell: pwsh
        run: |
          Push-Location frontend
          npm install --no-audit --no-fund
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm run test:ui -- src/ModularWorldDirector.test.jsx src/DataFirstViewpointEditor.test.jsx
          if ($LASTEXITCODE -ne 0) { throw 'Native director UI/actor camera world contracts failed' }
          npm run build
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Pop-Location
          if (-not (Test-Path frontend/dist/index.html)) { throw 'No bundled UI' }
          if (-not (Test-Path frontend/dist/assets -PathType Container)) { throw 'Missing offline assets' }
      - name: Install native desktop and packaging dependencies
        shell: pwsh
        run: |
          python -m pip install -r requirements-foundation.txt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          # SLATE-08B's bundled native scene readers must have real OpenUSD.
          python -m pip install --only-binary=:all: 'usd-core==26.11' Pillow numpy
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m pip install 'pyinstaller>=6.10,<7' 'pywebview>=5.3,<7' 'pywin32>=306' 'opentimelineio>=0.18.1,<0.19'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          choco install nsis -y --no-progress
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Grouped native 02M-F/G/H model draft recovery and real 01D/01E original film source acceptance
        shell: pwsh
        run: |
          python -m unittest discover -s tests -p test_nvp_p0f01_webview_api_facade.py -v
          if ($LASTEXITCODE -ne 0) { throw 'Native WebView2 API facade recursion and authority regression' }
          python -m compileall -q backend/nvp_usd_film02m_f_authoring.py backend/nvp_usd_film02m_f_desktop_mixin.py backend/nvp_usd_film02m_g_model_world_candidate.py backend/nvp_usd_film02m_h_actor_camera_binding.py
          if ($LASTEXITCODE -ne 0) { throw 'NVP original world model/shot integration did not compile' }
          python -m unittest discover -s tests -p test_nvp_usd_film02mg_model_world_candidate.py -v
          if ($LASTEXITCODE -ne 0) { throw 'Model JSON provenance acceptance failed' }
          python -m unittest discover -s tests -p test_nvp_usd_film02m_modular_buildings.py -k test_02m_g -v
          if ($LASTEXITCODE -ne 0) { throw 'Native model-to-draft recovery failed' }
          python -m unittest discover -s tests -p test_nvp_usd_film01e_world_take.py -k test_02m_h -v
          if ($LASTEXITCODE -ne 0) { throw 'Actual OpenUSD district+01D+01E shot binding failed' }
      - name: Confirm installed bundle collects original film world modules
        shell: pwsh
        run: |
          python -c "import backend.nvp_usd_film02m_g_model_world_candidate, backend.nvp_usd_film02m_h_actor_camera_binding; print('Group F/G/H import verified; no installed UI acceptance inferred')"
          if ($LASTEXITCODE -ne 0) { throw 'Original world model/shot module import failed' }
      - name: Compile actual desktop entry and build one-directory native EXE
        shell: pwsh
        run: |
          python -m compileall -q tools/nvp_desktop_alpha.py
          python -m PyInstaller --noconfirm --clean --onedir --windowed --name NVP --paths . --add-data 'frontend/dist;frontend/dist' --collect-all webview --collect-all pxr --collect-submodules backend tools/nvp_desktop_alpha.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if (-not (Test-Path dist/NVP/NVP.exe)) { throw 'Missing NVP executable' }
          # Real bundle import collection; the underlying physical app/user
          # still needs an independent OS-origin approval click test.
          python tools/nvp_e2e01e_validate_installer_payload.py --bundle dist/NVP --report "$env:RUNNER_TEMP/nvp-alpha-bundle-audit.json"
          if ($LASTEXITCODE -ne 0) { throw 'NSIS payload failed architecture and bundled-UI audit' }
          & 'dist/NVP/NVP.exe' --smoke
          if ($LASTEXITCODE -ne 0) { throw 'Uninstalled native alpha smoke failed' }
      - name: Create NSIS single-click installer
        shell: pwsh
        run: |
          # Chocolatey NSIS installs makensis.exe under Program Files (x86),
          # not Program Files or necessarily on PATH. Discover a real file
          # from approved local install roots; never download a compiler.
          $nsisCandidates = @(
            "${env:ProgramFiles(x86)}\NSIS\makensis.exe"
            "$env:ProgramFiles\NSIS\makensis.exe"
          )
          $nsis = $nsisCandidates | Where-Object { Test-Path -LiteralPath $_ -PathType Leaf } | Select-Object -First 1
          if (-not $nsis) { throw 'NSIS compiler missing from verified Chocolatey install roots' }
          Write-Output "Using installed NSIS compiler: $nsis"
          & $nsis '/V3' 'packaging/nvp-alpha.nsi'
          if ($LASTEXITCODE -ne 0) { throw 'NSIS failed' }
          if (-not (Test-Path 'dist/NVP-Alpha-Setup.exe')) { throw 'Missing NSIS installer' }
          $manifest=[ordered]@{
            format='nvp.p0f01.installed_windows_group_source_identity.v1'
            source_commit=$env:GITHUB_SHA
            installer_sha256=(Get-FileHash 'dist/NVP-Alpha-Setup.exe' -Algorithm SHA256).Hash.ToLowerInvariant()
            bundled_exe_sha256=(Get-FileHash 'dist/NVP/NVP.exe' -Algorithm SHA256).Hash.ToLowerInvariant()
            human_os_dialog_approval_attested=$false
            loaded_model_completion_attested=$false
            '720_frame_pcm_movie_attested'=$false
          }
          $manifest | ConvertTo-Json -Depth 3 | Set-Content -LiteralPath (Join-Path $env:RUNNER_TEMP 'nvp-alpha-group-manifest.json') -Encoding UTF8
      - name: Silent install and execute installed native alpha
        shell: pwsh
        run: |
          $setup=(Resolve-Path 'dist/NVP-Alpha-Setup.exe').Path
          python tools/nvp_p0f01_windows_process_gate.py --stage nsis-install --timeout-seconds 300 --stage-log "$env:RUNNER_TEMP/nvp-alpha-process-stages.jsonl" -- $setup /S
          if ($LASTEXITCODE -ne 0) { throw 'Bounded NSIS silent install failed; inspect process stages artifact' }
          $installed=Join-Path $env:LOCALAPPDATA 'Programs/NVP/NVP.exe'
          if (-not (Test-Path $installed)) { throw 'Installed NVP.exe missing' }
          $builtHash=(Get-FileHash 'dist/NVP/NVP.exe' -Algorithm SHA256).Hash
          $installedHash=(Get-FileHash -LiteralPath $installed -Algorithm SHA256).Hash
          if ($installedHash -ne $builtHash) { throw 'Installed NVP.exe does not match verified build payload' }
          $env:NVP_HOME=Join-Path $env:RUNNER_TEMP 'nvp-original-installed-projects'
          # One consolidated F/G/H group: real installed EXE creates native
          # approved building assets + UNAPPROVED draft in SQLite and a
          # second installed process independently reopens exact USD SHA.
          $env:NVP_FILM02M_GROUP_ACCEPTANCE='1'
          $env:NVP_NATIVE_SMOKE_DIAGNOSTICS=Join-Path $env:RUNNER_TEMP 'nvp-alpha-installed-create.log'
          python tools/nvp_p0f01_windows_process_gate.py --stage installed-create --timeout-seconds 240 --stage-log "$env:RUNNER_TEMP/nvp-alpha-process-stages.jsonl" --diagnostics "$env:NVP_NATIVE_SMOKE_DIAGNOSTICS" -- $installed --smoke-create
          if ($LASTEXITCODE -ne 0) { throw 'Installed first launch failed or timed out; inspect process stages and native diagnostics' }
          if (-not (Test-Path $env:NVP_NATIVE_SMOKE_DIAGNOSTICS) -or
              -not (Select-String -LiteralPath $env:NVP_NATIVE_SMOKE_DIAGNOSTICS -Pattern 'NVP_SMOKE_PYTHON_EXIT=0' -Quiet)) {
            throw 'Installed first-process native Python completion receipt missing'
          }
          $env:NVP_NATIVE_SMOKE_DIAGNOSTICS=Join-Path $env:RUNNER_TEMP 'nvp-alpha-installed-reopen.log'
          python tools/nvp_p0f01_windows_process_gate.py --stage installed-reopen --timeout-seconds 240 --stage-log "$env:RUNNER_TEMP/nvp-alpha-process-stages.jsonl" --diagnostics "$env:NVP_NATIVE_SMOKE_DIAGNOSTICS" -- $installed --smoke-reopen
          if ($LASTEXITCODE -ne 0) { throw 'Second fresh installed app launch failed/timed out; inspect process stages and native log' }
          if (-not (Test-Path $env:NVP_NATIVE_SMOKE_DIAGNOSTICS) -or
              -not (Select-String -LiteralPath $env:NVP_NATIVE_SMOKE_DIAGNOSTICS -Pattern 'NVP_SMOKE_PYTHON_EXIT=0' -Quiet)) {
            throw 'Installed second-process original USD reopening receipt missing'
          }
          if (-not (Test-Path (Join-Path $env:NVP_HOME 'nvp_studio.sqlite3'))) {
            throw 'No persistent original film project database'
          }
      - name: Require actual visible Windows WebView2 desktop page load
        shell: pwsh
        run: |
          $installed=Join-Path $env:LOCALAPPDATA 'Programs/NVP/NVP.exe'
          # The real installed WebView2 window navigates React section 22/23
          # and invokes actual native catalog/propose/edit/undo/discard IPC.
          $env:NVP_FILM02M_GROUP_ACCEPTANCE='1'
          $env:NVP_NATIVE_SMOKE_DIAGNOSTICS=Join-Path $env:RUNNER_TEMP 'nvp-alpha-installed-webview2.log'
          python tools/nvp_p0f01_windows_process_gate.py --stage installed-webview2 --timeout-seconds 300 --stage-log "$env:RUNNER_TEMP/nvp-alpha-process-stages.jsonl" --diagnostics "$env:NVP_NATIVE_SMOKE_DIAGNOSTICS" -- $installed --smoke-window
          if ($LASTEXITCODE -ne 0) {
            throw 'Installed WebView2 process failed/timed out; inspect process stages and native window trace'
          }
          $trace=$env:NVP_NATIVE_SMOKE_DIAGNOSTICS
          if (-not (Test-Path $trace)) { throw 'No installed native WebView2 diagnostics' }
          foreach ($required in @('film02m_installed_native_editor_draft_recovery_passed',
                                   'source_webview_full_acceptance_finished',
                                   'NVP_SMOKE_PYTHON_EXIT=0')) {
            if (-not (Select-String -LiteralPath $trace -Pattern $required -SimpleMatch -Quiet)) {
              throw "Installed native WebView2/source contract stage missing: $required"
            }
          }
          Write-Output 'Verified actual installed WebView2 source-only IPC and durable draft/undo/discard; no human approval inferred.'
      - name: Uninstall without deleting creator project data
        shell: pwsh
        run: |
          $uninstaller=Join-Path $env:LOCALAPPDATA 'Programs/NVP/Uninstall NVP.exe'
          if (-not (Test-Path $uninstaller)) { throw 'Uninstaller missing' }
          # GitHub Actions runs every step in a fresh PowerShell process.
          # Recover the SAME runner-temp project path used by create/reopen,
          # rather than assuming a step-local NVP_HOME environment survives.
          $owned=Join-Path $env:RUNNER_TEMP 'nvp-original-installed-projects'
          $env:NVP_HOME=$owned
          $projectDb=Join-Path $owned 'nvp_studio.sqlite3'
          if (-not (Test-Path -LiteralPath $projectDb -PathType Leaf)) {
            throw 'Missing creator SQLite film database before uninstall'
          }
          $beforeHash=(Get-FileHash -LiteralPath $projectDb -Algorithm SHA256).Hash
          python tools/nvp_p0f01_windows_process_gate.py --stage nsis-uninstall --timeout-seconds 240 --stage-log "$env:RUNNER_TEMP/nvp-alpha-process-stages.jsonl" -- $uninstaller /S
          if ($LASTEXITCODE -ne 0) { throw 'Uninstall failed/timed out; inspect process stages' }
          Start-Sleep -Seconds 2
          if (-not (Test-Path -LiteralPath $projectDb -PathType Leaf)) { throw 'Uninstall deleted saved film' }
          $afterHash=(Get-FileHash -LiteralPath $projectDb -Algorithm SHA256).Hash
          if ($afterHash -ne $beforeHash) { throw 'Uninstall modified saved creator SQLite project' }
          if (Test-Path (Join-Path $env:LOCALAPPDATA 'Programs/NVP/NVP.exe')) { throw 'Uninstall left executable' }
          Write-Output "P0F01_NSIS_UNINSTALL_REMOVED_APP_PRESERVED_CREATOR_SQLITE=PASS"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nvp-alpha-windows-source-identity-and-installed-recovery
          path: |
            ${{ runner.temp }}/nvp-alpha-process-stages.jsonl
            ${{ runner.temp }}/nvp-alpha-group-manifest.json
            ${{ runner.temp }}/nvp-alpha-installed-create.log
            ${{ runner.temp }}/nvp-alpha-installed-reopen.log
            ${{ runner.temp }}/nvp-alpha-installed-webview2.log
          if-no-files-found: warn
          retention-days: 7
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nvp-alpha-windows-bundle-audit
          path: ${{ runner.temp }}/nvp-alpha-bundle-audit.json
          if-no-files-found: warn
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nvp-alpha-windows-nsis-candidate
          path: dist/NVP-Alpha-Setup.exe
          if-no-files-found: warn
          retention-days: 7
