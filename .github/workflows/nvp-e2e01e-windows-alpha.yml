name: NVP E2E-01E Installed Windows Desktop Alpha
on:
  pull_request:
    paths:
      - 'tools/nvp_desktop_alpha.py'
      - 'packaging/nvp-alpha.nsi'
      - 'tools/nvp_e2e01e_validate_installer_payload.py'
      - 'tests/test_nvp_e2e01e_package_guard.py'
      - 'packaging/build-nvp-nsis.sh'
      - '.github/workflows/nvp-e2e01e-windows-alpha.yml'
      - 'frontend/**'
      - 'backend/nvp_api.py'
      - 'backend/nvp_studio.py'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native-installer:
    runs-on: windows-2025
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify NVP packaging guard rejects fake Windows payloads
        shell: bash
        run: |
          set -euo pipefail
          python -m unittest discover -s tests -p test_nvp_e2e01e_package_guard.py -v
      - name: Build offline React application
        shell: pwsh
        run: |
          Push-Location frontend
          npm install --no-audit --no-fund
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm run build
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Pop-Location
          if (-not (Test-Path frontend/dist/index.html)) { throw 'No bundled UI' }
          if (-not (Test-Path frontend/dist/assets -PathType Container)) { throw 'Missing offline assets' }
      - name: Install native desktop and packaging dependencies
        shell: pwsh
        run: |
          python -m pip install -r requirements-foundation.txt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m pip install 'pyinstaller>=6.10,<7' 'pywebview>=5.3,<7' 'pywin32>=306' 'opentimelineio>=0.18.1,<0.19'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          choco install nsis -y --no-progress
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          choco install ffmpeg -y --no-progress
          if ($LASTEXITCODE -ne 0) { throw 'Could not provision real native video tools' }
          $source=Join-Path $env:ChocolateyInstall 'lib/ffmpeg/tools'
          $ffmpeg=Get-ChildItem $source -Filter ffmpeg.exe -File -Recurse |
            Where-Object { $_.Length -gt 1000000 } | Select-Object -First 1
          if (-not $ffmpeg) { throw 'No real full FFmpeg binary (Chocolatey shims are forbidden)' }
          $ffprobe=Join-Path $ffmpeg.Directory.FullName 'ffprobe.exe'
          if (-not (Test-Path $ffprobe)) { throw 'FFprobe missing beside FFmpeg' }
          $env:NVP_FFMPEG=$ffmpeg.FullName
          $env:NVP_FFPROBE=$ffprobe
          Add-Content -LiteralPath $env:GITHUB_ENV -Value "NVP_FFMPEG=$($ffmpeg.FullName)"
          Add-Content -LiteralPath $env:GITHUB_ENV -Value "NVP_FFPROBE=$ffprobe"
          & $ffmpeg.FullName -version
          if ($LASTEXITCODE -ne 0) { throw 'FFmpeg binary cannot execute' }
          & $ffprobe -version
          if ($LASTEXITCODE -ne 0) { throw 'FFprobe binary cannot execute' }
      - name: Compile actual desktop entry and build one-directory native EXE
        shell: pwsh
        run: |
          python -m compileall -q tools/nvp_desktop_alpha.py
          python -m PyInstaller --noconfirm --clean --onedir --windowed --name NVP --paths . --add-data 'frontend/dist;frontend/dist' --add-data 'tools/nvp_source_window_worker.py;tools' --add-data 'tools/nvp_av_proxy_worker.py;tools' --add-binary "$env:NVP_FFMPEG;ffmpeg" --add-binary "$env:NVP_FFPROBE;ffmpeg" --collect-all webview --collect-submodules backend tools/nvp_desktop_alpha.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if (-not (Test-Path dist/NVP/NVP.exe)) { throw 'Missing NVP executable' }
          python tools/nvp_e2e01e_validate_installer_payload.py --bundle dist/NVP --report "$env:RUNNER_TEMP/nvp-alpha-bundle-audit.json"
          if ($LASTEXITCODE -ne 0) { throw 'NSIS payload failed architecture and bundled-UI audit' }
          & 'dist/NVP/NVP.exe' --smoke
          if ($LASTEXITCODE -ne 0) { throw 'Uninstalled native alpha smoke failed' }
      - name: Pin signed official Microsoft WebView2 Evergreen prerequisite for the single installer
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          New-Item -ItemType Directory -Force -Path 'build' | Out-Null
          $setup=Join-Path (Resolve-Path 'build').Path 'MicrosoftEdgeWebview2Setup.exe'
          Invoke-WebRequest -Uri 'https://go.microsoft.com/fwlink/p/?LinkId=2124703' -OutFile $setup -MaximumRedirection 5
          if ((Get-Item -LiteralPath $setup).Length -lt 100000) {
            throw 'Official WebView2 bootstrapper is missing or truncated'
          }
          $signature=Get-AuthenticodeSignature -LiteralPath $setup
          if ($signature.Status -ne 'Valid' -or
              $signature.SignerCertificate.Subject -notmatch 'Microsoft Corporation') {
            throw 'WebView2 bootstrapper is not Microsoft Authenticode signed'
          }
          $digest=(Get-FileHash -LiteralPath $setup -Algorithm SHA256).Hash
          Write-Host "Verified official Microsoft WebView2 bootstrapper SHA256: $digest"
      - name: Create NSIS single-click installer
        shell: pwsh
        run: |
          $nsis = Join-Path $env:ProgramFiles 'NSIS/makensis.exe'
          if (-not (Test-Path $nsis)) {
            $nsis = (Get-Command makensis -ErrorAction Stop).Source
          }
          & $nsis '/V3' 'packaging/nvp-alpha.nsi'
          if ($LASTEXITCODE -ne 0) { throw 'NSIS failed' }
          if (-not (Test-Path 'dist/NVP-Alpha-Setup.exe')) { throw 'Missing NSIS installer' }
      - name: Silent install and execute installed native alpha
        shell: pwsh
        run: |
          $setup=(Resolve-Path 'dist/NVP-Alpha-Setup.exe').Path
          $process=Start-Process -FilePath $setup -ArgumentList '/S' -PassThru -Wait
          if ($process.ExitCode -ne 0) { throw 'NSIS silent install failed' }
          $installed=Join-Path $env:LOCALAPPDATA 'Programs/NVP/NVP.exe'
          if (-not (Test-Path $installed)) { throw 'Installed NVP.exe missing' }
          $builtHash=(Get-FileHash 'dist/NVP/NVP.exe' -Algorithm SHA256).Hash
          $installedHash=(Get-FileHash -LiteralPath $installed -Algorithm SHA256).Hash
          if ($installedHash -ne $builtHash) { throw 'Installed NVP.exe does not match verified build payload' }
          $env:NVP_HOME=Join-Path $env:RUNNER_TEMP 'nvp-original-installed-projects'
          $first=Start-Process -FilePath $installed -ArgumentList '--smoke-create' -PassThru -Wait
          if ($first.ExitCode -ne 0) { throw 'Installed first launch/project creation failed' }
          $second=Start-Process -FilePath $installed -ArgumentList '--smoke-reopen' -PassThru -Wait
          if ($second.ExitCode -ne 0) { throw 'Second fresh native app launch lost SQLite film project' }
          if (-not (Test-Path (Join-Path $env:NVP_HOME 'nvp_studio.sqlite3'))) {
            throw 'No persistent original film project database'
          }
          # The installed GUI executable, not an external Python command,
          # must import an actual VFR original and launch its own contained
          # SHA-pinned child to decode and independently verify a review PNG.
          $native=Start-Process -FilePath $installed -ArgumentList '--smoke-source' -PassThru -Wait
          if ($native.ExitCode -ne 0) {
            throw 'Installed FFmpeg/FFprobe original import + frozen source worker failed'
          }
          $internal=Join-Path (Split-Path $installed) '_internal/ffmpeg'
          foreach ($tool in @('ffmpeg.exe','ffprobe.exe')) {
            $built=(Get-FileHash -Algorithm SHA256 (Join-Path 'dist/NVP/_internal/ffmpeg' $tool)).Hash
            $final=(Get-FileHash -Algorithm SHA256 (Join-Path $internal $tool)).Hash
            if ($built -ne $final) { throw "Installed native video executable changed: $tool" }
          }
      - name: Require actual visible Windows WebView2 desktop page load
        shell: pwsh
        run: |
          $installed=Join-Path $env:LOCALAPPDATA 'Programs/NVP/NVP.exe'
          $window=Start-Process -FilePath $installed -ArgumentList '--smoke-window' -PassThru -Wait
          if ($window.ExitCode -ne 0) {
            throw 'Real desktop WebView2 window did not load; headless smoke alone cannot accept NVP alpha'
          }
      - name: Uninstall without deleting creator project data
        shell: pwsh
        run: |
          $uninstaller=Join-Path $env:LOCALAPPDATA 'Programs/NVP/Uninstall NVP.exe'
          if (-not (Test-Path $uninstaller)) { throw 'Uninstaller missing' }
          $owned=$env:NVP_HOME
          if (-not (Test-Path (Join-Path $owned 'nvp_studio.sqlite3'))) {
            throw 'Missing creator SQLite film database before uninstall'
          }
          $result=Start-Process -FilePath $uninstaller -ArgumentList '/S' -PassThru -Wait
          if ($result.ExitCode -ne 0) { throw 'Uninstall failed' }
          Start-Sleep -Seconds 2
          if (-not (Test-Path (Join-Path $owned 'nvp_studio.sqlite3'))) { throw 'Uninstall deleted saved film' }
          if (Test-Path (Join-Path $env:LOCALAPPDATA 'Programs/NVP/NVP.exe')) { throw 'Uninstall left executable' }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nvp-alpha-windows-bundle-audit
          path: ${{ runner.temp }}/nvp-alpha-bundle-audit.json
          if-no-files-found: warn
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nvp-alpha-windows-nsis-candidate
          path: dist/NVP-Alpha-Setup.exe
          if-no-files-found: warn
          retention-days: 7
