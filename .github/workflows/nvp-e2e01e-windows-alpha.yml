name: NVP E2E-01E Installed Windows Desktop Alpha
# DATA-AV-01 migration: legacy imported-video/benchmark workflow is
# manual-only; it must not gate or relaunch native Digital Take A/V.
on:
  push:
    branches:
      - nvp/int02-w1g-native-film-package-20261112
      - nvp/w1g-p1a-sec06-integrated-20261112
  workflow_dispatch:
# Preserve only the latest candidate acceptance run per branch/workflow.
# Superseded source heads must not monopolize finite native runners.
concurrency:
  group: nvp-w1g-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
jobs:
  native-installer:
    runs-on: windows-2025
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify NVP packaging guard rejects fake Windows payloads
        shell: bash
        run: |
          set -euo pipefail
          python -m unittest discover -s tests -p test_nvp_e2e01e_package_guard.py -v
      - name: Build offline React application
        shell: pwsh
        run: |
          Push-Location frontend
          npm install --no-audit --no-fund
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm run build
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Pop-Location
          if (-not (Test-Path frontend/dist/index.html)) { throw 'No bundled UI' }
          if (-not (Test-Path frontend/dist/assets -PathType Container)) { throw 'Missing offline assets' }
      - name: Install native desktop and packaging dependencies
        shell: pwsh
        run: |
          python -m pip install -r requirements-foundation.txt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          # SLATE-08B's bundled native scene readers must have real OpenUSD.
          python -m pip install --only-binary=:all: -r requirements-w1g-release-review.txt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m pip install --only-binary=:all: 'usd-core==26.11'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m pip install 'pyinstaller>=6.10,<7' 'pywebview>=5.3,<7' 'pywin32>=306' 'opentimelineio>=0.18.1,<0.19'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          choco install nsis -y --no-progress
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Test INT-02C and W1-G source refusal/recovery contracts
        shell: pwsh
        run: |
          python -m unittest discover -s tests -p test_nvp_int02_edited_film.py -v
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m unittest discover -s tests -p test_nvp_webview_ipc_surface.py -v
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m unittest discover -s tests -p test_nvp_w1f_reel_audit.py -v
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m unittest discover -s tests -p test_nvp_w1g_supply_candidate.py -v
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m unittest discover -s tests -p test_nvp_w1g_owned_subprocess.py -v
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m unittest discover -s tests -p test_nvp_w1g_launch_surface_audit.py -v
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m unittest discover -s tests -p test_nvp_w1g_legacy_blender_launch.py -v
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m unittest discover -s tests -p test_nvp_filming_windows_release.py -v
          python -m unittest discover -s tests -p test_nvp_p1a_original_capture_worker_bridge.py -v
          python -m unittest discover -s tests -p test_nvp_plan02b_native_capture.py -v
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m unittest discover -s tests -p test_nvp_w1g_release_gate.py -v
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m unittest discover -s tests -p test_nvp_w1g_release_build_marker.py -v
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m unittest discover -s tests -p test_nvp_w1g_production_authority.py -v
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m unittest discover -s tests -p test_nvp_w1g_encrypted_review.py -v
          python -m unittest discover -s tests -p test_nvp_w1g_signed_wheelhouse.py -v
          python -m unittest discover -s tests -p test_nvp_w1g_reconcile_compiled_release.py -v
          python -m unittest discover -s tests -p test_nvp_w1g_physical_efs_review.py -v
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m unittest discover -s tests -p test_nvp_w1g_supply_chain_hardening.py -v
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m unittest discover -s tests -p test_nvp_w1g_protected_upgrade.py -v
          python -m unittest discover -s tests -p test_nvp_w1g_first_party_result_verifier.py -v
          python -m unittest discover -s tests -p test_nvp_w1g_native_link_audit.py -v
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Compile actual desktop entry and build one-directory native EXE
        shell: pwsh
        run: |
          python -m compileall -q tools/nvp_desktop_alpha.py
          python -m PyInstaller --noconfirm --clean --onedir --windowed --name NVP --paths . --add-data 'frontend/dist;frontend/dist' --collect-all webview --collect-all pxr --collect-all cryptography --collect-all miniaudio --collect-all sounddevice --collect-all _sounddevice_data --hidden-import tools.nvp_native_device_producer_worker --hidden-import tools.nvp_p1b_physical_device_acceptance --hidden-import tools.nvp_w1g_reviewed_release --collect-submodules backend --add-data 'tools/nvp_int02_cycles_frame_worker.py;tools' tools/nvp_desktop_alpha.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if (-not (Test-Path dist/NVP/NVP.exe)) { throw 'Missing NVP executable' }
          python -m tools.nvp_w1g_release_build_marker --bundle dist/NVP
          if ($LASTEXITCODE -ne 0) { throw 'First-party launch-fence source marker missing from native Windows bundle' }
          python tools/nvp_e2e01e_validate_installer_payload.py --bundle dist/NVP --report "$env:RUNNER_TEMP/nvp-alpha-bundle-audit.json"
          python tools/nvp_w1g_native_package.py build --bundle dist/NVP --output "$env:RUNNER_TEMP/nvp-w1g-native-build.json"
          if ($LASTEXITCODE -ne 0) { throw 'NSIS payload failed architecture and bundled-UI audit' }
          & 'dist/NVP/NVP.exe' --smoke
          if ($LASTEXITCODE -ne 0) { throw 'Uninstalled native alpha smoke failed' }
          & 'dist/NVP/NVP.exe' --smoke-producer-bundle
          if ($LASTEXITCODE -ne 0) { throw 'Frozen internal device producer/PortAudio unavailable' }
      - name: Require genuine packaged Ed25519 signed-review admission and tamper refusal
        shell: pwsh
        run: |
          $env:NVP_SMOKE_DIAGNOSTIC_PATH=Join-Path $env:RUNNER_TEMP 'nvp-w1g-review-verifier-packaged.txt'
          $exe=(Resolve-Path 'dist/NVP/NVP.exe').Path
          $review=Start-Process -FilePath $exe -ArgumentList '--smoke-release-review' -PassThru
          if (-not $review.WaitForExit(120000)) { $review.Kill(); throw 'Packaged Ed25519 verifier stalled' }
          if ($review.ExitCode -ne 0) {
            if (Test-Path $env:NVP_SMOKE_DIAGNOSTIC_PATH) { Get-Content $env:NVP_SMOKE_DIAGNOSTIC_PATH | Select-Object -Last 45 }
            throw 'Packaged Ed25519 verifier did not prove signature/tamper refusal'
          }
          $receipts=Get-Content $env:NVP_SMOKE_DIAGNOSTIC_PATH -Raw
          if ($receipts -notmatch 'review_verifier_signed_full_inventory' -or $receipts -notmatch 'review_verifier_tampered_binary_refused') {
            throw 'Packaged verified reviewer signature and changed-file rejection absent'
          }
      - name: Create NSIS single-click installer
        shell: pwsh
        run: |
          $nsis = Join-Path ${env:ProgramFiles(x86)} 'NSIS/makensis.exe'
          if (-not (Test-Path $nsis)) { $nsis = Join-Path $env:ProgramFiles 'NSIS/makensis.exe' }
          if (-not (Test-Path $nsis)) { $nsis = (Get-Command makensis -ErrorAction Stop).Source }
          & $nsis '/V3' 'packaging/nvp-alpha.nsi'
          if ($LASTEXITCODE -ne 0) { throw 'NSIS failed' }
          if (-not (Test-Path 'dist/NVP-Alpha-Setup.exe')) { throw 'Missing NSIS installer' }
      - name: Silent install and execute installed native alpha
        shell: pwsh
        run: |
          $setup=(Resolve-Path 'dist/NVP-Alpha-Setup.exe').Path
          $process=Start-Process -FilePath $setup -ArgumentList '/S' -PassThru
          if (-not $process.WaitForExit(240000)) {
            Write-Host "NSIS silent first-install timed out; installed: $(Test-Path (Join-Path $env:LOCALAPPDATA 'Programs/NVP'))"
            Write-Host "NSIS candidate stage: $(Test-Path (Join-Path $env:LOCALAPPDATA 'Programs/NVP.pending'))"
            $process.Kill()
            throw 'Native Windows NSIS installer timed out; no acceptance'
          }
          if ($process.ExitCode -ne 0) {
            $installedRoot=Join-Path $env:LOCALAPPDATA 'Programs/NVP'
            $pendingRoot=Join-Path $env:LOCALAPPDATA 'Programs/NVP.pending'
            Write-Host "NSIS first-install exit=$($process.ExitCode)"
            Write-Host "Installed tree exists: $(Test-Path $installedRoot)"
            Write-Host "Pending tree exists: $(Test-Path $pendingRoot)"
            Write-Host "Installed executable exists: $(Test-Path (Join-Path $installedRoot 'NVP.exe'))"
            Write-Host "Pending executable exists: $(Test-Path (Join-Path $pendingRoot 'NVP.exe'))"
            throw 'NSIS silent install failed; original directories preserved for diagnostic evidence'
          }
          $installed=Join-Path $env:LOCALAPPDATA 'Programs/NVP/NVP.exe'
          if (-not (Test-Path $installed)) { throw 'Installed NVP.exe missing' }
          $builtHash=(Get-FileHash 'dist/NVP/NVP.exe' -Algorithm SHA256).Hash
          $installedHash=(Get-FileHash -LiteralPath $installed -Algorithm SHA256).Hash
          if ($installedHash -ne $builtHash) { throw 'Installed NVP.exe does not match verified build payload' }
          python tools/nvp_w1g_native_package.py verify-install --installed (Join-Path $env:LOCALAPPDATA 'Programs/NVP') --receipt "$env:RUNNER_TEMP/nvp-w1g-native-build.json" --output "$env:RUNNER_TEMP/nvp-w1g-installed.json"
          if ($LASTEXITCODE -ne 0) { throw 'Installed native worker and runtime byte audit failed' }
          $env:NVP_HOME=Join-Path $env:RUNNER_TEMP 'nvp-original-installed-projects'
          "NVP_HOME=$env:NVP_HOME" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          $env:NVP_SMOKE_DIAGNOSTIC_PATH=Join-Path $env:RUNNER_TEMP 'nvp-w1g-first-smoke-diagnostic.txt'
          Write-Host "First installed native smoke starting at $(Get-Date -Format o)"
          $first=Start-Process -FilePath $installed -ArgumentList '--smoke-create' -PassThru
          if (-not $first.WaitForExit(180000)) {
            $first.Kill()
            throw 'Installed native NVP.exe --smoke-create timed out'
          }
          Write-Host "First installed native smoke exit code: $($first.ExitCode)"
          if ($first.ExitCode -ne 0) { throw 'Installed first launch/project creation failed' }
          $env:NVP_SMOKE_DIAGNOSTIC_PATH=Join-Path $env:RUNNER_TEMP 'nvp-w1g-reopen-smoke-diagnostic.txt'
          Write-Host "Second installed native smoke starting at $(Get-Date -Format o)"
          $second=Start-Process -FilePath $installed -ArgumentList '--smoke-reopen' -PassThru
          if (-not $second.WaitForExit(180000)) {
            $second.Kill()
            throw 'Installed native NVP.exe --smoke-reopen timed out'
          }
          Write-Host "Second installed native smoke exit code: $($second.ExitCode)"
          if ($second.ExitCode -ne 0) { throw 'Second fresh native app launch lost SQLite film project' }
          if (-not (Test-Path (Join-Path $env:NVP_HOME 'nvp_studio.sqlite3'))) {
            throw 'No persistent original film project database'
          }
      - name: Real Windows NSIS upgrade staging and filesystem activation/rollback matrix
        shell: pwsh
        run: |
          $nsis=Join-Path ${env:ProgramFiles(x86)} 'NSIS/makensis.exe'
          if (-not (Test-Path $nsis)) { $nsis=Join-Path $env:ProgramFiles 'NSIS/makensis.exe' }
          if (-not (Test-Path $nsis)) { $nsis=(Get-Command makensis -ErrorAction Stop).Source }
          & $nsis '/DAPP_VERSION=0.1.1' '/V3' 'packaging/nvp-alpha.nsi'
          if ($LASTEXITCODE -ne 0) { throw 'Real Windows NSIS candidate build failed' }
          $setup=(Resolve-Path 'dist/NVP-Alpha-Setup.exe').Path
          $active=Join-Path $env:LOCALAPPDATA 'Programs/NVP/NVP.exe'
          $oldHash=(Get-FileHash -LiteralPath $active -Algorithm SHA256).Hash
          $stageProcess=Start-Process -FilePath $setup -ArgumentList '/S' -PassThru
          if (-not $stageProcess.WaitForExit(240000)) {
            $stageProcess.Kill()
            throw 'Native Windows NSIS upgrade staging timed out; no activation performed'
          }
          # Abort is expected after safe stage-only candidate creation.
          $pending=Join-Path $env:LOCALAPPDATA 'Programs/NVP.pending'
          if (-not (Test-Path (Join-Path $pending 'NVP.exe'))) { throw 'NSIS did not stage real candidate' }
          $newHash=(Get-FileHash -LiteralPath $active -Algorithm SHA256).Hash
          if ($newHash -ne $oldHash) { throw 'NSIS staging unexpectedly replaced the active executable' }
          $version=(Get-Content -LiteralPath (Join-Path $pending 'nvp-alpha-version.txt') -Raw)
          if ($version -ne '0.1.1') { throw 'NSIS staged candidate version missing/wrong' }
          python tools/nvp_w1g_native_package.py verify-install --installed "$pending" --receipt "$env:RUNNER_TEMP/nvp-w1g-native-build.json" --output "$env:RUNNER_TEMP/nvp-w1g-staged.json"
          if ($LASTEXITCODE -ne 0) { throw 'Staged Windows NSIS payload does not match reviewed native build' }
          python -m tools.nvp_w1g_windows_nsis_transaction_matrix --programs (Join-Path $env:LOCALAPPDATA 'Programs') --projects "$env:NVP_HOME" --build-receipt "$env:RUNNER_TEMP/nvp-w1g-native-build.json" --journal (Join-Path $env:RUNNER_TEMP 'nvp-w1g-nsis-transaction') --output "$env:RUNNER_TEMP/nvp-w1g-windows-nsis-matrix.json"
          if ($LASTEXITCODE -ne 0) { throw 'Windows native NSIS staged upgrade and rollback transaction failed' }
          $env:NVP_SMOKE_DIAGNOSTIC_PATH=Join-Path $env:RUNNER_TEMP 'nvp-w1g-post-rollback-smoke.txt'
          $restored=Start-Process -FilePath $active -ArgumentList '--smoke-reopen' -PassThru
          if (-not $restored.WaitForExit(180000)) {
            $restored.Kill()
            throw 'Restored original installed NVP.exe --smoke-reopen timed out after real NSIS rollback'
          }
          if ($restored.ExitCode -ne 0) { throw 'Restored original installed NVP.exe could not reopen original film data' }
      - name: Verify actual installed device-producer bundle, without recording
        shell: pwsh
        run: |
          $installed=Join-Path $env:LOCALAPPDATA 'Programs/NVP/NVP.exe'
          $env:NVP_SMOKE_DIAGNOSTIC_PATH=Join-Path $env:RUNNER_TEMP 'nvp-p1b-installed-bundle.txt'
          & $installed --smoke-producer-bundle
          if ($LASTEXITCODE -ne 0) {
            if (Test-Path $env:NVP_SMOKE_DIAGNOSTIC_PATH) { Get-Content $env:NVP_SMOKE_DIAGNOSTIC_PATH }
            throw 'Installed original producer bundle failed'
          }
          Remove-Item Env:NVP_SMOKE_DIAGNOSTIC_PATH
      - name: Independently reopen original USD and PCM in the installed native runtime
        shell: pwsh
        run: |
          $installed=Join-Path $env:LOCALAPPDATA 'Programs/NVP/NVP.exe'
          $env:NVP_SMOKE_DIAGNOSTIC_PATH=Join-Path $env:RUNNER_TEMP 'nvp-w1g-native-data-av-smoke-diagnostic.txt'
          $native=Start-Process -FilePath $installed -ArgumentList '--smoke-data-av' -PassThru
          if (-not $native.WaitForExit(120000)) {
            Write-Host 'Original native Digital Take/PCM smoke stages:'
            if (Test-Path $env:NVP_SMOKE_DIAGNOSTIC_PATH) { Get-Content $env:NVP_SMOKE_DIAGNOSTIC_PATH | Select-Object -Last 45 }
            $native.Kill()
            throw 'Installed original OpenUSD+spatial PCM smoke timed out; no inferred acceptance'
          }
          if ($native.ExitCode -ne 0) {
            if (Test-Path $env:NVP_SMOKE_DIAGNOSTIC_PATH) { Get-Content $env:NVP_SMOKE_DIAGNOSTIC_PATH | Select-Object -Last 45 }
            throw 'Installed original OpenUSD+spatial PCM smoke failed'
          }
      - name: Require actual visible Windows WebView2 desktop page load
        shell: pwsh
        run: |
          $installed=Join-Path $env:LOCALAPPDATA 'Programs/NVP/NVP.exe'
          # Do not confuse an EdgeChromium/React startup failure with a
          # bug in NVP's native DesktopCameraBridge JS export.
          $env:NVP_SMOKE_DIAGNOSTIC_PATH=Join-Path $env:RUNNER_TEMP 'nvp-w1g-basic-smoke-diagnostic.txt'
          $basic=Start-Process -FilePath $installed -ArgumentList '--smoke-window-basic' -PassThru
          $basicExit=124
          if (-not $basic.WaitForExit(85000)) {
            Write-Host 'Basic native EdgeChromium smoke exceeded its own bound'
            $basic.Kill()
          } else {
            $basicExit=$basic.ExitCode
          }
          Write-Host "Basic EdgeChromium actual installed React smoke exit=$basicExit"
          if (Test-Path $env:NVP_SMOKE_DIAGNOSTIC_PATH) {
            Get-Content $env:NVP_SMOKE_DIAGNOSTIC_PATH | Select-Object -Last 50
          }
          $env:NVP_SMOKE_DIAGNOSTIC_PATH=Join-Path $env:RUNNER_TEMP 'nvp-w1g-webview-smoke-diagnostic.txt'
          $window=Start-Process -FilePath $installed -ArgumentList '--smoke-window' -PassThru
          if (-not $window.WaitForExit(180000)) {
            Write-Host 'Windows native WebView2 host process/window/session on timeout:'
            $window.Refresh()
            Write-Host "NVP smoke pid=$($window.Id) session=$($window.SessionId) title='$($window.MainWindowTitle)' HWND=$($window.MainWindowHandle)"
            Write-Host "CI session=$((Get-Process -Id $PID).SessionId) interactive=$([Environment]::UserInteractive)"
            Write-Host 'Native window bootstrap stages before timeout:'
            if (Test-Path $env:NVP_SMOKE_DIAGNOSTIC_PATH) {
              Get-Content $env:NVP_SMOKE_DIAGNOSTIC_PATH | Select-Object -Last 50
            }
            $window.Kill()
            throw 'Native WebView2 visible Windows smoke timed out'
          }
          if ($window.ExitCode -ne 0 -or $basicExit -ne 0) {
            if (Test-Path $env:NVP_SMOKE_DIAGNOSTIC_PATH) {
              Get-Content $env:NVP_SMOKE_DIAGNOSTIC_PATH | Select-Object -Last 50
            }
            throw "Real installed WebView2/React/IPC acceptance failed; basic=$basicExit full=$($window.ExitCode)"
          }
      - name: Verify real installed exe under a native Windows Job Object
        shell: pwsh
        run: |
          $installed=Join-Path $env:LOCALAPPDATA 'Programs/NVP'
          python -m tools.nvp_w1g_windows_installed_acceptance --installed "$installed" --projects "$env:NVP_HOME" --build-receipt "$env:RUNNER_TEMP/nvp-w1g-native-build.json" --output "$env:RUNNER_TEMP/nvp-w1g-real-windows-kernel.json"
          if ($LASTEXITCODE -ne 0) { throw 'Installed NVP native executable, restart, WebView2, data-first A/V, or Windows Job Object evidence failed' }
      - name: Uninstall without deleting creator project data
        shell: pwsh
        run: |
          $uninstaller=Join-Path $env:LOCALAPPDATA 'Programs/NVP/Uninstall NVP.exe'
          if (-not (Test-Path $uninstaller)) { throw 'Uninstaller missing' }
          $owned=$env:NVP_HOME
          if (-not (Test-Path (Join-Path $owned 'nvp_studio.sqlite3'))) {
            throw 'Missing creator SQLite film database before uninstall'
          }
          python tools/nvp_w1g_native_package.py snapshot-films --projects "$owned" --output "$env:RUNNER_TEMP/nvp-w1g-original-films.json"
          if ($LASTEXITCODE -ne 0) { throw 'Could not snapshot creator film preservation baseline' }
          $result=Start-Process -FilePath $uninstaller -ArgumentList '/S' -PassThru -Wait
          if ($result.ExitCode -ne 0) { throw 'Uninstall failed' }
          Start-Sleep -Seconds 2
          if (-not (Test-Path (Join-Path $owned 'nvp_studio.sqlite3'))) { throw 'Uninstall deleted saved film' }
          if (Test-Path (Join-Path $env:LOCALAPPDATA 'Programs/NVP/NVP.exe')) { throw 'Uninstall left executable' }
          python tools/nvp_w1g_native_package.py verify-films --projects "$owned" --receipt "$env:RUNNER_TEMP/nvp-w1g-original-films.json" --output "$env:RUNNER_TEMP/nvp-w1g-film-preservation.json"
          if ($LASTEXITCODE -ne 0) { throw 'Original creator film files changed across uninstall' }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nvp-alpha-windows-bundle-audit
          path: |
            ${{ runner.temp }}/nvp-alpha-bundle-audit.json
            ${{ runner.temp }}/nvp-w1g-native-build.json
            ${{ runner.temp }}/nvp-w1g-installed.json
            ${{ runner.temp }}/nvp-w1g-real-windows-kernel.json
            ${{ runner.temp }}/nvp-w1g-first-smoke-diagnostic.txt
            ${{ runner.temp }}/nvp-w1g-reopen-smoke-diagnostic.txt
            ${{ runner.temp }}/nvp-w1g-post-rollback-smoke.txt
            ${{ runner.temp }}/nvp-w1g-webview-smoke-diagnostic.txt
            ${{ runner.temp }}/nvp-w1g-native-data-av-smoke-diagnostic.txt
            ${{ runner.temp }}/nvp-w1g-basic-smoke-diagnostic.txt
            ${{ runner.temp }}/nvp-w1g-basic-smoke-diagnostic-stacks.txt
            ${{ runner.temp }}/nvp-w1g-webview-smoke-diagnostic-stacks.txt
            ${{ runner.temp }}/nvp-w1g-staged.json
            ${{ runner.temp }}/nvp-w1g-windows-nsis-matrix.json
            ${{ runner.temp }}/nvp-w1g-original-films.json
            ${{ runner.temp }}/nvp-w1g-film-preservation.json
          if-no-files-found: warn
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nvp-alpha-windows-nsis-candidate
          path: dist/NVP-Alpha-Setup.exe
          if-no-files-found: warn
          retention-days: 7
