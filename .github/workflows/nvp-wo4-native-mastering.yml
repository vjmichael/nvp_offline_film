      - 'tests/test_nvp_paged_production_manifest.py'
      - 'tests/test_nvp_wo4_*.py'
      - 'backend/nvp_wo5_*.py'
      - 'backend/nvp_wo6_*.py'
      - 'tests/test_nvp_wo6_*.py'
      - 'tools/nvp_wo6_take_worker.py'
      - 'tests/test_nvp_wo5_*.py'
