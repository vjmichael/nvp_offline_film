  push:
    branches: [main]
    paths:
      - 'backend/nvp_wo4_*.py'
      - 'backend/nvp_g07_section*.py'
      - 'tests/test_nvp_efs_sidecar_race.py'
      - 'backend/nvp_w1g_encrypted_source.py'
      - 'tests/test_nvp_perf03g_sections.py'
      - 'tests/test_nvp_perf03g_r1_storage.py'
      - 'tests/test_nvp_perf03g_r2_paged_active.py'
      - 'tests/test_nvp_perf03g_r3_media.py'
      - 'tests/test_nvp_perf03g_r4_protected_output.py'
      - 'backend/nvp_g07_review_reels.py'
      - 'backend/nvp_g03_live_backup.py'
      - 'backend/nvp_g03_pcm_pages.py'
      - 'backend/nvp_g06_filming.py'
      - 'backend/nvp_g09_actor.py'
      - 'backend/nvp_g07_paged_media.py'
      - 'backend/nvp_g07_preview.py'
      - 'backend/nvp_g07_storage_migration.py'
      - 'backend/nvp_g07_recovery_dialog.py'
      - 'backend/nvp_g07_paged_active.py'
      - 'backend/nvp_g07_routes.py'
      - 'backend/nvp_g07_edit.py'
      - 'backend/nvp_g03_live_store.py'
      - 'backend/nvp_g03_windows_vault.py'
      - 'backend/nvp_slate_hierarchy.py'
      - 'tests/test_nvp_slate_hierarchy.py'
      - 'backend/nvp_production_*.py'
      - 'tests/test_nvp_production_*.py'
      - 'backend/nvp_paged_production_manifest.py'
      - 'tests/test_nvp_paged_production_manifest.py'
      - 'tests/test_nvp_wo4_*.py'
      - 'backend/nvp_wo5_*.py'
      - 'backend/nvp_wo6_*.py'
      - 'tests/test_nvp_wo6_*.py'
      - 'tools/nvp_wo6_take_worker.py'
      - 'tests/test_nvp_wo5_*.py'
      - 'backend/nvp_wo3_native_codecs.py'
      - 'tests/test_nvp_wo3_protected_contract.py'
