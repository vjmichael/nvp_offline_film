name: NVP FILM03-09C Original Audio Phoneme/Viseme Source (NO FFMPEG)

on:
  push:
    branches: [nvp/film03-09c-phoneme-alignment-scope-cleanup-20261108]
  pull_request:
    branches: [nvp/film03-06-supervised-voice-animation-workers-20261108]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nvp-film03-09c-${{ github.event_name }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  strict-source-alignment:
    name: Original PCM/real output parser/viseme mapping / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 85
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install original OpenUSD project dependencies
        run: |
          python -m pip install -r requirements-foundation.txt
          python -m pip install --only-binary=:all: "usd-core==26.11" numpy Pillow
          python -m pip install httpx
      - name: Compile reviewed source modules
        run: |
          python -m compileall -q backend/nvp_film03_phoneme_alignment.py backend/nvp_film03_independent_facial_direction.py backend/nvp_film03_voice_conversion_intent.py backend/nvp_film03_voice_performance_lab.py tests/test_nvp_film03_phoneme_alignment.py
      - name: Verify strict word/phone alignment and no reviewed executable bypass
        run: python -m unittest discover -s tests -p test_nvp_film03_phoneme_alignment.py -v
      - name: Preserve original voice/guide/facial source checks after scope cleanup
        run: |
          python -m unittest discover -s tests -p test_nvp_film03_voice_performance_lab.py -v
          python -m unittest discover -s tests -p test_nvp_film03_voice_conversion_intent.py -v
          python -m unittest discover -s tests -p test_nvp_film03_independent_facial_direction.py -v
