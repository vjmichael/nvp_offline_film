name: NVP STACK-02A pinned external Blender worker acceptance

on:
  push:
    branches:
      - nvp/stack02a-durable-blender-worker-20261103
  pull_request:
    branches:
      - nvp/stack01-reuse-first-component-bundling-20261103
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linux-worker-contracts:
    name: Linux worker pinning, durable journal, cancel and tamper tests
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install minimal source testing requirements
        run: |
          python -m pip install -r requirements-foundation.txt httpx trimesh
      - name: Compile and run isolated worker contracts
        run: |
          python -m compileall -q backend tools tests
          python -m unittest discover -s tests -p 'test_blender_worker.py' -v
      - name: Save exact reviewed source
        if: always()
        run: |
          zip -qr nvp_stack02a_exact_source.zip backend tools tests requirements-foundation.txt
          sha256sum nvp_stack02a_exact_source.zip > nvp_stack02a_source.sha256
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nvp-stack02a-exact-source
          path: |
            nvp_stack02a_exact_source.zip
            nvp_stack02a_source.sha256
          retention-days: 7

  windows-worker-contracts:
    name: Windows worker pinning and safe journal/cancel contracts
    runs-on: windows-2025
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install minimal source test requirements
        shell: pwsh
        run: |
          python -m pip install -r requirements-foundation.txt httpx trimesh
      - name: Compile and run Windows worker contracts
        shell: pwsh
        run: |
          $env:PYTHONPATH='.'
          python -m compileall -q backend tools tests
          if ($LASTEXITCODE -ne 0) { throw 'Python compile failed' }
          python -m unittest discover -s tests -p 'test_blender_worker.py' -v
          if ($LASTEXITCODE -ne 0) { throw 'Windows worker contract failed' }

  native-blender-supervision:
    name: Real pinned Blender child, scene and PNG, cancellation/restart audit
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      BLENDER_VERSION: '5.2.3'
      BLENDER_BASE: 'https://download.blender.org/release/Blender5.2'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Blender runtime prerequisites
        run: |
          python -m pip install -r requirements-foundation.txt httpx trimesh
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends xvfb xauth libgl1 libegl1 libx11-6 libxi6 libxrender1 libxxf86vm1 libxkbcommon0
      - name: Download SHA-verified Blender binary
        shell: bash
        run: |
          set -euo pipefail
          archive="blender-$BLENDER_VERSION-linux-x64.tar.xz"
          curl --fail --location --retry 4 --retry-delay 5 "$BLENDER_BASE/$archive" -o "$archive"
          curl --fail --location --retry 4 --retry-delay 5 "$BLENDER_BASE/blender-$BLENDER_VERSION.sha256" -o blender.sha256
          grep "  $archive$" blender.sha256 | sha256sum --check --status
          mkdir -p /tmp/nvp-blender
          tar -xJf "$archive" -C /tmp/nvp-blender --strip-components=1
          echo "/tmp/nvp-blender" >> "$GITHUB_PATH"
      - name: 'Real Blender: bounded child, version, input and output SHA, cancel and recovery'
        shell: bash
        run: |
          set -euo pipefail
          xvfb-run -a python -m tools.nvp_stack02a_worker_fixture --out acceptance_artifacts/stack02a
      - name: Preserve real worker journal, rendered Blender scene and receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nvp-stack02a-verified-worker-evidence
          path: acceptance_artifacts/stack02a/
          retention-days: 7
          if-no-files-found: warn
