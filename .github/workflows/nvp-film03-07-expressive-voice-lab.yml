name: NVP FILM03-07 Real PCM Voice Audition LAB (NO SPEECH GENERATION, NO FFMPEG)

on:
  push:
    branches: [nvp/film03-07-expressive-voice-audition-lab-20261108]
  pull_request:
    branches: [nvp/film03-06-supervised-voice-animation-workers-20261108]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nvp-film03-07-${{ github.event_name }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  actor-voice-pcm-source:
    name: Frozen ActorID and real PCM import, no unauthorized generation / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install actual source-dependent OpenUSD and native testing dependencies
        run: |
          python -m pip install -r requirements-foundation.txt
          python -m pip install --only-binary=:all: "usd-core==26.11" numpy Pillow
          python -m pip install httpx2
      - name: Compile source modules and regression tests
        run: |
          python -m compileall -q backend/nvp_film03_voice_performance_lab.py backend/nvp_film03_expressive_voice_direction.py backend/nvp_film03_actor_identity_core.py tests/test_nvp_film03_voice_performance_lab.py
      - name: Real native PCM parser with source-locked actor, wrong speaker and audio tamper refusal
        run: python -m unittest discover -s tests -p test_nvp_film03_voice_performance_lab.py -v
      - name: Preserve previous ActorID and expressive direction source evidence
        run: |
          python -m unittest discover -s tests -p test_nvp_film03_expressive_voice_direction.py -v
          python -m unittest discover -s tests -p test_nvp_film03_actor_identity_core.py -v
      - name: No cinematic provider is qualified by these mechanical PCM tests
        shell: python
        run: |
          from backend.nvp_film03_expressive_voice_direction import cinematic_engine_readiness
          result = cinematic_engine_readiness({"provider": "lab-only", "actual_voice_performance": False})
          assert result["cinematic_generation_enabled"] is False
          assert result["espeak_ng_film_voice_qualified"] is False
          print("FILM03-07 LAB does not unlock film voice generation")
