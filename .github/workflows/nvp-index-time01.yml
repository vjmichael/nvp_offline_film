name: NVP INDEX-TIME-01 Imported PTS to Film Time

on:
  push:
    branches:
      - nvp/index-pts-film-time-20261105
    paths:
      - "backend/nvp_source_pts_film_time.py"
      - "backend/nvp_native_frame_index.py"
      - "tests/test_nvp_source_pts_film_time.py"
      - "tests/test_nvp_owned_frame_index.py"
      - ".github/workflows/nvp-index-time01.yml"
  pull_request:
    paths:
      - "backend/nvp_source_pts_film_time.py"
      - "backend/nvp_native_frame_index.py"
      - "tests/test_nvp_source_pts_film_time.py"
      - "tests/test_nvp_owned_frame_index.py"
      - ".github/workflows/nvp-index-time01.yml"
  workflow_dispatch:

concurrency:
  group: nvp-index-time01-${{ github.ref }}
  cancel-in-progress: true

jobs:
  source-to-film-time:
    name: VFR source time ${{ matrix.os }} Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025]
        python: ["3.11","3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install native FFmpeg/FFprobe (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg
      - name: Install native FFmpeg/FFprobe (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: choco install ffmpeg -y --no-progress
      - name: Compile Film Time bridge
        shell: bash
        run: |
          python -m compileall -q backend/nvp_source_pts_film_time.py tests/test_nvp_source_pts_film_time.py tests/test_nvp_owned_frame_index.py
          ffmpeg -version
          ffprobe -version
      - name: Source PTS exact rational and nonrepresentable rate contract
        shell: bash
        run: python -m unittest discover -s tests -p "test_nvp_source_pts_film_time.py" -v
      - name: Real native VFR B-frame offset index plus supervised recovery
        shell: bash
        run: python -m unittest discover -s tests -p "test_nvp_owned_frame_index.py" -v
      - name: Independent authoritative Temporal Ledger regression
        shell: bash
        run: |
          python -m unittest discover -s tests -p "test_nvp_temporal_ledger.py" -v
          python -m unittest discover -s tests -p "test_data_time_projection.py" -v
