name: NVP WO6-07F Actual USD Rendered Picture and PCM Audio-Clock Preview (NO FFMPEG)

on:
  push:
    branches: [nvp/wo6-07f-rendered-source-av-20261108]
  pull_request:
    paths:
      - backend/nvp_wo6_07e_source_review.py
      - backend/nvp_wo6_07f_rendered_av.py
      - backend/nvp_wo6_desktop_bridge.py
      - frontend/src/WO6RenderedDirectorPlayer.jsx
      - frontend/src/WO6RenderedDirectorPlayer.test.jsx
      - frontend/src/WO6CreatorActionsPanel.jsx
      - tests/test_nvp_wo6_07f_rendered_av.py
      - .github/workflows/nvp-wo6-07f-real-rendered-av.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nvp-wo6-07f-${{ github.event_name }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  true-native-rendered-usd-pixels-and-pcm:
    name: Real USD mesh/light/camera raster pixels + exact PCM across true edit cuts / ${{ matrix.os }} / Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025]
        python: ['3.11', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install native scene/OpenUSD, real raster/Pillow, PCM and source requirements
        run: |
          python -m pip install -r requirements-foundation.txt
          python -m pip install --only-binary=:all: "usd-core==26.11"
          python -m pip install --only-binary=:all: numpy Pillow
      - name: Install Windows native process containment helpers for actual source fixture
        if: runner.os == 'Windows'
        run: python -m pip install 'pywin32>=310'
      - name: Compile exact-source frame projection, genuine first-party USD pixel raster and source PCM
        run: python -m compileall -q backend/nvp_wo6_07e_source_review.py backend/nvp_wo6_07f_rendered_av.py backend/nvp_wo6_desktop_bridge.py tests/test_nvp_wo6_07f_rendered_av.py
      - name: Reopen real OpenUSD original camera/light/meshes and render PNG pixels synchronized to original 48k PCM windows
        run: python -m unittest discover -s tests -p test_nvp_wo6_07f_rendered_av.py -v
      - name: Retain real native original-edit-to-source WAV regression
        run: python -m unittest discover -s tests -p test_nvp_wo6_07e_source_review.py -v
      - name: Retain immutable first-party native editorial source and sound authoring
        run: python -m unittest discover -s tests -p test_nvp_wo6_sound_editorial.py -v
      - name: Forbid FFmpeg fallback or hidden media dependency
        run: python tools/nvp_no_ffmpeg_contract.py

  react-audio-clock:
    name: Original native rendered pixels/audio clock browser schedule and explicit underrun test
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install actual NVP React application dependencies
        working-directory: frontend
        run: npm install --no-audit --no-fund --package-lock=false
      - name: Build native NVP director desktop
        working-directory: frontend
        run: npm run build
      - name: Run true-IPC boundary and simulated audio-device clock underflow regression
        working-directory: frontend
        run: npx vitest run src/WO6RenderedDirectorPlayer.test.jsx src/WO6DirectorSourceReview.test.jsx src/WO6CreatorActionsPanel.test.jsx
