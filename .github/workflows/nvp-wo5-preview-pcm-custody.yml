name: NVP WO5 Preview XYZ12 and PCM24 Cache Custody (NO FFMPEG)

on:
  push:
    branches: [nvp/wo5-preview-pcm-custody-closeout-20261107]
  pull_request:
    paths:
      - backend/nvp_wo5_finished_playback.py
      - tests/test_nvp_wo5_finished_playback.py
      - .github/workflows/nvp-wo5-preview-pcm-custody.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nvp-wo5-pcm-xyz12-${{ github.event_name }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  exact-source-integrity:
    name: Native WO5 XYZ12 and PCM24 / ${{ matrix.os }} / Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025]
        python: ['3.11', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install first-party image/audio helper dependencies
        run: python -m pip install -r requirements-foundation.txt
      - name: Verify compilation
        run: python -m compileall -q backend/nvp_wo5_finished_playback.py tests/test_nvp_wo5_finished_playback.py
      - name: Check full-image XYZ12 range and exact reel 24/26 boundary samples
        run: python -m unittest discover -s tests -p test_nvp_wo5_finished_playback.py -v
      - name: Verify no legacy FFmpeg bypass
        run: python tools/nvp_no_ffmpeg_contract.py
