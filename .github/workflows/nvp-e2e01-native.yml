name: NVP E2E-01 native editorial alpha integration
on:
  push:
    branches:
      - nvp/stack02c3b14-picture-conform-20261104
    paths:
      - 'backend/nvp_studio.py'
      - 'backend/nvp_film_index.py'
      - 'backend/nvp_production_scene.py'
      - 'tests/test_nvp_e2e01_native_editorial.py'
      - 'backend/nvp_longform_review.py'
      - 'tools/nvp_longform_review.py'
      - 'tests/test_nvp_longform_review.py'
      - 'backend/nvp_master01b_native_host.py'
      - 'backend/nvp_resource_supervisor.py'
      - 'tools/nvp_master01b_native_worker.py'
      - 'tests/test_nvp_master01b_native.py'
      - 'backend/nvp_master01c_two_phase.py'
      - 'tests/test_nvp_master01c_two_phase.py'
      - 'tests/test_nvp_master01c_native_host.py'
      - '.github/workflows/nvp-e2e01-native.yml'
  pull_request:
    paths:
      - 'backend/nvp_studio.py'
      - 'backend/nvp_film_index.py'
      - 'backend/nvp_production_scene.py'
      - 'tests/test_nvp_e2e01_native_editorial.py'
      - 'backend/nvp_longform_review.py'
      - 'tools/nvp_longform_review.py'
      - 'tests/test_nvp_longform_review.py'
      - 'backend/nvp_master01b_native_host.py'
      - 'backend/nvp_resource_supervisor.py'
      - 'tools/nvp_master01b_native_worker.py'
      - 'tests/test_nvp_master01b_native.py'
      - 'backend/nvp_master01c_two_phase.py'
      - 'tests/test_nvp_master01c_two_phase.py'
      - 'tests/test_nvp_master01c_native_host.py'
      - '.github/workflows/nvp-e2e01-native.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  real-media-restart:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025]
        python: ['3.11','3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install Windows Job Object FFI for contained film worker
        if: runner.os == 'Windows'
        shell: bash
        run: python -m pip install 'pywin32>=306'
      - name: Install native FFmpeg on Linux
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y ffmpeg
      - name: Install native FFmpeg on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          choco install ffmpeg -y --no-progress
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Join-Path $env:ChocolateyInstall 'bin' | Out-File -FilePath $env:GITHUB_PATH -Append
      - name: Require actual ProRes + PCM24 and Python source compilation
        shell: bash
        run: |
          set -euo pipefail
          command -v ffmpeg
          command -v ffprobe
          ffmpeg -hide_banner -encoders 2>&1 | grep prores_ks
          ffmpeg -hide_banner -encoders 2>&1 | grep pcm_s24le
          python -m compileall -q backend/nvp_studio.py backend/nvp_film_index.py backend/nvp_production_scene.py tests/test_nvp_e2e01_native_editorial.py backend/nvp_longform_review.py tools/nvp_longform_review.py tests/test_nvp_longform_review.py backend/nvp_master01b_native_host.py backend/nvp_resource_supervisor.py tools/nvp_master01b_native_worker.py tests/test_nvp_master01b_native.py backend/nvp_master01c_two_phase.py tests/test_nvp_master01c_two_phase.py tests/test_nvp_master01c_native_host.py
      - name: Execute genuine media import, trim, render, restart and tamper rejection
        shell: bash
        run: |
          set -euo pipefail
          python -m unittest discover -s tests -p test_nvp_e2e01_native_editorial.py -v
      - name: Require 36- and 60-second original media assembly, restart and tamper rejection
        shell: bash
        run: |
          set -euo pipefail
          python -m unittest discover -s tests -p test_nvp_longform_review.py -v
      - name: Require contained 30s worker, creator scope, cancellation and crash recovery
        shell: bash
        run: |
          set -euo pipefail
          python -m unittest discover -s tests -p test_nvp_master01b_native.py -v
      - name: Require prepared-only media, host-owned publication, native crash recovery and 60s reel
        shell: bash
        run: |
          set -euo pipefail
          python -m unittest discover -s tests -p test_nvp_master01c_two_phase.py -v
          python -m unittest discover -s tests -p test_nvp_master01c_native_host.py -v
