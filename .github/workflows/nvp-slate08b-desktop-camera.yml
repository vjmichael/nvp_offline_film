name: NVP SLATE-08B Trusted Desktop Camera Render IPC

on:
  push:
    branches:
      - nvp/slate08b-trusted-desktop-optics-20261106
      - nvp/w1g-p1a-sec06-integrated-20261112
  pull_request:
    paths:
      - "backend/nvp_slate08b_native_camera_ipc.py"
      - "tools/nvp_desktop_alpha.py"
      - "frontend/src/FilmCameraSourcePanel.jsx"
      - "frontend/src/CameraLensWorkbench.jsx"
      - "frontend/src/FilmCameraNativeBridge.test.jsx"
      - "frontend/src/ActorPerformancePanel.jsx"
      - "frontend/src/ActorSceneCastingPanel.jsx"
      - "frontend/src/ActorSceneCastingPanel.test.jsx"
      - "frontend/src/FilmSourceStagesPanel.jsx"
      - "frontend/src/FilmSourceStagesPanel.test.jsx"
      - "backend/nvp_p1d_editorial_continuity.py"
      - "backend/nvp_p1e_actor_spatial_bus.py"
      - "backend/nvp_p1f_sustained_delivery.py"
      - "backend/nvp_p2_longform_source_plan.py"
      - "frontend/src/ActorPerformancePanel.test.jsx"
      - "frontend/src/DataFirstAVPanel.jsx"
      - "backend/nvp_p1bc_actor_registry.py"
      - "backend/nvp_webview_ipc_surface.py"
      - "tests/test_nvp_webview_ipc_surface.py"
      - "tests/test_nvp_p1bc_actor_dialogue_native.py"
      - "tests/test_nvp_slate08b_native_camera_ipc.py"
      - ".github/workflows/nvp-slate08b-desktop-camera.yml"
  workflow_dispatch:

concurrency:
  group: nvp-slate08b-${{ github.ref }}
  cancel-in-progress: true

jobs:
  native-camera-ipc:
    name: SLATE-08B ${{ matrix.os }} Python ${{ matrix.python }} native
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025]
        python: ["3.11","3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Real OpenUSD runtime
        shell: bash
        run: 'python -m pip install --only-binary=:all: "usd-core==26.11"'
      - name: Compile original desktop, native IPC and source tests
        shell: bash
        run: |
          python -m compileall -q backend/nvp_slate08b_native_camera_ipc.py tools/nvp_desktop_alpha.py tests/test_nvp_slate08b_native_camera_ipc.py
      - name: Native window origin, one-use consent, cancellation, source custody and PNG
        shell: bash
        run: python -m unittest discover -s tests -p "test_nvp_slate08b_native_camera_ipc.py" -v
      - name: Source snapshot regression
        shell: bash
        run: python -m unittest discover -s tests -p "test_nvp_slate08_desktop_read.py" -v

  verified-camera-react:
    name: SLATE-08B React native IPC and stale-result UI
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm install --no-audit --no-fund
      - run: npm run build
      - run: npm run test:ui -- src/CameraLensWorkbench.test.jsx src/FilmCameraSourcePanel.test.jsx src/FilmCameraNativeBridge.test.jsx src/ActorPerformancePanel.test.jsx src/ActorSceneCastingPanel.test.jsx src/FilmSourceStagesPanel.test.jsx
