# HISTORICAL SLATE-08B: retired by DATA-AV migration.
# Manual-only snapshot of superseded Blender proxy acceptance.
# DO NOT use as a release gate; native OpenUSD DATA-AV CI supersedes it.
name: NVP SLATE-08B Trusted Desktop Camera Render IPC

on:
  workflow_dispatch:

concurrency:
  group: nvp-slate08b-${{ github.ref }}
  cancel-in-progress: true

jobs:
  native-camera-ipc:
    name: SLATE-08B ${{ matrix.os }} Python ${{ matrix.python }} native
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025]
        python: ["3.11","3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Real OpenUSD runtime
        shell: bash
        run: 'python -m pip install --only-binary=:all: "usd-core==26.11"'
      - name: Compile original desktop, native IPC and source tests
        shell: bash
        run: |
          python -m compileall -q backend/nvp_slate08b_native_camera_ipc.py tools/nvp_desktop_alpha.py tests/test_nvp_slate08b_native_camera_ipc.py
      - name: Native window origin, one-use consent, cancellation, source custody and PNG
        shell: bash
        run: python -m unittest discover -s tests -p "test_nvp_slate08b_native_camera_ipc.py" -v
      - name: Source snapshot regression
        shell: bash
        run: python -m unittest discover -s tests -p "test_nvp_slate08_desktop_read.py" -v

  verified-camera-react:
    name: SLATE-08B React native IPC and stale-result UI
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm install --no-audit --no-fund
      - run: npm run build
      - run: npm run test:ui -- src/CameraLensWorkbench.test.jsx src/FilmCameraSourcePanel.test.jsx src/FilmCameraNativeBridge.test.jsx
