name: NVP AUDIO-01H bounded automation unit gate
on:
  push:
    branches:
      - nvp/stack02c3b14-picture-conform-20261104
  workflow_dispatch:
permissions:
  contents: read
jobs:
  automation-contract:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025]
        python-version: ['3.11', '3.13']
    runs-on: ${{ matrix.os }}
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Verify automation without optional media dependencies
        run: |
          python -m compileall -q backend/nvp_audio01h_automation.py tests/test_audio01h_automation.py
          python -m unittest discover -s tests -p test_audio01h_automation.py -v
