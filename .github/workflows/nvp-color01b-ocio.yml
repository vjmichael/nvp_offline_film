name: NVP COLOR-01B pinned ACES 2 OCIO acceptance

on:
  push:
    branches:
      - nvp/color01b-ocio-aces2-mastering-20261103
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ocio-reference:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install pinned OpenColorIO
        run: python -m pip install 'opencolorio==2.5.2' 'numpy==2.3.4'
      - name: Inspect pinned ACES 2 CG config
        run: python -m tools.nvp_color01b_probe
