name: NVP COLOR-01B ACES 2 color-managed review acceptance

on:
  push:
    branches:
      - nvp/color01b-ocio-aces2-mastering-20261103
  pull_request:
    branches:
      - nvp/color01a-native-scene-linear-exr-20261103
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ocio-reference:
    name: Pinned OCIO ACES 2 Python and old PNG/EXR regression
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install pinned OpenColorIO and project dependencies
        run: |
          python -m pip install -r requirements-foundation.txt httpx trimesh
          python -m pip install 'opencolorio==2.5.2' 'numpy==2.3.4'
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg
      - name: Inspect OCIO config and run color contracts
        run: |
          python -m compileall -q backend tools tests
          python -m tools.nvp_color01b_probe
          python -m unittest discover -s tests -p 'test_color_ocio.py' -v
          python -m unittest discover -s tests -p 'test_color_exr.py' -v
          python -m unittest discover -s tests -p 'test_presentation_pipeline.py' -v
          python -m unittest discover -s tests -p 'test_full_motion.py' -v
      - name: Save reproducible exact source snapshot
        if: always()
        run: |
          zip -qr nvp_color01b_exact_source.zip backend tools tests requirements-foundation.txt
          sha256sum nvp_color01b_exact_source.zip > nvp_color01b_source.sha256
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nvp-color01b-exact-source
          path: |
            nvp_color01b_exact_source.zip
            nvp_color01b_source.sha256
          retention-days: 7

  native-aces2-review:
    name: Real Cycles EXR to ACES 2 SDR PNG16 and FilmIndex reopen
    runs-on: ubuntu-24.04
    timeout-minutes: 38
    env:
      BLENDER_VERSION: '5.2.3'
      BLENDER_BASE: 'https://download.blender.org/release/Blender5.2'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install exact OCIO and Blender/FFmpeg prerequisites
        run: |
          python -m pip install -r requirements-foundation.txt httpx trimesh
          python -m pip install 'opencolorio==2.5.2' 'numpy==2.3.4'
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends xvfb xauth libgl1 libegl1 libx11-6 libxi6 libxrender1 libxxf86vm1 libxkbcommon0 ffmpeg
      - name: Download and hash-verify Blender release
        shell: bash
        run: |
          set -euo pipefail
          archive="blender-$BLENDER_VERSION-linux-x64.tar.xz"
          curl --fail --location --retry 4 --retry-delay 5 "$BLENDER_BASE/$archive" -o "$archive"
          curl --fail --location --retry 4 --retry-delay 5 "$BLENDER_BASE/blender-$BLENDER_VERSION.sha256" -o blender.sha256
          grep "  $archive$" blender.sha256 | sha256sum --check --status
          mkdir -p /tmp/nvp-blender
          tar -xJf "$archive" -C /tmp/nvp-blender --strip-components=1
          echo "/tmp/nvp-blender" >> "$GITHUB_PATH"
      - name: Render real frozen take to EXR, color-manage, independently decode and corrupt/recover
        shell: bash
        run: |
          set -euo pipefail
          xvfb-run -a python -m tools.nvp_color01b_fixture --out acceptance_artifacts/color01b
      - name: Publish real frame, transform and FilmIndex proof
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nvp-color01b-real-aces2-evidence
          path: acceptance_artifacts/color01b/
          retention-days: 7
          if-no-files-found: warn

  windows-ocio-contract:
    name: Windows OCIO 2.5.2 ACES 2 pinned SDR source/view contract
    runs-on: windows-2025
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install pinned Windows color runtime and project test prerequisites
        shell: pwsh
        run: |
          python -m pip install -r requirements-foundation.txt httpx trimesh
          python -m pip install 'opencolorio==2.5.2' 'numpy==2.3.4'
          python -c "import PyOpenColorIO as o; print(o.GetVersion())"
      - name: Windows ACES config, OCIO processor, source integrity and legacy regressions
        shell: pwsh
        run: |
          $env:PYTHONPATH = '.'
          python -m compileall -q backend tools tests
          if ($LASTEXITCODE -ne 0) { throw 'Python compilation failed' }
          python -m tools.nvp_color01b_probe
          if ($LASTEXITCODE -ne 0) { throw 'ACES 2 config failed' }
          python -m unittest discover -s tests -p 'test_color_ocio.py' -v
          if ($LASTEXITCODE -ne 0) { throw 'Windows OCIO regression failed' }
          python -m unittest discover -s tests -p 'test_color_exr.py' -v
          if ($LASTEXITCODE -ne 0) { throw 'Windows EXR source regression failed' }
          python -m unittest discover -s tests -p 'test_presentation_pipeline.py' -v
          if ($LASTEXITCODE -ne 0) { throw 'Windows PNG/EXR source tests failed' }
          python -m unittest discover -s tests -p 'test_full_motion.py' -v
          if ($LASTEXITCODE -ne 0) { throw 'Windows motion source tests failed' }
