name: NVP WO5 Original Thirty Minute OpenUSD Source Pilot (NOT A FINISHED FILM)
on:
  push:
    branches: [nvp/wo5-installed-sustained-original30-20261107]
    paths:
      - tools/nvp_wo5_original_30m_pilot.py
      - tests/test_nvp_wo5_original_30m_pilot.py
      - .github/workflows/nvp-wo5-original-30m-source.yml
  pull_request:
    paths:
      - tools/nvp_wo5_original_30m_pilot.py
      - tests/test_nvp_wo5_original_30m_pilot.py
      - .github/workflows/nvp-wo5-original-30m-source.yml
concurrency:
  group: nvp-wo5-original30-${{ github.event_name }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  original-source-and-immutable-retake:
    name: Real authored 30m OpenUSD/60 shots/original PCM and new retake / ${{ matrix.os }} / ${{ matrix.py }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025]
        py: ['3.11','3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.py }}
      - name: Install genuine native OpenUSD movie source reader
        run: 'python -m pip install --only-binary=:all: "usd-core==26.11" "numpy>=2.1,<3" "Pillow>=11,<13"'
      - name: Compile original data-first film pilot and immutable retake
        run: python -m compileall -q tools/nvp_wo5_original_30m_pilot.py tests/test_nvp_wo5_original_30m_pilot.py
      - name: Verify exactly 30m original data, source shots, recorded PCM, SQLite persistence, new Take
        run: python -m unittest discover -s tests -p test_nvp_wo5_original_30m_pilot.py -v
      - name: Publish real original OpenUSD source-only project artifact for follow-on film mastering
        run: python -m tools.nvp_wo5_original_30m_pilot --output-root ci-original-30m
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: nvp-wo5-original-30m-source-${{ matrix.os }}-py${{ matrix.py }}
          path: ci-original-30m/
          retention-days: 7
          if-no-files-found: error
