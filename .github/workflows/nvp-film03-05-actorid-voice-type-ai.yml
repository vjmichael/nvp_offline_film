name: NVP FILM03-05 Canonical ActorID Appearance, Gait, VoiceType, AI Voice Source (NO FFMPEG)

on:
  push:
    branches: [nvp/film03-05-actor-identity-voice-type-ai-20261108]
  pull_request:
    branches: [nvp/film03-04-actor-voice-continuity-20261108]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nvp-film03-05-actor-core-${{ github.event_name }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  genuine-actorid-core:
    name: Actual Studio StoryBible + OpenUSD ActorID persona gait VoiceType and AI source / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 95
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install actual FilmIndex, native USD and Starlette client prerequisites
        run: |
          python -m pip install -r requirements-foundation.txt
          python -m pip install --only-binary=:all: "usd-core==26.11" numpy Pillow
          python -m pip install httpx2
      - name: Syntax compile original ActorID, VoiceID, generated type and host source
        run: |
          python -m compileall -q backend/nvp_film03_actor_identity_core.py backend/nvp_film03_voice_identity.py backend/nvp_film03_dialogue_manager.py backend/nvp_production_bible_actors.py backend/nvp_wo6_desktop_bridge.py tests/test_nvp_film03_actor_identity_core.py
      - name: Native ActorID source profile, off-gait, stable AI VoiceType, wrong actor/voice and OS creator approval
        run: python -m unittest discover -s tests -p test_nvp_film03_actor_identity_core.py -v
      - name: Preserve real original ActorID voice source and no-wrong-speaker regression
        run: python -m unittest discover -s tests -p test_nvp_film03_dialogue_manager.py -v
      - name: Preserve earlier StoryBible and actual OpenUSD actor asset identity
        run: |
          python -m unittest discover -s tests -p test_nvp_film03_actor_bible.py -v
          python -m unittest discover -s tests -p test_nvp_film03_object_dialogue.py -v
      - name: Verify no unimplemented TTS executed or voice matching falsely accepted
        shell: python
        run: |
          from pathlib import Path
          c=Path("backend/nvp_film03_actor_identity_core.py").read_text("utf8")
          assert "tts_worker_authorized" in c
          assert "audio_generation_executed" in c
          assert "engine_voice_id" in c
          assert "movement_peculiarities" in c
          print("Strict ActorID immutable profile and read-only AI voice input plan; no generated voice or installed film accepted")

  native-director-identity-ui:
    name: React StoryBible character persona movement and AI voice type / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025]
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install actual frontend pinned dependencies
        run: npm install --no-audit --no-fund
      - name: Test native host approved ActorID full character and inherited voice editor
        run: |
          npm run test:ui -- Film03ActorIdentityProfile.test.jsx
          npm run test:ui -- Film03ActorVoicePanel.test.jsx
          npm run test:ui -- Film03ProductionBiblePanel.test.jsx
      - name: Build real desktop WebView2/GTK production Bible source editor
        run: npm run build
