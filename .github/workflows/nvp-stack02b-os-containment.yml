name: NVP STACK-02B kernel-contained external Blender worker

on:
  push:
    branches:
      - nvp/stack02b-os-contained-blender-workers-20261103
  pull_request:
    branches:
      - nvp/stack02a-durable-blender-worker-20261103
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linux-kernel:
    name: Linux PDEATHSIG crash cleanup, virtual-memory cap, durability
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install only existing NVP test dependencies
        run: python -m pip install -r requirements-foundation.txt httpx trimesh
      - name: Run Linux kernel containment and historic worker regressions
        run: |
          python -m compileall -q backend tests tools
          python -m unittest discover -s tests -p test_worker_containment.py -v
          python -m unittest discover -s tests -p test_blender_worker.py -v
      - name: Preserve exact source for independent replay
        if: always()
        run: |
          zip -qr nvp_stack02b_source.zip backend tests tools requirements-foundation.txt
          sha256sum nvp_stack02b_source.zip > nvp_stack02b_source.sha256
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nvp-stack02b-exact-source
          path: |
            nvp_stack02b_source.zip
            nvp_stack02b_source.sha256
          retention-days: 7

  windows-job-objects:
    name: Windows suspended child Job Objects, crash kill and memory
    runs-on: windows-2025
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install NVP deps and maintained pywin32 Win32 API wrapper
        shell: pwsh
        run: |
          python -m pip install -r requirements-foundation.txt httpx trimesh
          python -m pip install 'pywin32==311'
      - name: Verify actual kernel job closure and re-run worker contracts
        shell: pwsh
        run: |
          $env:PYTHONPATH='.'
          python -m compileall -q backend tests tools
          if ($LASTEXITCODE -ne 0) { throw 'Compile failed' }
          python -m unittest discover -s tests -p test_worker_containment.py -v
          if ($LASTEXITCODE -ne 0) { throw 'Windows Job Object containment failed' }
          python -m unittest discover -s tests -p test_blender_worker.py -v
          if ($LASTEXITCODE -ne 0) { throw 'Windows durable journal regressions failed' }

  native-blender:
    name: Actual pinned Blender and NVP approved geometry under kernel containment
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      BLENDER_VERSION: '5.2.3'
      BLENDER_BASE: 'https://download.blender.org/release/Blender5.2'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install existing Blender/runtime dependencies
        run: |
          python -m pip install -r requirements-foundation.txt httpx trimesh
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends xvfb xauth libgl1 libegl1 libx11-6 libxi6 libxrender1 libxxf86vm1 libxkbcommon0
      - name: Download and SHA-verify actual external Blender binary
        shell: bash
        run: |
          set -euo pipefail
          archive="blender-$BLENDER_VERSION-linux-x64.tar.xz"
          curl --fail --location --retry 4 --retry-delay 5 "$BLENDER_BASE/$archive" -o "$archive"
          curl --fail --location --retry 4 --retry-delay 5 "$BLENDER_BASE/blender-$BLENDER_VERSION.sha256" -o blender.sha256
          grep "  $archive$" blender.sha256 | sha256sum --check --status
          mkdir -p /tmp/nvp-blender
          tar -xJf "$archive" -C /tmp/nvp-blender --strip-components=1
          echo "/tmp/nvp-blender" >> "$GITHUB_PATH"
      - name: Real Blender under PDEATHSIG / memory bound, frozen NVP scene and independent audit
        shell: bash
        run: |
          set -euo pipefail
          xvfb-run -a python -m tools.nvp_stack02a_worker_fixture --out acceptance_artifacts/stack02b
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nvp-stack02b-real-blender-contained-evidence
          path: acceptance_artifacts/stack02b/
          retention-days: 7
          if-no-files-found: warn
