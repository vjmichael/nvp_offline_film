name: NVP WO5 Original Short Proof Admission (NO FFMPEG)
on:
  push:
    branches: [nvp/wo5-production-proof-20261107]
    paths:
      - backend/nvp_wo5_original_short.py
      - tests/test_nvp_wo5_original_short.py
      - .github/workflows/nvp-wo5-original-short.yml
  pull_request:
    paths:
      - backend/nvp_wo5_original_short.py
      - tests/test_nvp_wo5_original_short.py
      - .github/workflows/nvp-wo5-original-short.yml
permissions:
  contents: read
jobs:
  native-original-proof-admission:
    name: WO5 source-verified short-film eligibility, never creative acceptance / ${{ matrix.os }} / Py ${{ matrix.py }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025]
        py: ['3.11','3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.py }}
      - name: Install pinned OpenUSD runtime for trusted source Take import
        run: python -m pip install 'usd-core==26.11'
      - name: Compile WO5 source review entrypoint and tests
        run: python -m compileall -q backend/nvp_wo5_original_short.py tests/test_nvp_wo5_original_short.py
      - name: Reject fake original film, repeated synthetic frames and untrusted grants
        run: python -m unittest discover -s tests -p test_nvp_wo5_original_short.py -v
