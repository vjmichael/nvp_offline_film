name: NVP E2E-01B Native Worker Integration
on:
  push:
    branches:
      - nvp/stack02c3b14-picture-conform-20261104
    paths:
      - 'backend/nvp_e2e01b_native_editorial.py'
      - 'backend/nvp_b13_native_reimport.py'
      - 'backend/nvp_b14_native_conform.py'
      - 'tests/test_nvp_e2e01b_native_handoff.py'
      - '.github/workflows/nvp-e2e01b-native.yml'
  pull_request:
    paths:
      - 'backend/nvp_e2e01b_native_editorial.py'
      - 'backend/nvp_b13_native_reimport.py'
      - 'backend/nvp_b14_native_conform.py'
      - 'tests/test_nvp_e2e01b_native_handoff.py'
      - '.github/workflows/nvp-e2e01b-native.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  handoff-contract:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025]
        python-version: ['3.11','3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install NVP native application dependencies
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install -r requirements-foundation.txt
          python -m pip install 'opentimelineio>=0.18.1,<0.19'
      - name: Compile actual B13/B14 native host plus E2E bridge
        shell: bash
        run: |
          set -euo pipefail
          python -m compileall -q backend/nvp_b13_native_reimport.py backend/nvp_b14_native_conform.py backend/nvp_e2e01b_native_editorial.py tests/test_nvp_e2e01b_native_handoff.py
      - name: Require durable native editorial handoff policy tests
        shell: bash
        run: |
          set -euo pipefail
          python -m unittest discover -s tests -p test_nvp_e2e01b_native_handoff.py -v
          python -m unittest discover -s tests -p test_b13_editorial_roundtrip.py -v
          python -m unittest discover -s tests -p test_b14_picture_conform.py -v
