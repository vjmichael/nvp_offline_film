name: NVP SLATE-08B Actual Desktop Host-to-Blender Camera Acceptance
on:
  push:
    branches:
      - nvp/slate08b-trusted-desktop-optics-20261106
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linux-real-blender:
    name: Linux real USD skinned actor through desktop IPC, authorized Blender and verified PNG
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      BLENDER_VERSION: "5.2.3"
      BLENDER_BASE: "https://download.blender.org/release/Blender5.2"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install actual OpenUSD and headless Blender dependencies
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install -r requirements-foundation.txt
          python -m pip install --only-binary=:all: "usd-core==26.11"
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends xvfb xauth libgl1 libegl1 libx11-6 libxi6 libxrender1 libxxf86vm1 libxkbcommon0
      - name: Verify and unpack official Blender binary
        shell: bash
        run: |
          set -euo pipefail
          archive="blender-$BLENDER_VERSION-linux-x64.tar.xz"
          curl --fail --location --retry 4 --retry-delay 5 "$BLENDER_BASE/$archive" -o "$archive"
          curl --fail --location --retry 4 --retry-delay 5 "$BLENDER_BASE/blender-$BLENDER_VERSION.sha256" -o blender.sha256
          grep "  $archive$" blender.sha256 | sha256sum --check --status
          mkdir -p /tmp/nvp-slate08b-blender
          tar -xJf "$archive" -C /tmp/nvp-slate08b-blender --strip-components=1
          "/tmp/nvp-slate08b-blender/blender" -b --version | head -n 2
          echo "NVP_NATIVE_BLENDER_EXECUTABLE=/tmp/nvp-slate08b-blender/blender" >> "$GITHUB_ENV"
      - name: Real director-scoped desktop bridge to Blender Cycles and SHA-verified PNG
        shell: bash
        run: |
          set -euo pipefail
          xvfb-run -a python -m unittest discover -s tests -p test_nvp_slate07_skinned_camera.py -v

  windows-real-blender:
    name: Windows real USD skinned actor, Job Object Blender and native IPC receipt
    runs-on: windows-2025
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install real Windows OpenUSD and process-tree containment
        shell: pwsh
        run: |
          python -m pip install -r requirements-foundation.txt
          if ($LASTEXITCODE -ne 0) { throw "Foundation install failed" }
          python -m pip install --only-binary=:all: 'usd-core==26.11'
          if ($LASTEXITCODE -ne 0) { throw "Windows native USD install failed" }
          python -m pip install 'pywin32==311'
          if ($LASTEXITCODE -ne 0) { throw "Windows process-tree binding failed" }
      - name: Verify official Blender portable Windows SHA before executing
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $base='https://download.blender.org/release/Blender5.2'
          $archive='blender-5.2.3-windows-x64.zip'
          & curl.exe --fail --location --retry 4 --retry-delay 5 --output $archive "$base/$archive"
          if ($LASTEXITCODE -ne 0) { throw 'Portable Blender download failed' }
          & curl.exe --fail --location --retry 4 --retry-delay 5 --output blender.sha256 "$base/blender-5.2.3.sha256"
          if ($LASTEXITCODE -ne 0) { throw 'Blender SHA manifest download failed' }
          $line=Get-Content blender.sha256 | Where-Object {
            $_ -match '(?i)^[a-f0-9]{64}\s+\*?blender-5\.2\.3-windows-x64\.zip\s*$'
          } | Select-Object -First 1
          if (-not $line) { throw 'Exact approved Blender zip missing from official checksum manifest' }
          $expected=($line -split '\s+')[0].ToLowerInvariant()
          $actual=(Get-FileHash -Algorithm SHA256 $archive).Hash.ToLowerInvariant()
          if ($expected -ne $actual) { throw 'Portable Blender ZIP SHA mismatch' }
          New-Item -ItemType Directory -Path _nvp_slate08b_blender -Force | Out-Null
          Expand-Archive -LiteralPath $archive -DestinationPath _nvp_slate08b_blender -Force
          $exe=Get-ChildItem -Path _nvp_slate08b_blender -Filter blender.exe -Recurse -File | Select-Object -First 1
          if (-not $exe) { throw 'Blender executable missing from official archive' }
          Add-Content -LiteralPath $env:GITHUB_ENV -Value "NVP_NATIVE_BLENDER_EXECUTABLE=$($exe.FullName)"
          & $exe.FullName -b --version
          if ($LASTEXITCODE -ne 0) { throw 'Real portable Blender failed to launch' }
      - name: Actual Windows director camera worker, source custody, and verified PNG
        shell: pwsh
        run: |
          python -m unittest discover -s tests -p test_nvp_slate07_skinned_camera.py -v
          if ($LASTEXITCODE -ne 0) { throw 'Windows real native SLATE-08B camera failed' }
