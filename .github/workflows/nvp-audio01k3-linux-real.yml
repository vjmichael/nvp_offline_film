name: NVP AUDIO-01K3 real Linux cinema encode
on:
  push:
    branches:
      - nvp/stack02c3b14-picture-conform-20261104
    paths:
      - 'backend/nvp_audio01k3_*'
      - 'tools/nvp_audio01k3_*'
      - 'tests/test_audio01k3_*'
      - '.github/workflows/nvp-audio01k3-linux-real.yml'
      - 'requirements-foundation.txt'
  pull_request:
    paths:
      - 'backend/nvp_audio01k3_*'
      - 'tools/nvp_audio01k3_*'
      - 'tests/test_audio01k3_*'
      - '.github/workflows/nvp-audio01k3-linux-real.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native-cinema-encode:
    runs-on: ubuntu-24.04
    timeout-minutes: 95
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install DCP dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y ffmpeg libxml2-utils ca-certificates curl tar
          python -m pip install -r requirements-foundation.txt
          mkdir -p "$RUNNER_TEMP/nvp-cinema" "$RUNNER_TEMP/nvp-cinema/bin"
          curl --fail --location --retry 3 --connect-timeout 20 \
            'https://dcpomatic.com/dl?id=ubuntu-24.04-x86-cli&version=2.18.51' \
            --output "$RUNNER_TEMP/nvp-cinema/dcpomatic-cli.deb"
          dpkg-deb --info "$RUNNER_TEMP/nvp-cinema/dcpomatic-cli.deb"
          package_version="$(dpkg-deb -f "$RUNNER_TEMP/nvp-cinema/dcpomatic-cli.deb" Version)"
          case "$package_version" in 2.18.51*) ;; *) echo "::error::Unexpected DCP-o-matic package version: $package_version"; exit 1 ;; esac
          sha256sum "$RUNNER_TEMP/nvp-cinema/dcpomatic-cli.deb"
          sudo apt-get install -y "$RUNNER_TEMP/nvp-cinema/dcpomatic-cli.deb"
          curl --fail --location --retry 3 --connect-timeout 20 \
            'https://github.com/PostPerfection/dcpdoctor/releases/download/v1.3.2/dcpdoctor-linux-x86_64.tar.gz' \
            --output "$RUNNER_TEMP/nvp-cinema/dcpdoctor.tar.gz"
          # sed drains the full listing: head can SIGPIPE tar under pipefail.
          tar -tzf "$RUNNER_TEMP/nvp-cinema/dcpdoctor.tar.gz" | sed -n '1,40p'
          tar -xzf "$RUNNER_TEMP/nvp-cinema/dcpdoctor.tar.gz" -C "$RUNNER_TEMP/nvp-cinema"
          # Require exactly one real regular-file CLI, instead of selecting an
          # arbitrary first hit through a find | head pipeline.
          mapfile -d '' doctors < <(find "$RUNNER_TEMP/nvp-cinema" -type f -name dcpdoctor -print0)
          if (( ${#doctors[@]} != 1 )); then
            echo "::error::Expected exactly one DcpDoctor CLI, found ${#doctors[@]}"
            exit 1
          fi
          doctor="${doctors[0]}"
          test -s "$doctor"
          install -m 0755 "$doctor" "$RUNNER_TEMP/nvp-cinema/bin/dcpdoctor"
          echo "$RUNNER_TEMP/nvp-cinema/bin" >> "$GITHUB_PATH"
      - name: Verify real DCP tools (no mocking or test skips)
        shell: bash
        run: |
          set -euo pipefail
          for bin in ffmpeg ffprobe xmllint dcpomatic2_create dcpomatic2_cli dcpdoctor; do
            command -v "$bin"
          done
          dcpomatic2_create --version
          dcpomatic2_cli --version
          dcpdoctor --version
          dcpomatic2_cli --version | grep -F '2.18.51'
          dcpdoctor --version | grep -F '1.3.2'
      - name: Run source contract and real native SMPTE DCP encode
        env:
          NVP_AUDIO01K3_ARTIFACT_DIR: ${{ runner.temp }}/nvp_dcp_candidate
        shell: bash
        run: |
          set -euo pipefail
          python -m compileall -q backend/nvp_audio01k3_dcp.py backend/nvp_audio01k3_native_host.py tools/nvp_audio01k3_dcp_worker.py tests/test_audio01k3_dcp_contract.py tests/test_audio01k3_native_dcp.py
          python -m unittest discover -s tests -p test_audio01k3_dcp_contract.py -v
          python -m unittest discover -s tests -p test_audio01k3_native_dcp.py -v
      - name: Preserve actual SMPTE DCP and independent QC evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nvp-audio01k3-real-linux-dcp-${{ github.run_id }}
          path: ${{ runner.temp }}/nvp_dcp_candidate/
          retention-days: 3
          if-no-files-found: warn
